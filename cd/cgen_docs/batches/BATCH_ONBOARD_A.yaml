# CGen Docs Waves - Batch Configuration
# T-TECHNOLOGY ON_BOARD Systems - Wave A

batch_id: BATCH_ONBOARD_A
name: "T-ON_BOARD Systems – Wave A"
description: |
  First wave covering Airframe, Aerodynamics, and Cockpit/Cabin/Cargo systems.
  Focus on deepening documentation, adding cross-references, and normalizing
  document control sections.
frequency: "P3D"          # Every 3 days (informational)
owner: "Amedeo Pelliccia"
version: "1.0"
created_at: "2025-12-04"

scope:
  - path: OPT-IN_FRAMEWORK/T-TECHNOLOGY_AMEDEOPELLICCIA-ON_BOARD_SYSTEMS/A-AIRFRAME
    patterns:
      - "**/*.md"
    exclude:
      - "**/00_INDEX.md"
      - "**/*_CGEN_DRAFT.md"

  - path: OPT-IN_FRAMEWORK/T-TECHNOLOGY_AMEDEOPELLICCIA-ON_BOARD_SYSTEMS/A2-AERODYNAMICS
    patterns:
      - "**/*.md"
    exclude:
      - "**/00_INDEX.md"
      - "**/*_CGEN_DRAFT.md"

  - path: OPT-IN_FRAMEWORK/T-TECHNOLOGY_AMEDEOPELLICCIA-ON_BOARD_SYSTEMS/C1-COCKPIT_CABIN_CARGO
    patterns:
      - "**/*.md"
    exclude:
      - "**/00_INDEX.md"
      - "**/*_CGEN_DRAFT.md"

targets:
  - type: deepen_sections
    description: "Expand high-level sections and fill TBD/TBR markers"
    priority: 1

  - type: add_cross_references
    description: "Add links to ATA chapters, LC cards, NN nodes"
    priority: 2

  - type: normalize_doc_control
    description: "Standardize Document Control sections"
    priority: 3

  - type: clarify_open_points
    description: "Document TODOs and next steps"
    priority: 4

context_sources:
  - path: OPT-IN_FRAMEWORK/README.md
    role: "framework_overview"

  - path: OPT-IN_FRAMEWORK/T-TECHNOLOGY_AMEDEOPELLICCIA-ON_BOARD_SYSTEMS/README.md
    role: "axis_overview"

  - path: OPT-IN_FRAMEWORK/ATA_CHAPTER_INDEX.md
    role: "ata_reference"

ai_policy:
  model: "gpt-5.1-codex"
  fallback_model: "gpt-4o"
  max_tokens_per_doc: 6000
  max_output_tokens: 8000
  temperature: 0.2
  require_human_review: true
  write_mode: "inplace"         # "inplace" or "draft_sidecar"
  draft_suffix: "_CGEN_DRAFT"

output:
  update_sidecars: true
  sidecar_extension: ".cgen.yaml"
  log_to_jsonl: true
  log_path: "cd/cgen_docs/logs"

# END OF BATCH CONFIGURATION
