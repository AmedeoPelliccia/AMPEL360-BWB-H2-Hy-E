# 97-40-20-10-101 — DP-SGD Profiles
# Approved differential privacy configurations for CFLF-GRAD federated learning
#
# Document ID: 97-40-20-10-101_DP-SGD_Profiles
# Version: 1.0
# Date: 2025-11-27
# Status: DRAFT

profiles:
  HIGH_PRIVACY:
    description: "Maximum privacy protection for sensitive data"
    clip_norm: 1.0
    noise_multiplier: 1.5
    max_steps_per_round: 100
    target_epsilon: 1.0
    target_delta: 1.0e-6
    use_cases:
      - passenger_telemetry
      - crew_behavior_data
      - operational_performance

  BALANCED_PRIVACY:
    description: "Balanced privacy-utility trade-off"
    clip_norm: 1.0
    noise_multiplier: 1.0
    max_steps_per_round: 500
    target_epsilon: 3.0
    target_delta: 1.0e-5
    use_cases:
      - predictive_maintenance
      - h2_efficiency_optimization
      - route_optimization

  RELAXED_PRIVACY:
    description: "Relaxed privacy for non-sensitive data"
    clip_norm: 2.0
    noise_multiplier: 0.5
    max_steps_per_round: 1000
    target_epsilon: 8.0
    target_delta: 1.0e-5
    use_cases:
      - environmental_sensors
      - public_weather_data
      - synthetic_simulation_data

  SIMULATION_ONLY:
    description: "No DP required - synthetic/simulated data only"
    clip_norm: null
    noise_multiplier: 0.0
    max_steps_per_round: null
    target_epsilon: null
    target_delta: null
    use_cases:
      - synthetic_training_data
      - simulation_benchmarks

