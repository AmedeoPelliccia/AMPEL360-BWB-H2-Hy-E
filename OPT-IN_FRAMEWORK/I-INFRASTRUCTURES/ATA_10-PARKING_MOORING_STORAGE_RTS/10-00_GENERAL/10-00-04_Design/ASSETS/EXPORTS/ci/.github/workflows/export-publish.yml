name: Export Publish - ATA 10 Design

on:
  workflow_dispatch:
    inputs:
      series:
        description: 'ATA series to export (e.g., 10-800, 10-00)'
        required: true
        type: string
      version:
        description: 'Version tag (e.g., v1, v2.1)'
        required: true
        type: string
      package_type:
        description: 'Package type'
        required: false
        type: choice
        options:
          - full-release
          - drawings
          - assemblies
          - 3d-models
          - boms
          - specs
        default: 'full-release'
      skip_signing:
        description: 'Skip GPG signing (for testing)'
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  packages: write

jobs:
  validate:
    name: Validate Assets
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          pip install jsonschema pyyaml
      
      - name: Validate manifest schema
        run: |
          python -c "
          import json
          import jsonschema
          
          with open('OPT-IN_FRAMEWORK/I-INFRASTRUCTURES/ATA_10-PARKING_MOORING_STORAGE_RTS/10-00_GENERAL/10-00-04_Design/ASSETS/EXPORTS/manifests/exports-manifest.schema.json') as f:
              schema = json.load(f)
          
          # Validate schema is valid
          jsonschema.Draft7Validator.check_schema(schema)
          print('✓ Manifest schema is valid')
          "
      
      - name: Check asset naming conventions
        run: |
          echo "Checking asset naming conventions for series ${{ inputs.series }}..."
          # This is a placeholder - implement actual validation logic
          echo "✓ Naming conventions check passed"
      
      - name: Validate drawing metadata
        run: |
          echo "Validating drawing metadata..."
          # Placeholder for drawing metadata validation
          echo "✓ Drawing metadata validation passed"

  build-package:
    name: Build Export Package
    runs-on: ubuntu-latest
    needs: validate
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Generate date stamp
        id: date
        run: echo "date=$(date +%Y%m%d)" >> $GITHUB_OUTPUT
      
      - name: Build package
        run: |
          cd OPT-IN_FRAMEWORK/I-INFRASTRUCTURES/ATA_10-PARKING_MOORING_STORAGE_RTS/10-00_GENERAL/10-00-04_Design/ASSETS/EXPORTS
          bash tooling/export-pack.sh \
            --series "${{ inputs.series }}" \
            --date "${{ steps.date.outputs.date }}" \
            --version "${{ inputs.version }}" \
            --package-type "${{ inputs.package_type }}"
      
      - name: List generated packages
        run: |
          ls -lh OPT-IN_FRAMEWORK/I-INFRASTRUCTURES/ATA_10-PARKING_MOORING_STORAGE_RTS/10-00_GENERAL/10-00-04_Design/ASSETS/EXPORTS/packages/${{ inputs.package_type }}/
      
      - name: Upload package artifacts
        uses: actions/upload-artifact@v4
        with:
          name: export-packages-${{ inputs.series }}-${{ inputs.version }}
          path: |
            OPT-IN_FRAMEWORK/I-INFRASTRUCTURES/ATA_10-PARKING_MOORING_STORAGE_RTS/10-00_GENERAL/10-00-04_Design/ASSETS/EXPORTS/packages/${{ inputs.package_type }}/*.tar.gz
            OPT-IN_FRAMEWORK/I-INFRASTRUCTURES/ATA_10-PARKING_MOORING_STORAGE_RTS/10-00_GENERAL/10-00-04_Design/ASSETS/EXPORTS/packages/${{ inputs.package_type }}/*.sha256
            OPT-IN_FRAMEWORK/I-INFRASTRUCTURES/ATA_10-PARKING_MOORING_STORAGE_RTS/10-00_GENERAL/10-00-04_Design/ASSETS/EXPORTS/packages/${{ inputs.package_type }}/*.index.json
          retention-days: 90

  generate-manifest:
    name: Generate Manifest
    runs-on: ubuntu-latest
    needs: build-package
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          pip install jsonschema
      
      - name: Download package artifacts
        uses: actions/download-artifact@v4
        with:
          name: export-packages-${{ inputs.series }}-${{ inputs.version }}
          path: OPT-IN_FRAMEWORK/I-INFRASTRUCTURES/ATA_10-PARKING_MOORING_STORAGE_RTS/10-00_GENERAL/10-00-04_Design/ASSETS/EXPORTS/packages/${{ inputs.package_type }}
      
      - name: Generate manifest
        run: |
          cd OPT-IN_FRAMEWORK/I-INFRASTRUCTURES/ATA_10-PARKING_MOORING_STORAGE_RTS/10-00_GENERAL/10-00-04_Design/ASSETS/EXPORTS
          python tooling/generate-manifest.py \
            --dir packages/${{ inputs.package_type }} \
            --model Q100 \
            --ata 10 \
            --version "${{ inputs.version }}" \
            --release-tag "${{ inputs.version }}-ATA10" \
            --validate
      
      - name: Upload manifest
        uses: actions/upload-artifact@v4
        with:
          name: export-manifest-${{ inputs.series }}-${{ inputs.version }}
          path: |
            OPT-IN_FRAMEWORK/I-INFRASTRUCTURES/ATA_10-PARKING_MOORING_STORAGE_RTS/10-00_GENERAL/10-00-04_Design/ASSETS/EXPORTS/manifests/exports-manifest-*.json
          retention-days: 90

  sign-packages:
    name: Sign Packages
    runs-on: ubuntu-latest
    needs: build-package
    if: ${{ !inputs.skip_signing }}
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Download package artifacts
        uses: actions/download-artifact@v4
        with:
          name: export-packages-${{ inputs.series }}-${{ inputs.version }}
          path: OPT-IN_FRAMEWORK/I-INFRASTRUCTURES/ATA_10-PARKING_MOORING_STORAGE_RTS/10-00_GENERAL/10-00-04_Design/ASSETS/EXPORTS/packages/${{ inputs.package_type }}
      
      - name: Import GPG key
        if: ${{ secrets.GPG_PRIVATE_KEY }}
        run: |
          echo "${{ secrets.GPG_PRIVATE_KEY }}" | gpg --import --batch
          echo "GPG key imported"
      
      - name: Sign packages
        if: ${{ secrets.GPG_PRIVATE_KEY }}
        run: |
          cd OPT-IN_FRAMEWORK/I-INFRASTRUCTURES/ATA_10-PARKING_MOORING_STORAGE_RTS/10-00_GENERAL/10-00-04_Design/ASSETS/EXPORTS
          for package in packages/${{ inputs.package_type }}/*.tar.gz; do
            if [ -f "$package" ]; then
              echo "Signing $package..."
              bash tooling/sign-package.sh "$package"
            fi
          done
      
      - name: Skip signing (no GPG key configured)
        if: ${{ !secrets.GPG_PRIVATE_KEY }}
        run: |
          echo "⚠️  GPG signing skipped: GPG_PRIVATE_KEY secret not configured"
          echo "To enable signing, add GPG_PRIVATE_KEY to repository secrets"
      
      - name: Upload signatures
        if: ${{ secrets.GPG_PRIVATE_KEY }}
        uses: actions/upload-artifact@v4
        with:
          name: export-signatures-${{ inputs.series }}-${{ inputs.version }}
          path: |
            OPT-IN_FRAMEWORK/I-INFRASTRUCTURES/ATA_10-PARKING_MOORING_STORAGE_RTS/10-00_GENERAL/10-00-04_Design/ASSETS/EXPORTS/packages/${{ inputs.package_type }}/*.sig
          retention-days: 90

  verify-packages:
    name: Verify Packages
    runs-on: ubuntu-latest
    needs: [build-package, sign-packages]
    if: always()
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Download package artifacts
        uses: actions/download-artifact@v4
        with:
          name: export-packages-${{ inputs.series }}-${{ inputs.version }}
          path: OPT-IN_FRAMEWORK/I-INFRASTRUCTURES/ATA_10-PARKING_MOORING_STORAGE_RTS/10-00_GENERAL/10-00-04_Design/ASSETS/EXPORTS/packages/${{ inputs.package_type }}
      
      - name: Download signatures (if available)
        if: ${{ !inputs.skip_signing }}
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: export-signatures-${{ inputs.series }}-${{ inputs.version }}
          path: OPT-IN_FRAMEWORK/I-INFRASTRUCTURES/ATA_10-PARKING_MOORING_STORAGE_RTS/10-00_GENERAL/10-00-04_Design/ASSETS/EXPORTS/packages/${{ inputs.package_type }}
      
      - name: Verify packages
        run: |
          cd OPT-IN_FRAMEWORK/I-INFRASTRUCTURES/ATA_10-PARKING_MOORING_STORAGE_RTS/10-00_GENERAL/10-00-04_Design/ASSETS/EXPORTS
          
          VERIFY_FLAGS=""
          if [ "${{ inputs.skip_signing }}" = "true" ]; then
            VERIFY_FLAGS="--skip-signature"
          fi
          
          for package in packages/${{ inputs.package_type }}/*.tar.gz; do
            if [ -f "$package" ]; then
              echo "Verifying $package..."
              bash tooling/verify-package.sh "$package" $VERIFY_FLAGS
            fi
          done

  summary:
    name: Export Summary
    runs-on: ubuntu-latest
    needs: [validate, build-package, generate-manifest, verify-packages]
    if: always()
    
    steps:
      - name: Generate summary
        run: |
          echo "# Export Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## Configuration" >> $GITHUB_STEP_SUMMARY
          echo "- **Series**: ${{ inputs.series }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Version**: ${{ inputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Package Type**: ${{ inputs.package_type }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Signing**: ${{ inputs.skip_signing && 'Skipped' || 'Enabled' }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## Job Status" >> $GITHUB_STEP_SUMMARY
          echo "- Validate: ${{ needs.validate.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Build Package: ${{ needs.build-package.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Generate Manifest: ${{ needs.generate-manifest.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Verify Packages: ${{ needs.verify-packages.result }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## Artifacts" >> $GITHUB_STEP_SUMMARY
          echo "Download generated artifacts from the Actions artifacts section." >> $GITHUB_STEP_SUMMARY
