<svg xmlns="http://www.w3.org/2000/svg" 
     xmlns:xlink="http://www.w3.org/1999/xlink"
     viewBox="0 0 800 600"
     width="800" height="600">
  
  <title>Audio Control Panel Removal Diagram</title>
  <desc>Exploded view showing audio control panel removal sequence and fastener locations</desc>
  
  <!-- Metadata -->
  <metadata>
    <rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#"
             xmlns:dc="http://purl.org/dc/elements/1.1/"
             xmlns:cc="http://creativecommons.org/ns#">
      <rdf:Description>
        <dc:title>Audio Control Panel Removal Diagram</dc:title>
        <dc:description>Exploded view showing audio control panel removal sequence and fastener locations</dc:description>
        <dc:creator>AMPEL360-AIR-T Project</dc:creator>
        <dc:date>2026-01-09</dc:date>
        <dc:identifier>ICN-AMPEL360AT-23-10-0030-A_001</dc:identifier>
        <dc:subject>ATA 23 Communications, Speech Communications, Exploded View</dc:subject>
        <dc:format>image/svg+xml</dc:format>
        <dc:type>Technical Illustration</dc:type>
      </rdf:Description>
    </rdf:RDF>
  </metadata>
  
  <defs>
    <!-- Standard styles for AMPEL360 technical illustrations -->
    <style type="text/css">
      .border { fill: none; stroke: #333333; stroke-width: 2; }
      .title-text { font-family: Arial, sans-serif; font-size: 20px; font-weight: bold; fill: #333333; }
      .subtitle-text { font-family: Arial, sans-serif; font-size: 12px; fill: #666666; }
      .icn-label { font-family: monospace; font-size: 12px; fill: #666666; }
      
      /* Exploded view elements */
      .component-box { fill: #ffffff; stroke: #000000; stroke-width: 2; }
      .component-light { fill: #f0f0f0; stroke: #000000; stroke-width: 1.5; }
      .fastener { fill: #666666; stroke: #000000; stroke-width: 1; }
      .connector { fill: #ffcc00; stroke: #000000; stroke-width: 1; }
      .label-text { font-family: Arial, sans-serif; font-size: 10px; fill: #000000; }
      .label-bold { font-family: Arial, sans-serif; font-size: 11px; font-weight: bold; fill: #000000; }
      .step-text { font-family: Arial, sans-serif; font-size: 9px; fill: #cc0000; font-weight: bold; }
      .detail-text { font-family: Arial, sans-serif; font-size: 8px; fill: #333333; }
      .dashed-line { stroke: #666666; stroke-width: 1; stroke-dasharray: 5,3; fill: none; }
      .arrow-line { stroke: #cc0000; stroke-width: 2; fill: none; marker-end: url(#arrow-red); }
      .dimension-line { stroke: #0066cc; stroke-width: 1; fill: none; }
      
      /* Button styles */
      .button-surface { fill: #e0e0e0; stroke: #333333; stroke-width: 1; }
      .button-label { font-family: Arial, sans-serif; font-size: 7px; fill: #000000; text-anchor: middle; }
    </style>
    
    <!-- Arrow marker -->
    <marker id="arrow-red" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#cc0000" />
    </marker>
  </defs>
  
  <!-- Border -->
  <rect class="border" x="10" y="10" width="780" height="580" rx="5" ry="5"/>
  
  <!-- Title Block -->
  <text class="title-text" x="400" y="35" text-anchor="middle">Audio Control Panel Removal Diagram</text>
  <text class="subtitle-text" x="400" y="50" text-anchor="middle">ATA 23-10-00 Speech Communications • Referenced by DM (InfoCode 520A) • Removal Procedure</text>
  
  <!-- Removal Sequence Steps (Left Side) -->
  <g id="removal-steps">
    <rect class="component-light" x="30" y="70" width="160" height="180" rx="5"/>
    <text class="label-bold" x="110" y="85" text-anchor="middle">Removal Sequence</text>
    
    <text class="step-text" x="40" y="105">STEP 1:</text>
    <text class="detail-text" x="40" y="115">De-energize aircraft electrical</text>
    <text class="detail-text" x="40" y="123">system. Verify no power to panel.</text>
    
    <text class="step-text" x="40" y="140">STEP 2:</text>
    <text class="detail-text" x="40" y="150">Disconnect connector J1</text>
    <text class="detail-text" x="40" y="158">(behind panel). Pull red tab,</text>
    <text class="detail-text" x="40" y="166">then withdraw connector.</text>
    
    <text class="step-text" x="40" y="180">STEP 3:</text>
    <text class="detail-text" x="40" y="190">Remove 4 mounting screws</text>
    <text class="detail-text" x="40" y="198">(Phillips #2, torque: TBD in-lbs)</text>
    <text class="detail-text" x="40" y="206">Screws at corners A, B, C, D.</text>
    
    <text class="step-text" x="40" y="220">STEP 4:</text>
    <text class="detail-text" x="40" y="230">Carefully pull panel forward</text>
    <text class="detail-text" x="40" y="238">from instrument panel cutout.</text>
  </g>
  
  <!-- Panel Installed Position (Top Center) -->
  <g id="panel-installed">
    <text class="label-bold" x="400" y="80" text-anchor="middle">Installed Position</text>
    
    <!-- Instrument panel cutout -->
    <rect class="component-light" x="300" y="90" width="200" height="140" rx="3"/>
    <text class="detail-text" x="400" y="105" text-anchor="middle">Instrument Panel (cutout view)</text>
    
    <!-- Audio Control Panel - Installed -->
    <rect class="component-box" x="330" y="120" width="140" height="90" rx="3"/>
    <text class="label-bold" x="400" y="135" text-anchor="middle">AUDIO CONTROL PANEL</text>
    <text class="detail-text" x="400" y="145" text-anchor="middle">(ACP1 or ACP2)</text>
    
    <!-- Panel face with buttons/controls -->
    <circle class="button-surface" cx="355" cy="165" r="10"/>
    <text class="button-label" x="355" y="168">VHF</text>
    
    <circle class="button-surface" cx="385" cy="165" r="10"/>
    <text class="button-label" x="385" y="168">HF</text>
    
    <circle class="button-surface" cx="415" cy="165" r="10"/>
    <text class="button-label" x="415" y="168">MASK</text>
    
    <circle class="button-surface" cx="445" cy="165" r="10"/>
    <text class="button-label" x="445" y="168">CALL</text>
    
    <circle class="button-surface" cx="400" cy="190" r="12"/>
    <text class="button-label" x="400" y="193">VOL</text>
    
    <!-- Mounting screw locations (corners) -->
    <circle class="fastener" cx="340" cy="130" r="4"/>
    <text class="detail-text" x="340" y="122" text-anchor="middle">A</text>
    
    <circle class="fastener" cx="460" cy="130" r="4"/>
    <text class="detail-text" x="460" y="122" text-anchor="middle">B</text>
    
    <circle class="fastener" cx="340" cy="200" r="4"/>
    <text class="detail-text" x="340" y="212" text-anchor="middle">C</text>
    
    <circle class="fastener" cx="460" cy="200" r="4"/>
    <text class="detail-text" x="460" y="212" text-anchor="middle">D</text>
  </g>
  
  <!-- Exploded View Arrow -->
  <path class="arrow-line" d="M 400 230 L 400 260"/>
  <text class="step-text" x="410" y="245">Remove panel</text>
  
  <!-- Panel Removed Position (Bottom Center) -->
  <g id="panel-removed">
    <text class="label-bold" x="400" y="280" text-anchor="middle">Exploded / Removed View</text>
    
    <!-- Audio Control Panel - Removed (separated from panel) -->
    <rect class="component-box" x="280" y="295" width="140" height="90" rx="3"/>
    <text class="label-bold" x="350" y="310" text-anchor="middle">AUDIO CONTROL PANEL</text>
    <text class="detail-text" x="350" y="320" text-anchor="middle">(Front face)</text>
    
    <!-- Panel face with buttons/controls (repeated) -->
    <circle class="button-surface" cx="305" cy="340" r="10"/>
    <text class="button-label" x="305" y="343">VHF</text>
    
    <circle class="button-surface" cx="335" cy="340" r="10"/>
    <text class="button-label" x="335" y="343">HF</text>
    
    <circle class="button-surface" cx="365" cy="340" r="10"/>
    <text class="button-label" x="365" y="343">MASK</text>
    
    <circle class="button-surface" cx="395" cy="340" r="10"/>
    <text class="button-label" x="395" y="343">CALL</text>
    
    <circle class="button-surface" cx="350" cy="365" r="12"/>
    <text class="button-label" x="350" y="368">VOL</text>
    
    <!-- Rear view of panel -->
    <rect class="component-light" x="450" y="295" width="110" height="90" rx="3"/>
    <text class="label-bold" x="505" y="310" text-anchor="middle">Rear View</text>
    
    <!-- Connector J1 (yellow) -->
    <rect class="connector" x="485" y="330" width="40" height="30" rx="2"/>
    <text class="detail-text" x="505" y="343" text-anchor="middle">Connector</text>
    <text class="detail-text" x="505" y="352" text-anchor="middle">J1</text>
    
    <!-- Mounting holes -->
    <circle class="fastener" cx="460" cy="305" r="3"/>
    <circle class="fastener" cx="550" cy="305" r="3"/>
    <circle class="fastener" cx="460" cy="375" r="3"/>
    <circle class="fastener" cx="550" cy="375" r="3"/>
  </g>
  
  <!-- Connector Detail (Right Side) -->
  <g id="connector-detail">
    <rect class="component-light" x="610" y="70" width="165" height="130" rx="5"/>
    <text class="label-bold" x="692" y="85" text-anchor="middle">Connector J1 Detail</text>
    
    <!-- Connector illustration -->
    <rect class="connector" x="650" y="95" width="85" height="55" rx="3"/>
    <text class="detail-text" x="692" y="110" text-anchor="middle">38-pin connector</text>
    <text class="detail-text" x="692" y="120" text-anchor="middle">P/N: TBD</text>
    
    <!-- Pin rows indication -->
    <circle fill="#333333" cx="660" cy="135" r="2"/>
    <circle fill="#333333" cx="670" cy="135" r="2"/>
    <circle fill="#333333" cx="680" cy="135" r="2"/>
    <text class="detail-text" x="692" y="140" text-anchor="middle">...</text>
    <circle fill="#333333" cx="704" cy="135" r="2"/>
    <circle fill="#333333" cx="714" cy="135" r="2"/>
    <circle fill="#333333" cx="724" cy="135" r="2"/>
    
    <text class="step-text" x="620" y="170">Disconnection:</text>
    <text class="detail-text" x="620" y="180">1) Pull red locking tab</text>
    <text class="detail-text" x="620" y="188">2) Grasp connector body</text>
    <text class="detail-text" x="620" y="196">3) Pull straight back</text>
  </g>
  
  <!-- Fastener Detail (Right Side Bottom) -->
  <g id="fastener-detail">
    <rect class="component-light" x="610" y="210" width="165" height="110" rx="5"/>
    <text class="label-bold" x="692" y="225" text-anchor="middle">Mounting Screw Detail</text>
    
    <!-- Screw illustration -->
    <circle class="fastener" cx="665" cy="245" r="8"/>
    <line stroke="#000000" stroke-width="2" x1="665" y1="253" x2="665" y2="270"/>
    <line stroke="#000000" stroke-width="6" x1="660" y1="265" x2="670" y2="265"/>
    <line stroke="#000000" stroke-width="6" x1="660" y1="268" x2="670" y2="268"/>
    
    <text class="detail-text" x="685" y="250">Phillips #2 screw</text>
    <text class="detail-text" x="685" y="260">Qty: 4 (corners A,B,C,D)</text>
    
    <text class="step-text" x="620" y="285">Torque Specification:</text>
    <text class="detail-text" x="620" y="295">Install: TBD in-lbs (TBD N·m)</text>
    <text class="detail-text" x="620" y="303">Ref: AMM Task 23-10-00-520-801</text>
    <text class="detail-text" x="620" y="311">Use torque wrench per SRM</text>
  </g>
  
  <!-- Warnings and Notes (Bottom) -->
  <g id="warnings">
    <rect class="component-light" x="30" y="420" width="740" height="130" rx="5"/>
    <text class="label-bold" x="400" y="435" text-anchor="middle">CAUTIONS / NOTES / REFERENCES</text>
    
    <text class="step-text" x="40" y="455">CAUTION:</text>
    <text class="detail-text" x="100" y="455">Ensure aircraft electrical system is de-energized before panel removal to prevent</text>
    <text class="detail-text" x="100" y="463">electrical shock or damage to avionics.</text>
    
    <text class="step-text" x="40" y="480">CAUTION:</text>
    <text class="detail-text" x="100" y="480">Handle connector J1 carefully. Do not pull on wires. Grasp connector body only.</text>
    
    <text class="step-text" x="40" y="500">NOTE:</text>
    <text class="detail-text" x="80" y="500">Mounting screws have captive washers. Retain screws for reinstallation.</text>
    
    <text class="step-text" x="40" y="515">NOTE:</text>
    <text class="detail-text" x="80" y="515">For installation procedure, refer to ICN-AMPEL360AT-23-10-0031-A_001 (Installation diagram)</text>
    <text class="detail-text" x="80" y="523">and AMM Task 23-10-00-620-801.</text>
    
    <text class="step-text" x="40" y="538">REFERENCES:</text>
    <text class="detail-text" x="110" y="538">• AMM 23-10-00-520-801: Audio Control Panel Removal</text>
    <text class="detail-text" x="110" y="546">• Wiring Diagram Manual: Audio distribution (ICN-...-0002)</text>
  </g>
  
  <!-- ICN Label -->
  <text class="icn-label" x="20" y="575">ICN-AMPEL360AT-23-10-0030-A_001</text>
  
  <!-- Sheet/Page Info -->
  <text class="icn-label" x="780" y="575" text-anchor="end">Sheet 1 of 1</text>
  
</svg>
