<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <title>61-90-20_01-02-FIG_001 — Electric Motor Rotor Assembly</title>
  <desc>Exploded view of 4 MW PMSM rotor assembly showing shaft, core, and magnets</desc>
  
  <!-- Background -->
  <rect width="800" height="600" fill="#f8f9fa"/>
  
  <!-- Title Block -->
  <rect x="10" y="10" width="780" height="40" fill="#2c3e50" rx="3"/>
  <text x="400" y="35" fill="white" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" font-weight="bold">
    61-90-20_01-02-FIG_001 — Rotor Assembly Exploded View
  </text>
  
  <!-- Drawing Area -->
  <rect x="20" y="60" width="550" height="480" fill="white" stroke="#ddd"/>
  
  <!-- Motor Shaft -->
  <rect x="80" y="270" width="420" height="60" fill="#718096" stroke="#4a5568" stroke-width="2" rx="3"/>
  <!-- Shaft steps -->
  <rect x="60" y="280" width="40" height="40" fill="#a0aec0" stroke="#4a5568" stroke-width="1.5"/>
  <rect x="480" y="285" width="40" height="30" fill="#a0aec0" stroke="#4a5568" stroke-width="1.5"/>
  
  <!-- Splined coupling end -->
  <g stroke="#4a5568" stroke-width="1">
    <line x1="65" y1="285" x2="65" y2="315"/>
    <line x1="75" y1="285" x2="75" y2="315"/>
    <line x1="85" y1="285" x2="85" y2="315"/>
  </g>
  
  <!-- Rotor Core -->
  <ellipse cx="290" cy="190" rx="100" ry="25" fill="#8e9bae" stroke="#4a5568" stroke-width="2"/>
  <rect x="190" y="130" width="200" height="60" fill="#a0aec0" stroke="#4a5568" stroke-width="2"/>
  <ellipse cx="290" cy="130" rx="100" ry="25" fill="#cbd5e0" stroke="#4a5568" stroke-width="2"/>
  
  <!-- V-shaped magnets representation -->
  <g fill="#d53f8c" stroke="#97266d" stroke-width="1">
    <polygon points="210,140 225,150 225,170 210,180"/>
    <polygon points="235,140 250,130 250,180 235,170"/>
    <polygon points="270,140 285,150 285,170 270,180"/>
    <polygon points="295,140 310,130 310,180 295,170"/>
    <polygon points="330,140 345,150 345,170 330,180"/>
    <polygon points="355,140 370,130 370,180 355,170"/>
  </g>
  
  <!-- Carbon fiber retention sleeve -->
  <ellipse cx="290" cy="100" rx="110" ry="15" fill="none" stroke="#2d3748" stroke-width="3" stroke-dasharray="5,3"/>
  <text x="290" y="85" font-family="Arial" font-size="8" text-anchor="middle" fill="#2d3748">CF SLEEVE</text>
  
  <!-- End plates -->
  <ellipse cx="200" cy="160" rx="30" ry="60" fill="#4299e1" stroke="#2b6cb0" stroke-width="1.5" transform="rotate(-15,200,160)"/>
  <ellipse cx="380" cy="160" rx="30" ry="60" fill="#4299e1" stroke="#2b6cb0" stroke-width="1.5" transform="rotate(15,380,160)"/>
  
  <!-- Balance planes indication -->
  <circle cx="140" cy="300" r="5" fill="#38a169"/>
  <circle cx="440" cy="300" r="5" fill="#38a169"/>
  <text x="140" y="320" font-family="Arial" font-size="8" text-anchor="middle" fill="#38a169">BAL</text>
  <text x="440" y="320" font-family="Arial" font-size="8" text-anchor="middle" fill="#38a169">BAL</text>
  
  <!-- Assembly arrows -->
  <g stroke="#e53e3e" stroke-width="2" fill="none" marker-end="url(#arrowhead)">
    <defs>
      <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
        <polygon points="0 0, 10 3.5, 0 7" fill="#e53e3e"/>
      </marker>
    </defs>
    <line x1="290" y1="210" x2="290" y2="250"/>
  </g>
  
  <!-- Legend Panel -->
  <rect x="580" y="60" width="200" height="220" fill="#f7fafc" stroke="#e2e8f0" rx="5"/>
  <text x="680" y="85" font-family="Arial" font-size="12" font-weight="bold" text-anchor="middle">COMPONENTS</text>
  
  <rect x="595" y="100" width="15" height="15" fill="#718096" stroke="#4a5568"/>
  <text x="620" y="112" font-family="Arial" font-size="10">Motor Shaft (4340)</text>
  
  <rect x="595" y="125" width="15" height="15" fill="#a0aec0" stroke="#4a5568"/>
  <text x="620" y="137" font-family="Arial" font-size="10">Rotor Core (M19)</text>
  
  <rect x="595" y="150" width="15" height="15" fill="#d53f8c" stroke="#97266d"/>
  <text x="620" y="162" font-family="Arial" font-size="10">PM (NdFeB N48UH)</text>
  
  <rect x="595" y="175" width="15" height="3" fill="none" stroke="#2d3748" stroke-width="2" stroke-dasharray="3,2"/>
  <text x="620" y="182" font-family="Arial" font-size="10">CF Retention Sleeve</text>
  
  <rect x="595" y="200" width="15" height="15" fill="#4299e1" stroke="#2b6cb0"/>
  <text x="620" y="212" font-family="Arial" font-size="10">End Plates (Al-7075)</text>
  
  <circle cx="602" cy="240" r="6" fill="#38a169"/>
  <text x="620" y="245" font-family="Arial" font-size="10">Balance Planes</text>
  
  <!-- Specifications Panel -->
  <rect x="580" y="290" width="200" height="150" fill="#f7fafc" stroke="#e2e8f0" rx="5"/>
  <text x="680" y="315" font-family="Arial" font-size="12" font-weight="bold" text-anchor="middle">SPECIFICATIONS</text>
  
  <text x="595" y="335" font-family="Arial" font-size="9">Rotor OD: 415 mm</text>
  <text x="595" y="350" font-family="Arial" font-size="9">Active Length: 380 mm</text>
  <text x="595" y="365" font-family="Arial" font-size="9">Poles: 12 (V-IPM)</text>
  <text x="595" y="380" font-family="Arial" font-size="9">Magnet Mass: 33.6 kg</text>
  <text x="595" y="395" font-family="Arial" font-size="9">Shaft Mass: 42 kg</text>
  <text x="595" y="410" font-family="Arial" font-size="9">Total Mass: 125 kg</text>
  <text x="595" y="425" font-family="Arial" font-size="9">Balance: G 2.5</text>
  
  <!-- Document Control -->
  <rect x="580" y="450" width="200" height="90" fill="#edf2f7" stroke="#e2e8f0" rx="5"/>
  <text x="595" y="470" font-family="Arial" font-size="9" font-weight="bold">Document Control</text>
  <text x="595" y="490" font-family="Arial" font-size="8">ATA: 61-20-01</text>
  <text x="595" y="505" font-family="Arial" font-size="8">LRI: LRI-61-20-01-02</text>
  <text x="595" y="520" font-family="Arial" font-size="8">Rev: 1.0 | 2025-12-01</text>
</svg>
