<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 400">
  <title>61-20-01 Electric Motor — Electrical Equivalent Circuit</title>
  <desc>Electrical equivalent circuit for PMSM motor model</desc>
  
  <!-- Background -->
  <rect width="700" height="400" fill="#f8f9fa"/>
  
  <!-- Title -->
  <text x="350" y="30" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#2c3e50" font-weight="bold">
    61-20-01 Electric Motor — Electrical Equivalent Circuit (d-q axis)
  </text>
  
  <!-- d-axis circuit -->
  <g transform="translate(50, 80)">
    <text x="0" y="0" font-family="Arial, sans-serif" font-size="14" fill="#2c3e50" font-weight="bold">d-axis</text>
    
    <!-- Resistor Rs -->
    <line x1="30" y1="40" x2="60" y2="40" stroke="#2c3e50" stroke-width="2"/>
    <path d="M 60 40 L 65 30 L 75 50 L 85 30 L 95 50 L 105 30 L 115 50 L 120 40" fill="none" stroke="#e74c3c" stroke-width="2"/>
    <line x1="120" y1="40" x2="150" y2="40" stroke="#2c3e50" stroke-width="2"/>
    <text x="90" y="70" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#e74c3c">Rs</text>
    
    <!-- Inductor Ld -->
    <line x1="150" y1="40" x2="170" y2="40" stroke="#2c3e50" stroke-width="2"/>
    <path d="M 170 40 Q 180 20 190 40 Q 200 60 210 40 Q 220 20 230 40 Q 240 60 250 40" fill="none" stroke="#3498db" stroke-width="2"/>
    <line x1="250" y1="40" x2="270" y2="40" stroke="#2c3e50" stroke-width="2"/>
    <text x="210" y="75" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#3498db">Ld</text>
    
    <!-- Cross-coupling term -->
    <line x1="270" y1="40" x2="330" y2="40" stroke="#2c3e50" stroke-width="2"/>
    <circle cx="300" cy="40" r="15" fill="none" stroke="#27ae60" stroke-width="2"/>
    <text x="300" y="45" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#27ae60">ωLq·iq</text>
    
    <!-- Voltage source Vd -->
    <line x1="330" y1="40" x2="370" y2="40" stroke="#2c3e50" stroke-width="2"/>
    <circle cx="395" cy="40" r="20" fill="none" stroke="#9b59b6" stroke-width="2"/>
    <text x="395" y="45" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#9b59b6">Vd</text>
    <line x1="415" y1="40" x2="450" y2="40" stroke="#2c3e50" stroke-width="2"/>
    
    <!-- Current label -->
    <text x="15" y="45" font-family="Arial, sans-serif" font-size="12" fill="#2c3e50">id →</text>
  </g>
  
  <!-- q-axis circuit -->
  <g transform="translate(50, 200)">
    <text x="0" y="0" font-family="Arial, sans-serif" font-size="14" fill="#2c3e50" font-weight="bold">q-axis</text>
    
    <!-- Resistor Rs -->
    <line x1="30" y1="40" x2="60" y2="40" stroke="#2c3e50" stroke-width="2"/>
    <path d="M 60 40 L 65 30 L 75 50 L 85 30 L 95 50 L 105 30 L 115 50 L 120 40" fill="none" stroke="#e74c3c" stroke-width="2"/>
    <line x1="120" y1="40" x2="150" y2="40" stroke="#2c3e50" stroke-width="2"/>
    <text x="90" y="70" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#e74c3c">Rs</text>
    
    <!-- Inductor Lq -->
    <line x1="150" y1="40" x2="170" y2="40" stroke="#2c3e50" stroke-width="2"/>
    <path d="M 170 40 Q 180 20 190 40 Q 200 60 210 40 Q 220 20 230 40 Q 240 60 250 40" fill="none" stroke="#3498db" stroke-width="2"/>
    <line x1="250" y1="40" x2="270" y2="40" stroke="#2c3e50" stroke-width="2"/>
    <text x="210" y="75" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#3498db">Lq</text>
    
    <!-- Cross-coupling and back-EMF -->
    <line x1="270" y1="40" x2="330" y2="40" stroke="#2c3e50" stroke-width="2"/>
    <circle cx="300" cy="40" r="15" fill="none" stroke="#27ae60" stroke-width="2"/>
    <text x="300" y="45" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#27ae60">ωLd·id</text>
    
    <!-- Back-EMF -->
    <line x1="330" y1="40" x2="370" y2="40" stroke="#2c3e50" stroke-width="2"/>
    <circle cx="395" cy="40" r="20" fill="none" stroke="#f39c12" stroke-width="2"/>
    <text x="395" y="45" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#f39c12">ωψf</text>
    <line x1="415" y1="40" x2="450" y2="40" stroke="#2c3e50" stroke-width="2"/>
    
    <!-- Voltage source Vq -->
    <line x1="450" y1="40" x2="490" y2="40" stroke="#2c3e50" stroke-width="2"/>
    <circle cx="515" cy="40" r="20" fill="none" stroke="#9b59b6" stroke-width="2"/>
    <text x="515" y="45" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#9b59b6">Vq</text>
    <line x1="535" y1="40" x2="570" y2="40" stroke="#2c3e50" stroke-width="2"/>
    
    <!-- Current label -->
    <text x="15" y="45" font-family="Arial, sans-serif" font-size="12" fill="#2c3e50">iq →</text>
  </g>
  
  <!-- Parameter values -->
  <g transform="translate(500, 80)">
    <rect x="0" y="0" width="180" height="150" fill="white" stroke="#bdc3c7" rx="5"/>
    <text x="90" y="20" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#2c3e50" font-weight="bold">Parameters</text>
    <text x="10" y="45" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">Rs = 8.5 mΩ</text>
    <text x="10" y="65" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">Ld = 0.42 mH</text>
    <text x="10" y="85" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">Lq = 0.65 mH</text>
    <text x="10" y="105" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">ψf = 0.85 Wb</text>
    <text x="10" y="125" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">p = 8 pole pairs</text>
    <text x="10" y="145" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">J = 12.5 kg·m²</text>
  </g>
  
  <!-- Equations -->
  <g transform="translate(50, 320)">
    <text x="0" y="0" font-family="Arial, sans-serif" font-size="12" fill="#2c3e50" font-weight="bold">Torque Equation:</text>
    <text x="0" y="20" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">Te = (3/2) · p · [ψf·iq + (Ld - Lq)·id·iq]</text>
    
    <text x="300" y="0" font-family="Arial, sans-serif" font-size="12" fill="#2c3e50" font-weight="bold">Mechanical:</text>
    <text x="300" y="20" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">J·(dω/dt) = Te - TL - B·ω</text>
  </g>
  
  <!-- Document info -->
  <text x="10" y="390" font-family="Arial, sans-serif" font-size="9" fill="#7f8c8d">
    Document: schema-electrical.svg | Version: 1.0 | OPT-IN Framework v1.2
  </text>
</svg>
