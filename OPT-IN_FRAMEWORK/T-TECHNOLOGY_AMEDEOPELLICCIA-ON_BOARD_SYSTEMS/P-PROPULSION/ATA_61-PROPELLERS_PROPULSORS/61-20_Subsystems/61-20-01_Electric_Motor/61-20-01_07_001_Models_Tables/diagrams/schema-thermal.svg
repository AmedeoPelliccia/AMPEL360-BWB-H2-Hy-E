<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500">
  <title>61-20-01 Electric Motor — Thermal Network Schematic</title>
  <desc>Lumped parameter thermal model for motor analysis</desc>
  
  <!-- Background -->
  <rect width="800" height="500" fill="#f8f9fa"/>
  
  <!-- Title -->
  <text x="400" y="30" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#2c3e50" font-weight="bold">
    61-20-01 Electric Motor — Thermal Network Model
  </text>
  
  <!-- Winding nodes -->
  <g transform="translate(100, 100)">
    <circle cx="0" cy="0" r="25" fill="#e74c3c" stroke="#c0392b" stroke-width="2"/>
    <text x="0" y="5" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="white">Winding</text>
    <text x="0" y="50" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="#2c3e50">Cu Loss</text>
    <text x="0" y="62" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="#7f8c8d">85 kW</text>
  </g>
  
  <!-- Stator core node -->
  <g transform="translate(250, 100)">
    <circle cx="0" cy="0" r="25" fill="#e67e22" stroke="#d35400" stroke-width="2"/>
    <text x="0" y="5" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="white">Core</text>
    <text x="0" y="50" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="#2c3e50">Fe Loss</text>
    <text x="0" y="62" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="#7f8c8d">35 kW</text>
  </g>
  
  <!-- Cooling jacket node -->
  <g transform="translate(400, 100)">
    <circle cx="0" cy="0" r="25" fill="#3498db" stroke="#2980b9" stroke-width="2"/>
    <text x="0" y="5" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="white">Jacket</text>
  </g>
  
  <!-- Coolant node -->
  <g transform="translate(550, 100)">
    <circle cx="0" cy="0" r="25" fill="#1abc9c" stroke="#16a085" stroke-width="2"/>
    <text x="0" y="5" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="white">Coolant</text>
    <text x="0" y="50" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="#2c3e50">To HX</text>
  </g>
  
  <!-- Air gap node -->
  <g transform="translate(250, 220)">
    <circle cx="0" cy="0" r="20" fill="#95a5a6" stroke="#7f8c8d" stroke-width="2"/>
    <text x="0" y="5" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="white">Air Gap</text>
  </g>
  
  <!-- Rotor node -->
  <g transform="translate(400, 220)">
    <circle cx="0" cy="0" r="25" fill="#9b59b6" stroke="#8e44ad" stroke-width="2"/>
    <text x="0" y="5" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="white">Rotor</text>
    <text x="0" y="50" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="#2c3e50">Rotor Loss</text>
    <text x="0" y="62" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="#7f8c8d">8 kW</text>
  </g>
  
  <!-- Magnet node -->
  <g transform="translate(550, 220)">
    <circle cx="0" cy="0" r="20" fill="#e91e63" stroke="#c2185b" stroke-width="2"/>
    <text x="0" y="5" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="white">Magnets</text>
  </g>
  
  <!-- Shaft node -->
  <g transform="translate(400, 340)">
    <circle cx="0" cy="0" r="20" fill="#607d8b" stroke="#455a64" stroke-width="2"/>
    <text x="0" y="5" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="white">Shaft</text>
  </g>
  
  <!-- DE Bearing node -->
  <g transform="translate(250, 340)">
    <circle cx="0" cy="0" r="20" fill="#ff9800" stroke="#f57c00" stroke-width="2"/>
    <text x="0" y="5" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="white">DE Brg</text>
    <text x="0" y="45" font-family="Arial, sans-serif" font-size="8" text-anchor="middle" fill="#7f8c8d">3.5 kW</text>
  </g>
  
  <!-- NDE Bearing node -->
  <g transform="translate(550, 340)">
    <circle cx="0" cy="0" r="20" fill="#ff9800" stroke="#f57c00" stroke-width="2"/>
    <text x="0" y="5" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="white">NDE Brg</text>
    <text x="0" y="45" font-family="Arial, sans-serif" font-size="8" text-anchor="middle" fill="#7f8c8d">3 kW</text>
  </g>
  
  <!-- Housing node -->
  <g transform="translate(400, 440)">
    <circle cx="0" cy="0" r="25" fill="#34495e" stroke="#2c3e50" stroke-width="2"/>
    <text x="0" y="5" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="white">Housing</text>
  </g>
  
  <!-- Ambient -->
  <g transform="translate(700, 440)">
    <rect x="-30" y="-15" width="60" height="30" fill="#27ae60" stroke="#229954" stroke-width="2"/>
    <text x="0" y="5" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="white">Ambient</text>
  </g>
  
  <!-- Thermal resistances (connections) -->
  <!-- Winding to Core -->
  <line x1="125" y1="100" x2="225" y2="100" stroke="#2c3e50" stroke-width="2"/>
  <text x="175" y="90" font-family="Arial, sans-serif" font-size="8" text-anchor="middle" fill="#7f8c8d">0.012 K/W</text>
  
  <!-- Core to Jacket -->
  <line x1="275" y1="100" x2="375" y2="100" stroke="#2c3e50" stroke-width="2"/>
  <text x="325" y="90" font-family="Arial, sans-serif" font-size="8" text-anchor="middle" fill="#7f8c8d">0.008 K/W</text>
  
  <!-- Jacket to Coolant -->
  <line x1="425" y1="100" x2="525" y2="100" stroke="#2c3e50" stroke-width="2"/>
  <text x="475" y="90" font-family="Arial, sans-serif" font-size="8" text-anchor="middle" fill="#7f8c8d">0.004 K/W</text>
  
  <!-- Core to Air Gap -->
  <line x1="250" y1="125" x2="250" y2="200" stroke="#2c3e50" stroke-width="2"/>
  <text x="260" y="165" font-family="Arial, sans-serif" font-size="8" fill="#7f8c8d">0.15</text>
  
  <!-- Air Gap to Rotor -->
  <line x1="270" y1="220" x2="375" y2="220" stroke="#2c3e50" stroke-width="2"/>
  <text x="320" y="210" font-family="Arial, sans-serif" font-size="8" text-anchor="middle" fill="#7f8c8d">0.10 K/W</text>
  
  <!-- Rotor to Magnets -->
  <line x1="425" y1="220" x2="530" y2="220" stroke="#2c3e50" stroke-width="2"/>
  <text x="475" y="210" font-family="Arial, sans-serif" font-size="8" text-anchor="middle" fill="#7f8c8d">0.02 K/W</text>
  
  <!-- Rotor to Shaft -->
  <line x1="400" y1="245" x2="400" y2="320" stroke="#2c3e50" stroke-width="2"/>
  <text x="410" y="285" font-family="Arial, sans-serif" font-size="8" fill="#7f8c8d">0.03</text>
  
  <!-- Shaft to Bearings -->
  <line x1="380" y1="340" x2="270" y2="340" stroke="#2c3e50" stroke-width="2"/>
  <line x1="420" y1="340" x2="530" y2="340" stroke="#2c3e50" stroke-width="2"/>
  
  <!-- Bearings to Housing -->
  <line x1="250" y1="360" x2="380" y2="420" stroke="#2c3e50" stroke-width="2"/>
  <line x1="550" y1="360" x2="420" y2="420" stroke="#2c3e50" stroke-width="2"/>
  
  <!-- Housing to Ambient -->
  <line x1="425" y1="440" x2="670" y2="440" stroke="#2c3e50" stroke-width="2"/>
  <text x="550" y="430" font-family="Arial, sans-serif" font-size="8" text-anchor="middle" fill="#7f8c8d">0.10 K/W</text>
  
  <!-- Legend -->
  <g transform="translate(620, 80)">
    <rect x="0" y="0" width="150" height="120" fill="white" stroke="#bdc3c7" rx="5"/>
    <text x="75" y="18" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#2c3e50" font-weight="bold">Legend</text>
    <circle cx="20" cy="40" r="8" fill="#e74c3c"/>
    <text x="35" y="44" font-family="Arial, sans-serif" font-size="9" fill="#2c3e50">Heat source</text>
    <circle cx="20" cy="60" r="8" fill="#3498db"/>
    <text x="35" y="64" font-family="Arial, sans-serif" font-size="9" fill="#2c3e50">Cooling path</text>
    <line x1="10" y1="80" x2="30" y2="80" stroke="#2c3e50" stroke-width="2"/>
    <text x="35" y="84" font-family="Arial, sans-serif" font-size="9" fill="#2c3e50">Thermal resistance</text>
    <text x="10" y="105" font-family="Arial, sans-serif" font-size="8" fill="#7f8c8d">Total: 140 kW nominal</text>
  </g>
  
  <!-- Document info -->
  <text x="10" y="490" font-family="Arial, sans-serif" font-size="9" fill="#7f8c8d">
    Document: schema-thermal.svg | Version: 1.0 | OPT-IN Framework v1.2
  </text>
</svg>
