# 61-20-XX Subsystem Metadata Schema
# ATA Chapter 61 – Propellers/Propulsors
# Template for LRU/LRI configuration

# Schema Version
schema_version: "1.0.0"
template_version: "1.0.0"

# Subsystem Identification
subsystem:
  id: "61-20-XX"
  ata_chapter: 61
  ata_section: 20
  sequence: "XX"  # Replace with actual sequence number
  name: "[Subsystem Name]"
  description: "[Brief description of the subsystem's purpose and function]"
  status: "WIP"  # Options: WIP, DRAFT, REVIEW, APPROVED, DEPRECATED

# LRU Definition
lru:
  part_number: "PN-61-20-XX-001"
  nomenclature: "[Subsystem Name] Unit"
  manufacturer: "[TBD]"
  cage_code: "[TBD]"
  drawing_number: "[TBD]"
  
  physical:
    weight_kg: null  # Dry weight in kg
    length_mm: null
    width_mm: null
    height_mm: null
    
  environmental:
    standard: "DO-160G"
    categories: []  # List applicable DO-160 categories
    operating_temp_min_c: null
    operating_temp_max_c: null
    storage_temp_min_c: null
    storage_temp_max_c: null

# LRI Components
lri:
  - id: "LRI_01"
    name: "ComponentA"
    part_number: "PN-61-20-XX-01A"
    quantity: 1
    description: "[Description of ComponentA]"
    location: "[Installation location]"
    criticality: "Critical"  # Critical, Major, Minor
    documentation:
      design: "LRI/LRI_01_ComponentA/61-20-XX_Design.md"
      cir_links: "LRI/LRI_01_ComponentA/CIR_LINKS.md"
      bom_lmp: "LRI/LRI_01_ComponentA/BOM_LMP.md"
    cir_references:
      figure: "61-90-20_61-02-FIG_001-ComponentA.svg"
      table: "61-90-20_61-02-TABLE_001-ComponentA.csv"

  - id: "LRI_02"
    name: "ComponentB"
    part_number: "PN-61-20-XX-02B"
    quantity: 1
    description: "[Description of ComponentB]"
    location: "[Installation location]"
    criticality: "Major"
    documentation:
      design: "LRI/LRI_02_ComponentB/61-20-XX_Design.md"
      cir_links: "LRI/LRI_02_ComponentB/CIR_LINKS.md"
      bom_lmp: "LRI/LRI_02_ComponentB/BOM_LMP.md"
    cir_references:
      figure: "61-90-20_61-03-FIG_002-ComponentB.svg"
      table: "61-90-20_61-03-TABLE_002-ComponentB.csv"

  - id: "LRI_03"
    name: "ComponentC"
    part_number: "PN-61-20-XX-03C"
    quantity: 1
    description: "[Description of ComponentC]"
    location: "[Installation location]"
    criticality: "Minor"
    documentation:
      design: "LRI/LRI_03_ComponentC/61-20-XX_Design.md"
      cir_links: "LRI/LRI_03_ComponentC/CIR_LINKS.md"
      bom_lmp: "LRI/LRI_03_ComponentC/BOM_LMP.md"
    cir_references:
      figure: "61-90-20_61-04-FIG_003-ComponentC.svg"
      table: "61-90-20_61-04-TABLE_003-ComponentC.csv"

# Interfaces
interfaces:
  external:
    - id: "IF-61-20-001"
      connected_system: "Engine Control"
      ata_chapter: 76
      type: "Electrical"
      description: "Control signals to/from engine control system"
      
    - id: "IF-61-20-002"
      connected_system: "Electrical Power"
      ata_chapter: 24
      type: "Electrical"
      description: "28VDC power supply"
      
    - id: "IF-61-20-003"
      connected_system: "Indicating System"
      ata_chapter: 77
      type: "Data"
      description: "Status and health monitoring data"

  internal:
    - id: "INT-001"
      source_lri: "LRI_01"
      target_lri: "LRI_02"
      type: "Mechanical"
      description: "Mounting interface"
      
    - id: "INT-002"
      source_lri: "LRI_02"
      target_lri: "LRI_03"
      type: "Electrical"
      description: "Signal routing"

# Maintenance Configuration
maintenance:
  line_maintenance:
    mttr_minutes: null  # Mean Time To Replace
    special_tools: []   # List of special tools required
    access_panels: []   # List of access panels
    
  shop_maintenance:
    test_equipment: []
    calibration_required: false
    overhaul_interval_hours: null

# CIR References
cir:
  base_path: "../../../61-90_Tables_Schemas_Diagrams/ATA_61-90_CIR/"
  assets:
    - id: "61-90-20_61-02-FIG_001"
      type: "figure"
      format: "svg"
      filename: "61-90-20_61-02-FIG_001-ComponentA.svg"
      description: "ComponentA Assembly Drawing"
      
    - id: "61-90-20_61-02-TABLE_001"
      type: "table"
      format: "csv"
      filename: "61-90-20_61-02-TABLE_001-ComponentA.csv"
      description: "ComponentA Specifications Table"
      
    - id: "61-90-20_61-03-FIG_002"
      type: "figure"
      format: "svg"
      filename: "61-90-20_61-03-FIG_002-ComponentB.svg"
      description: "ComponentB Assembly Drawing"
      
    - id: "61-90-20_61-03-TABLE_002"
      type: "table"
      format: "csv"
      filename: "61-90-20_61-03-TABLE_002-ComponentB.csv"
      description: "ComponentB Specifications Table"
      
    - id: "61-90-20_61-04-FIG_003"
      type: "figure"
      format: "svg"
      filename: "61-90-20_61-04-FIG_003-ComponentC.svg"
      description: "ComponentC Assembly Drawing"
      
    - id: "61-90-20_61-04-TABLE_003"
      type: "table"
      format: "csv"
      filename: "61-90-20_61-04-TABLE_003-ComponentC.csv"
      description: "ComponentC Specifications Table"

# Traceability
traceability:
  requirements:
    - id: "REQ-61-20-001"
      description: "[Requirement description]"
      verification_method: "Test"
      status: "Open"
      
  certification:
    applicable_standards:
      - standard: "CS-E"
        description: "Engine certification requirements"
        url: "https://www.easa.europa.eu/en/document-library/certification-specifications/cs-e-engines"
      - standard: "DO-160G"
        description: "Environmental testing"
        url: "https://do160.org/"

# Document Control
document_control:
  created_date: "2025-12-01"
  last_updated: "2025-12-01"
  author: "AMPEL360 Documentation WG"
  ai_assisted: true
  ai_model: "GitHub Copilot"
  prompted_by: "Amedeo Pelliccia"
  status: "DRAFT"
  approver: "[to be completed]"
