# Q100-61 Export Settings Standards
# AMPEL360-BWB-H2-Hy-E Hybrid Propulsion System
# ATA Chapter 61 - Propellers/Propulsors
#
# This file defines the standard export settings for all
# CAD, visualization, manufacturing, and analysis exports.

version: "1.0.0"
last_updated: "2025-12-05"
status: "DRAFT"

# =============================================================================
# PROGRAM INFORMATION
# =============================================================================
program:
  name: "AMPEL360-BWB-H2-Hy-E"
  designation: "Q100"
  ata_chapter: "61"
  description: "Hybrid BWB Aircraft Propulsion System"

# =============================================================================
# GENERAL EXPORT SETTINGS
# =============================================================================
general:
  units:
    length: "mm"
    mass: "kg"
    force: "N"
    pressure: "MPa"
    temperature: "K"
    angle: "deg"
    
  coordinate_system:
    origin: "Aircraft reference datum"
    x_axis: "Forward positive"
    y_axis: "Right positive"
    z_axis: "Up positive"
    
  tolerance:
    geometric: 0.001  # mm
    angular: 0.01     # degrees

# =============================================================================
# NEUTRAL FORMAT SETTINGS
# =============================================================================
neutral_formats:
  # STEP AP242 Settings (Preferred)
  step:
    enabled: true
    standard: "ISO 10303-242"
    edition: "Edition 2"
    settings:
      geometric_accuracy: 0.001  # mm
      angular_accuracy: 0.01     # degrees
      include_pmi: true
      include_tessellation: false
      assembly_structure: "preserve"
      color_information: true
      validation_properties: true
    validation:
      run_ap242_check: true
      max_errors: 0
      max_warnings: 10
    file_extension: ".step"
    
  # JT Format Settings
  jt:
    enabled: true
    version: "10.5"
    settings:
      tessellation:
        chord_deviation: 0.05   # mm
        angle_deviation: 10     # degrees
        max_edge_length: 50     # mm
      include_pmi: true
      include_xt_brep: true
      include_wireframe: false
      lod_levels: 3
      compression: "lossless"
    file_extension: ".jt"
    
  # IGES Settings (Legacy)
  iges:
    enabled: true
    version: "5.3"
    settings:
      flavor: "default"
      accuracy: 0.001    # mm
      surface_representation: "trimmed_surfaces"
      include_wireframe: true
      include_points: false
    note: "Use only for legacy system compatibility"
    file_extension: ".igs"
    
  # Parasolid Settings
  parasolid:
    enabled: true
    version: "35.0"
    settings:
      format: "binary"   # "binary" or "text"
      include_attributes: true
      match_source_accuracy: true
    file_extensions:
      binary: ".x_b"
      text: ".x_t"

# =============================================================================
# VISUALIZATION SETTINGS
# =============================================================================
visualization:
  # 3D PDF Settings
  pdf_3d:
    enabled: true
    settings:
      standard: "PDF/A-3"
      format_3d: "PRC"
      tessellation:
        chord_deviation: 0.05   # mm
        angle_deviation: 10     # degrees
      include_views: true
      include_pmi: true
      include_animations: false
      compression: "medium"
      embed_fonts: true
    file_extension: ".pdf"
    
  # glTF/GLB Settings
  gltf:
    enabled: true
    version: "2.0"
    settings:
      container: "GLB"   # "GLB" (binary) or "glTF" (JSON + bins)
      tessellation:
        chord_deviation: 0.1    # mm
        angle_deviation: 15     # degrees
      compression:
        draco: true
        draco_compression_level: 7
      materials:
        workflow: "metallic-roughness"
        include_textures: true
        texture_format: "WebP"
        texture_quality: 85
      optimize:
        merge_meshes: true
        remove_duplicate_vertices: true
    file_extension: ".glb"
    
  # STL Settings
  stl:
    enabled: true
    format: "binary"
    high_resolution:
      chord_deviation: 0.01    # mm
      angle_deviation: 5       # degrees
      suffix: "-HI"
    low_resolution:
      chord_deviation: 0.1     # mm
      angle_deviation: 15      # degrees
      suffix: "-LO"
    settings:
      units: "mm"
      check_watertight: true
      repair_errors: false
    file_extension: ".stl"
    
  # OBJ Settings
  obj:
    enabled: true
    settings:
      tessellation:
        chord_deviation: 0.05   # mm
        angle_deviation: 10     # degrees
      include_mtl: true
      include_normals: true
      include_uvs: true
      group_by_component: true
    file_extensions:
      geometry: ".obj"
      material: ".mtl"

# =============================================================================
# MANUFACTURING SETTINGS
# =============================================================================
manufacturing:
  # CNC Machining
  cnc:
    enabled: true
    geometry_format: "STEP"
    settings:
      step_version: "AP242"
      geometric_accuracy: 0.001  # mm
      include_stock_definition: true
      coordinate_system: "WCS"
    supporting_formats:
      profiles_2d: "DXF"
      setup_sheets: "PDF"
    file_extensions:
      geometry: ".step"
      profiles: ".dxf"
      programs: [".nc", ".gcode"]
      
  # 3D Printing / Additive Manufacturing
  additive:
    enabled: true
    primary_format: "3MF"
    fallback_format: "STL"
    settings:
      stl:
        format: "binary"
        chord_deviation: 0.05   # mm (finer than viz)
        angle_deviation: 5      # degrees
        check_watertight: true
        repair_errors: true
      threemf:
        include_materials: true
        include_print_settings: false
        include_thumbnail: true
    specification_format: "YAML"
    file_extensions:
      geometry: [".stl", ".3mf"]
      specification: ".yaml"
      
  # Sheet Metal
  sheet_metal:
    enabled: true
    settings:
      flat_pattern_format: "DXF"
      folded_model_format: "STEP"
      bend_allowance_method: "K-factor"
      include_bend_lines: true
      include_bend_notes: true
      include_grain_direction: true
    supporting_files:
      bend_table: "CSV"
      specification: "YAML"
    file_extensions:
      flat_pattern: ".dxf"
      folded: ".step"
      bend_table: ".csv"
      
  # Composites
  composites:
    enabled: true
    settings:
      tool_surface_format: "STEP"
      ply_pattern_format: "DXF"
      ply_schedule_format: "CSV"
      orientation_reference: "0_degree_datum"
      fiber_angle_tolerance: 2  # degrees
      ply_boundary_tolerance: 1  # mm
    file_extensions:
      tool_surface: ".step"
      ply_pattern: ".dxf"
      schedule: ".csv"
      specification: ".yaml"

# =============================================================================
# ANALYSIS SETTINGS
# =============================================================================
analysis:
  # FEA Mesh Export
  fea:
    enabled: true
    formats:
      nastran:
        enabled: true
        version: "MSC Nastran 2023"
        extensions: [".bdf", ".nas"]
      abaqus:
        enabled: true
        version: "Abaqus 2023"
        extensions: [".inp"]
      ansys:
        enabled: true
        version: "ANSYS 2023"
        extensions: [".cdb"]
    mesh_quality:
      jacobian_min: 0.3
      aspect_ratio_max: 10
      warpage_max: 15        # degrees
      skewness_max: 60       # degrees
    settings:
      units: "SI"  # mm, N, MPa, s
      element_types: "per_analysis_requirements"
      include_materials: true
      include_properties: true
      coordinate_system: "global"
    file_extensions: [".bdf", ".nas", ".inp", ".cdb"]
    
  # CFD Geometry Export
  cfd:
    enabled: true
    formats:
      stl:
        enabled: true
        settings:
          format: "binary"
          chord_deviation: 0.05  # mm
          check_watertight: true
          repair_errors: true
      step:
        enabled: true
        settings:
          geometric_accuracy: 0.001  # mm
      cgns:
        enabled: true
        version: "4.0"
    boundary_definition_format: "YAML"
    file_extensions:
      geometry: [".stl", ".step", ".cgns"]
      boundaries: ".yaml"
      
  # Thermal Analysis
  thermal:
    enabled: true
    formats:
      nastran_thermal:
        enabled: true
        extensions: [".bdf"]
      step:
        enabled: true
    settings:
      include_thermal_properties: true
      include_heat_sources: true
      include_boundary_conditions: true
    property_format: "YAML"
    file_extensions:
      model: [".bdf", ".step"]
      properties: ".yaml"
      heat_sources: ".csv"
      
  # Electromagnetic Analysis
  electromagnetic:
    enabled: true
    formats:
      step:
        enabled: true
      iges:
        enabled: true
    settings:
      geometry_type: "3D_solid"  # or "2D_axisymmetric"
      include_em_properties: true
      include_winding_definition: true
      include_magnet_definition: true
    property_format: "YAML"
    file_extensions:
      geometry: [".step", ".igs"]
      properties: ".yaml"
      windings: ".csv"
      magnets: ".csv"

# =============================================================================
# DOCUMENTATION SETTINGS
# =============================================================================
documentation:
  # Drawing Packages
  drawing_packages:
    format: "ZIP"
    drawing_format: "PDF/A-1b"
    manifest_format: "YAML"
    settings:
      include_bom: true
      include_release_notes: true
      validate_manifest: true
    file_extensions:
      package: ".zip"
      drawings: ".pdf"
      manifest: ".yaml"
      bom: ".csv"
      
  # Data Sheets
  data_sheets:
    primary_format: "Markdown"
    export_format: "PDF"
    template: "Q100-61-DS-TEMPLATE"
    file_extensions:
      source: ".md"
      export: ".pdf"
      
  # Technical Publications
  technical_publications:
    source_format: "S1000D"  # or "iSpec2200"
    output_formats: ["PDF", "HTML"]
    settings:
      validate_against_dtd: true
      include_graphics: true
      graphics_format: "SVG"
    file_extensions:
      source: ".xml"
      output: [".pdf", ".html"]

# =============================================================================
# QUALITY VALIDATION
# =============================================================================
validation:
  # Required checks before export
  pre_export:
    - check_model_current: true
    - check_configuration: true
    - check_units: true
    - check_coordinate_system: true
    
  # Required checks after export
  post_export:
    - validate_file_format: true
    - validate_geometry: true
    - generate_checksum: true
    - log_export_metadata: true
    
  # Checksum settings
  checksum:
    algorithm: "SHA-256"
    file_extension: ".sha256"
    
  # Export logging
  logging:
    enabled: true
    include_timestamp: true
    include_user: true
    include_source_revision: true
    include_settings_hash: true

# =============================================================================
# NAMING CONVENTION
# =============================================================================
naming:
  pattern: "Q100-61-[TYPE]-[SYSTEM]-[COMPONENT]-[VARIANT].[ext]"
  
  type_codes:
    EXP: "Neutral format export"
    VIS: "Visualization export"
    MFG: "Manufacturing export"
    FEA: "FEA mesh export"
    CFD: "CFD geometry export"
    THM: "Thermal analysis export"
    EM: "Electromagnetic export"
    PKG: "Drawing package"
    DS: "Data sheet"
    TP: "Technical publication"
    SUP: "Supplier package"
    REL: "Release package"
    
  system_codes:
    FPS: "Full Propulsor System"
    EMD: "Electric Motor Drive"
    GBX: "Gearbox"
    FAN: "Fan/Propeller"
    NAC: "Nacelle"
    INL: "Inlet"
    OFP: "Outlet/Flow Path"
    MNT: "Mounting/Attachment"
    CTL: "Control System"
    PWR: "Power Electronics"
    CLG: "Cooling System"

# =============================================================================
# DOCUMENT CONTROL
# =============================================================================
document_control:
  generated_by: "AI (GitHub Copilot), prompted by Amedeo Pelliccia"
  status: "DRAFT"
  human_approver: "[to be completed]"
