# Q100-61-STD-SEAL-INDEX — Standard Seal Catalog for ATA 61
# This file catalogs standard sealing elements used in propulsion system assemblies.

version: 1
ata_chapter: "61"
program: "Q100"
owner: "AMPEL360 Propulsion Engineering"
last_updated: "2025-12-05"
status: "Draft"

# Seal Categories
categories:
  o_rings:
    description: "Standard O-rings for static and dynamic sealing"
    standards:
      - "AS568"
      - "MIL-PRF-83248"
    items:
      - part_number: "AS568-210"
        description: "O-ring, 3/4 ID x 1 OD x 1/8 CS"
        material: "FKM (Viton)"
        hardness: "75 Shore A"
        temp_range: "-20°C to +200°C"
        applications: ["General sealing", "Oil systems"]

      - part_number: "AS568-216"
        description: "O-ring, 1-1/8 ID x 1-3/8 OD x 1/8 CS"
        material: "Silicone"
        hardness: "70 Shore A"
        temp_range: "-60°C to +200°C"
        applications: ["Low temperature sealing"]

      - part_number: "AS568-325"
        description: "O-ring, 1-5/16 ID x 1-11/16 OD x 3/16 CS"
        material: "EPDM"
        hardness: "70 Shore A"
        temp_range: "-40°C to +120°C"
        applications: ["Coolant systems"]

  gaskets:
    description: "Flat gaskets for flange joints"
    standards:
      - "AMS 3195"
      - "MIL-G-21569"
    items:
      - part_number: "GASKET-METAL-001"
        description: "Spiral wound gasket, 4 inch"
        material: "316SS/Graphite"
        temp_range: "-200°C to +550°C"
        applications: ["High temperature flanges"]

      - part_number: "GASKET-CORK-001"
        description: "Cork-rubber gasket"
        material: "Cork-Neoprene"
        temp_range: "-40°C to +120°C"
        applications: ["Access covers"]

  lip_seals:
    description: "Rotary shaft lip seals"
    standards:
      - "MIL-S-8802"
    items:
      - part_number: "SEAL-LIP-30X45X8"
        description: "Lip seal, 30mm shaft, single lip"
        material: "FKM"
        speed_max: "15 m/s"
        temp_range: "-30°C to +180°C"
        applications: ["Motor shaft sealing"]

      - part_number: "SEAL-LIP-40X55X10-DL"
        description: "Lip seal, 40mm shaft, double lip"
        material: "FKM/PTFE"
        speed_max: "25 m/s"
        temp_range: "-30°C to +200°C"
        applications: ["Gearbox output shaft"]

  face_seals:
    description: "High-speed face seals"
    standards:
      - "AS1895"
    items:
      - part_number: "SEAL-FACE-50"
        description: "Face seal, 50mm bore"
        material: "Carbon/SiC"
        speed_max: "100 m/s"
        applications: ["High-speed shaft sealing"]

  piston_seals:
    description: "Hydraulic actuator seals"
    standards:
      - "MIL-P-5514"
    items:
      - part_number: "SEAL-PISTON-25"
        description: "Piston seal, 25mm bore"
        material: "PTFE/Bronze"
        pressure_max: "35 MPa"
        applications: ["Pitch actuators"]

# Material Compatibility
material_compatibility:
  FKM:
    fluids: ["Oil", "Fuel", "Hydraulic"]
    avoid: ["Ketones", "Amines"]

  Silicone:
    fluids: ["Air", "Water", "Coolant"]
    avoid: ["Petroleum oils"]

  EPDM:
    fluids: ["Water", "Glycol", "Brake fluid"]
    avoid: ["Petroleum products"]

  PTFE:
    fluids: ["Universal compatibility"]
    notes: "Requires backup rings for high pressure"

# Installation Guidelines
guidelines:
  handling: "Store in cool, dark place. Check for damage before installation."
  lubrication: "Use compatible lubricant during installation"
  stretch_limit: "Do not exceed 5% stretch for O-rings"
  inspection: "Replace seals during overhaul regardless of appearance"
