# Q100-61-STD-CONNECTOR-INDEX — Standard Connector Catalog for ATA 61
# This file catalogs standard electrical and fluid connectors used in
# propulsion system assemblies.

version: 1
ata_chapter: "61"
program: "Q100"
owner: "AMPEL360 Propulsion Engineering"
last_updated: "2025-12-05"
status: "Draft"

# Electrical Connector Categories
electrical_connectors:
  circular_connectors:
    description: "Circular connectors for power and signal"
    standards:
      - "MIL-DTL-38999"
      - "EN3645"
    items:
      - part_number: "D38999/26WA98SN"
        description: "Circular connector, 13 contacts, plug"
        series: "MIL-DTL-38999 Series III"
        shell_size: "11"
        contacts: 13
        current_rating: "7.5A per contact"
        applications: ["Sensor signals", "Control signals"]

      - part_number: "D38999/26WG35SN"
        description: "Circular connector, 66 contacts, plug"
        series: "MIL-DTL-38999 Series III"
        shell_size: "19"
        contacts: 66
        current_rating: "5A per contact"
        applications: ["Motor control", "Data bus"]

  high_power_connectors:
    description: "High-current power connectors"
    standards:
      - "SAE AS39029"
      - "MIL-DTL-5015"
    items:
      - part_number: "MS3116F14-12P"
        description: "Power connector, 2-pin, 100A"
        contacts: 2
        current_rating: "100A"
        voltage_rating: "600V"
        applications: ["Motor power feed"]

      - part_number: "MS3116F18-10P"
        description: "Power connector, 3-pin, 200A"
        contacts: 3
        current_rating: "200A per phase"
        voltage_rating: "600V"
        applications: ["3-phase motor power"]

  rectangular_connectors:
    description: "High-density rectangular connectors"
    standards:
      - "MIL-DTL-83513"
    items:
      - part_number: "M83513/01-A01N"
        description: "Micro-D connector, 9 contacts"
        contacts: 9
        current_rating: "3A"
        applications: ["Resolver signals", "Encoders"]

  fiber_optic_connectors:
    description: "High-speed data connectors"
    standards:
      - "MIL-DTL-83526"
    items:
      - part_number: "M83526/20-001"
        description: "Fiber optic connector, multimode"
        type: "ST compatible"
        fiber_type: "Multimode 62.5/125"
        applications: ["High-speed data bus"]

# Fluid Connector Categories
fluid_connectors:
  an_fittings:
    description: "Standard AN fluid fittings"
    standards:
      - "MIL-DTL-5541"
    items:
      - part_number: "AN816-6D"
        description: "AN fitting, 37° flare, -6"
        material: "Aluminum"
        thread: "9/16-18"
        applications: ["Oil lines", "Hydraulic lines"]

      - part_number: "AN822-8D"
        description: "AN fitting, 90° elbow, -8"
        material: "Steel, Cadmium plated"
        thread: "3/4-16"
        applications: ["Fuel lines"]

  quick_disconnect:
    description: "Self-sealing quick disconnect couplings"
    standards:
      - "SAE AS4395"
    items:
      - part_number: "QD-1/2-SS"
        description: "Quick disconnect, 1/2 inch, stainless"
        size: "1/2 inch"
        material: "316 Stainless Steel"
        pressure_rating: "3000 psi"
        applications: ["Coolant service connections"]

  tube_fittings:
    description: "Tube fitting assemblies"
    standards:
      - "MIL-DTL-18866"
    items:
      - part_number: "MS21902-4"
        description: "Tube fitting, flared, 1/4 tube"
        tube_size: "1/4 inch OD"
        material: "Aluminum"
        applications: ["Instrument lines"]

# Environmental Ratings
environmental_ratings:
  altitude: "70,000 ft maximum"
  temperature:
    electrical: "-65°C to +200°C"
    fluid: "-54°C to +150°C"
  vibration:
    level: "20g, 10-2000 Hz"
    per: "MIL-STD-810"
  sealing:
    electrical: "IP67 when mated"
    fluid: "Zero leakage at rated pressure"

# Installation Guidelines
guidelines:
  electrical:
    - "Verify pin assignments before mating"
    - "Use torque wrench for coupling nuts"
    - "Apply environmental sealant to rear accessories"
    - "Conduct continuity and insulation resistance checks"
  fluid:
    - "Clean all fittings before assembly"
    - "Use proper flaring tools for AN fittings"
    - "Torque per specification tables"
    - "Pressure test before service"
