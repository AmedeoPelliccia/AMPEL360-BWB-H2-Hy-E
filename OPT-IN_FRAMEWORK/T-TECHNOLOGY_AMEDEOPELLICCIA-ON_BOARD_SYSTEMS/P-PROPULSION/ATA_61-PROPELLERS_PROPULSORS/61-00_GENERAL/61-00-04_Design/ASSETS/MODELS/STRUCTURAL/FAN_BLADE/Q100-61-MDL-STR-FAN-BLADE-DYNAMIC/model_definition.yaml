# Model Definition: Q100-61-MDL-STR-FAN-BLADE-DYNAMIC
# Fan Blade Dynamic/Modal Analysis Model

model_id: Q100-61-MDL-STR-FAN-BLADE-DYNAMIC
model_name: Fan Blade Dynamic Analysis Model
version: 1.0.0
status: Draft

domain: STR
component: FAN_BLADE
model_type: Modal_FEA

description: |
  Modal and flutter analysis of the fan blade. Determines natural
  frequencies, mode shapes, and aeroelastic stability margins.

software:
  name: ANSYS Mechanical + APDL
  version: "2024 R1"
  license: Commercial

geometry:
  source: Q100-61-MDL-STR-FAN-BLADE-STATIC
  note: Reuse static mesh with prestress

physics:
  analysis_type:
    - Modal (prestressed)
    - Harmonic response
    - Flutter (coupled aero-structural)
  prestress: From static centrifugal loads
  aero_coupling: Unsteady panel method or CFD

modal_analysis:
  frequency_range_Hz: 0 to 5000
  modes_extracted: 20
  prestress_rpm:
    - 0
    - 1000
    - 1500
    - 2000
    - 2200
  files: modal_analysis/

flutter_analysis:
  method: P-K method or URANS coupled
  mach_range: 0.3 to 0.85
  altitude_range_m: 0 to 12000
  stability_margin: 15%
  files: flutter_analysis/

outputs:
  - name: campbell_diagram
    description: Frequency vs. RPM
  - name: mode_shapes
    description: Deformation patterns
  - name: flutter_boundary
    description: Stable envelope
  - name: forced_response
    description: Vibration amplitude at harmonics

validation:
  method: Ground vibration test (GVT)
  data_source: Component modal test
  metrics:
    - frequency_accuracy_percent: 5

traceability:
  requirements:
    - REQ-61-STR-010
    - REQ-61-VIB-001
  certification:
    - CS-25.629

document_control:
  created_by: AMPEL360 Structures Team
  created_date: 2025-12-05
  ai_assistance: Generated with AI (GitHub Copilot), prompted by Amedeo Pelliccia
