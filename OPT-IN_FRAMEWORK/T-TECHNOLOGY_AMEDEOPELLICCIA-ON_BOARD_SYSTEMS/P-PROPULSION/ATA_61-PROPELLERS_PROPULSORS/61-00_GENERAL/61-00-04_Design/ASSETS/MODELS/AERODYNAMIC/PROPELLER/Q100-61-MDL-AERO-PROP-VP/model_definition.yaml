# Model Definition: Q100-61-MDL-AERO-PROP-VP
# Variable Pitch Propeller Model

model_id: Q100-61-MDL-AERO-PROP-VP
model_name: Variable Pitch Propeller Model
version: 1.0.0
status: Draft

domain: AERO
component: PROPELLER
model_type: BEMT_CFD

description: |
  Combined BEMT and CFD model for variable-pitch propeller performance
  across the pitch schedule. Supports pitch optimization and off-design
  performance prediction.

software:
  name: MATLAB/XROTOR + ANSYS Fluent
  version: R2024a / 2024 R1
  license: Commercial

pitch_schedule:
  files: pitch_schedule/
  parameters:
    - flight_phase
    - target_thrust
    - blade_pitch_deg

operating_conditions:
  pitch_range_deg:
    min: 15
    max: 45
    design: 32

outputs:
  - name: pitch_vs_thrust_map
    description: Optimal pitch for thrust requirement
  - name: efficiency_vs_pitch
    description: η at each pitch setting

traceability:
  requirements:
    - REQ-61-AERO-015
    - REQ-61-CTRL-001

document_control:
  created_by: AMPEL360 Propulsion Analysis Team
  created_date: 2025-12-05
  ai_assistance: Generated with AI (GitHub Copilot), prompted by Amedeo Pelliccia
