model_id: Q100-61-MDL-PERF-MISSION
model_name: Mission Performance Model
version: 1.0.0
status: Draft

domain: PERF
component: MISSION
model_type: Mission_Analysis

description: |
  Mission-level analysis including segment-by-segment energy consumption,
  H₂ fuel requirements, and battery SOC trajectory.

software:
  name: MATLAB/Python
  version: "R2024a / 3.11"

mission_segments:
  - taxi_out
  - takeoff
  - climb
  - cruise
  - descent
  - approach
  - landing
  - taxi_in

outputs:
  - name: segment_energy_kWh
  - name: h2_consumption_kg
  - name: battery_soc_trajectory
  - name: range_nm
  - name: endurance_hr

traceability:
  requirements:
    - REQ-61-PERF-010
    - REQ-05-RANGE-001

