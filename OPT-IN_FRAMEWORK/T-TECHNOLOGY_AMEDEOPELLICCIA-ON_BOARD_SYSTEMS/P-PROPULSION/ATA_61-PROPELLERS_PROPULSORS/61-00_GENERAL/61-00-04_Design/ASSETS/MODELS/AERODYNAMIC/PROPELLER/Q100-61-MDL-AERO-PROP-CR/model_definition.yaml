# Model Definition: Q100-61-MDL-AERO-PROP-CR
# Contra-Rotating Propeller CFD Model

model_id: Q100-61-MDL-AERO-PROP-CR
model_name: Contra-Rotating Propeller CFD Model
version: 1.0.0
status: Draft

domain: AERO
component: PROPELLER
model_type: CFD

description: |
  CFD model for the contra-rotating open-rotor propeller configuration.
  Captures interaction effects between forward and aft blade rows.

software:
  name: ANSYS CFX
  version: "2024 R1"
  license: Commercial

geometry:
  source: ASSETS/ASSEMBLIES/Q100-61-ASSY-PROP-CR
  format: STEP
  components:
    - forward_rotor
    - aft_rotor
    - hub

mesh:
  type: Structured/unstructured hybrid
  elements: TBD
  domain: Full annulus or periodic sector
  files: mesh/

physics:
  equations: URANS
  turbulence_model: k-ω SST
  unsteady: Yes, for rotor-rotor interaction
  timestep: Per blade passing period

operating_conditions:
  reference: MODEL_LIBRARY/STANDARD_CONDITIONS/
  parameters:
    forward_rpm: 1800
    aft_rpm: -1700
    speed_ratio: 0.944

outputs:
  - name: total_thrust_N
    description: Combined thrust
  - name: net_torque_Nm
    description: Residual torque
  - name: interaction_losses
    description: Efficiency penalty from interaction

traceability:
  requirements:
    - REQ-61-AERO-010
  certification:
    - CS-25.929

document_control:
  created_by: AMPEL360 Propulsion Analysis Team
  created_date: 2025-12-05
  ai_assistance: Generated with AI (GitHub Copilot), prompted by Amedeo Pelliccia
