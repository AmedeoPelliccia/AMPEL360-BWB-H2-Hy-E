# Model Definition: Q100-61-MDL-AERO-NACELLE-EXT
# External Nacelle Flow CFD Model

model_id: Q100-61-MDL-AERO-NACELLE-EXT
model_name: External Nacelle Flow Model
version: 1.0.0
status: Draft

domain: AERO
component: NACELLE
model_type: CFD

description: |
  CFD model for external nacelle flow including drag prediction,
  boundary layer development, and flow separation assessment.

software:
  name: ANSYS Fluent
  version: "2024 R1"
  license: Commercial

geometry:
  source: ASSETS/ASSEMBLIES/Q100-61-ASSY-NACELLE
  format: STEP
  domain: External flow with far-field

mesh:
  type: Unstructured with prism layers
  files: mesh/

physics:
  equations: RANS
  turbulence_model: Spalart-Allmaras
  compressibility: Compressible

outputs:
  - name: nacelle_drag_N
    description: Total nacelle drag force
  - name: pressure_recovery
    description: Inlet pressure recovery

traceability:
  requirements:
    - REQ-61-AERO-020

document_control:
  created_by: AMPEL360 Propulsion Analysis Team
  created_date: 2025-12-05
  ai_assistance: Generated with AI (GitHub Copilot), prompted by Amedeo Pelliccia
