# Q100-61-VAR-PROPULSOR-EXTENDED-RANGE — Variant Definition
# AMPEL360 BWB H2 Hy-E Extended Range Propulsor

variant:
  id: Q100-61-VAR-PROPULSOR-EXTENDED-RANGE
  name: Extended Range Propulsor
  base_product: Q100-61-PROD-PROPULSOR-SYSTEM
  revision: A
  status: DRAFT
  position: any
  program: Q100

description:
  short: >-
    Efficiency-optimized propulsor for extended-range missions
  long: >-
    The Q100-61-VAR-PROPULSOR-EXTENDED-RANGE is an efficiency-optimized 
    variant designed for extended-range missions. It features an extended 
    pitch range, optimized motor control algorithms, and enhanced acoustic 
    treatment. This variant can be combined with any position (LH, RH, CTR).

position:
  side: any
  location: any
  compatible_with:
    - Q100-61-VAR-PROPULSOR-LH
    - Q100-61-VAR-PROPULSOR-RH
    - Q100-61-VAR-PROPULSOR-CENTER

performance:
  efficiency_improvement_percent: 3
  range_extension_percent: 5
  noise_reduction_dB: 2
  cruise_rpm_optimized: 1100

changes:
  fan:
    pitch_range_extended: true
    pitch_max_deg: 35
  control:
    algorithm: efficiency_optimized
    cruise_rpm_target: 1100
  acoustic:
    treatment: enhanced
    liners: broadband_plus

requires_option: Q100-61-OPT-EXTENDED-RANGE

effectivity:
  configurations:
    - twin_wing
    - tri_propulsor
  msn_range:
    from: 1
    to: null

metadata:
  created: 2025-12-05
  modified: 2025-12-05
  author: AI (GitHub Copilot), prompted by Amedeo Pelliccia
  approver: TBD
