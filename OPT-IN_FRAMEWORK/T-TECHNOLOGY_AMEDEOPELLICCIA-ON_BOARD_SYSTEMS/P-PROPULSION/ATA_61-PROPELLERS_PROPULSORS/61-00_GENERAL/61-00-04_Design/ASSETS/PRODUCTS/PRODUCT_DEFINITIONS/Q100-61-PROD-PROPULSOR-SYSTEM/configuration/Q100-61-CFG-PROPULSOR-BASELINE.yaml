# Q100-61-CFG-PROPULSOR-BASELINE — Baseline Configuration
# AMPEL360 BWB H2 Hy-E Hybrid-Electric Propulsion System

configuration:
  id: Q100-61-CFG-PROPULSOR-BASELINE
  name: Propulsor System Baseline Configuration
  revision: R01
  status: DRAFT
  product: Q100-61-PROD-PROPULSOR-SYSTEM
  
effectivity:
  from_msn: 1
  to_msn: null  # Open-ended
  first_flight: TBD
  
baseline:
  open_fan_unit:
    product: Q100-61-PROD-OPEN-FAN-UNIT
    configuration:
      blade_count: 12
      blade_material: CFRP
      pitch_range_deg: [-5, 30]
      diameter_m: 2.8
      
  electric_drive_unit:
    product: Q100-61-PROD-ELECTRIC-DRIVE-UNIT
    configuration:
      motor_count: 2
      motor_type: PMSM
      power_per_motor_kW: 500
      voltage_vdc: 800
      inverter_type: SiC
      
  gearbox_unit:
    product: Q100-61-PROD-GEARBOX-UNIT
    configuration:
      gear_ratio: "3.5:1"
      type: planetary
      lubrication: self_contained
      
  nacelle_unit:
    product: Q100-61-PROD-NACELLE-UNIT
    configuration:
      material: composite
      thrust_reverser: cascade
      acoustic_treatment: broadband
      
  controller_unit:
    product: Q100-61-PROD-CONTROLLER-UNIT
    configuration:
      fadec_channels: 2
      dal_level: A
      health_monitoring: integrated

options_included:
  - none  # Baseline has no options

options_available:
  - Q100-61-OPT-HIGH-POWER
  - Q100-61-OPT-EXTENDED-RANGE
  - Q100-61-OPT-REDUCED-NOISE
  - Q100-61-OPT-SAF-OPTIMIZED

certification_basis:
  - CS-E
  - FAR-33
  - CS-25.1309
  - ICAO-Annex-16

metadata:
  created: 2025-12-05
  modified: 2025-12-05
  author: AI (GitHub Copilot), prompted by Amedeo Pelliccia
  approver: TBD
