# Q100-61-OPT-REDUCED-NOISE — Reduced Noise Option
# AMPEL360 BWB H2 Hy-E Propulsion System

option:
  id: Q100-61-OPT-REDUCED-NOISE
  name: Reduced Noise Option
  version: "1.0"
  status: DRAFT
  program: Q100

description:
  short: Enhanced acoustic treatment for noise-sensitive operations
  long: >-
    The Reduced Noise Option provides enhanced acoustic treatment for
    operations at noise-sensitive airports or for airlines prioritizing
    community noise reduction.

performance_delta:
  noise:
    approach_reduction_dB: 3
    takeoff_reduction_dB: 2
    sideline_reduction_dB: 2.5
  efficiency:
    impact_percent: -0.5  # Minor efficiency penalty

changes:
  hardware:
    - component: Inlet Acoustic Liners
      baseline: Standard
      option: High-absorption
      change: Enhanced perforate design
      
    - component: Fan Case Liners
      baseline: Standard
      option: Multi-layer broadband
      change: Extended frequency absorption
      
    - component: Exhaust Liners
      baseline: Standard
      option: Chevron-integrated
      change: Mixing enhancement
      
    - component: Blade Trailing Edge
      baseline: Standard
      option: Serrated
      change: Noise reduction serrations
      
  software:
    - component: Noise Abatement Mode
      change: Added low-noise approach/takeoff modes

weight_impact:
  delta_kg: +12
  reason: Enhanced acoustic treatment materials

cost_impact:
  category: medium
  reason: Specialized acoustic materials

compatibility:
  products:
    - Q100-61-PROD-PROPULSOR-SYSTEM
  variants:
    - Q100-61-VAR-PROPULSOR-LH
    - Q100-61-VAR-PROPULSOR-RH
    - Q100-61-VAR-PROPULSOR-CENTER
  combines_with:
    - Q100-61-OPT-EXTENDED-RANGE  # Compatible
    - Q100-61-OPT-SAF-OPTIMIZED   # Compatible

certification:
  impact: Noise certification demonstration
  additional_testing: Flyover noise testing

metadata:
  created: 2025-12-05
  modified: 2025-12-05
  author: AI (GitHub Copilot), prompted by Amedeo Pelliccia
  approver: TBD
