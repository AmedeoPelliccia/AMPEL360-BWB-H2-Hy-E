              - Vibration
              - Position
              - Current
              - Voltage
          - category: Health Monitoring Unit
            quantity: 1
            type: Integrated

integration:
  mechanical:
    mount_points: 4
    pylon_interface: IF-61-001
    weight_distribution:
      front_percent: 45
      rear_percent: 55
      
  electrical:
    hv_connection: IF-61-002
    voltage_vdc: 800
    max_current_a: 1500
    cables:
      - type: HV power
        gauge: "4/0 AWG equivalent"
      - type: Signal
        specification: MIL-DTL-38999
        
  data:
    bus_interface: IF-61-003
    protocols:
      - name: ARINC-429
        channels: 4
        rate: high_speed
      - name: CAN-FD
        channels: 2
        rate: 5_Mbps
    health_data:
      - vibration
      - temperature
      - performance
      
  fluid:
    cooling:
      interface: IF-61-004
      flow_rate_lpm: 40
      inlet_temp_max_c: 60
    fire_suppression:
      interface: IF-61-005
      agent: Novec_1230

