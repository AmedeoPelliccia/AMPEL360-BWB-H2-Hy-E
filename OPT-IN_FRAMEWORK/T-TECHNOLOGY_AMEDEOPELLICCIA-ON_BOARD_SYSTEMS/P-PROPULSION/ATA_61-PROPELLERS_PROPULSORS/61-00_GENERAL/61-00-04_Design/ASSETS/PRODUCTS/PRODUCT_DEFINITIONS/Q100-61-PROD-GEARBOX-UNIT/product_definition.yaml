# Q100-61-PROD-GEARBOX-UNIT — Product Definition
# AMPEL360 BWB H2 Hy-E Gearbox Unit

product:
  id: Q100-61-PROD-GEARBOX-UNIT
  name: Gearbox Unit
  revision: A
  status: DRAFT
  level: sub-product
  parent: Q100-61-PROD-PROPULSOR-SYSTEM
  ata_chapter: "61"
  program: Q100

description:
  short: >-
    Planetary reduction gearbox for motor-to-fan power transmission
  long: >-
    The Q100-61-PROD-GEARBOX-UNIT provides speed reduction between the 
    high-speed electric motors and the open-fan rotor. The planetary 
    gear configuration offers high efficiency, compact packaging, and 
    the ability to combine power from dual motor inputs.

performance:
  gear_ratio: "3.5:1"
  gear_type: planetary
  input_speed_max_rpm: 6300
  output_speed_max_rpm: 1800
  power_capacity_kW: 1200
  torque_output_max_Nm: 6400
  efficiency_percent: 98.5
  
physical:
  length_m: 0.35
  diameter_m: 0.45
  weight_kg: 185
  lubrication_type: self_contained
  oil_capacity_l: 8

components:
  - name: Sun Gear
    quantity: 1
    material: Case-hardened steel
  - name: Planet Gears
    quantity: 4
    material: Case-hardened steel
  - name: Ring Gear
    quantity: 1
    material: Case-hardened steel
  - name: Planet Carrier
    quantity: 1
    material: High-strength steel
  - name: Input Shaft Assembly
    quantity: 1
    type: Dual input
  - name: Output Shaft
    quantity: 1
    material: Steel
  - name: Main Bearings
    quantity: 6
    type: Various (roller, ball)
  - name: Oil Pump
    quantity: 1
    type: Gear pump
  - name: Oil Filter
    quantity: 1
    type: Full-flow
  - name: Oil Cooler
    quantity: 1
    type: Air-oil
  - name: Chip Detector
    quantity: 1
    type: Magnetic

interfaces:
  - id: IF-GBU-001
    to: Q100-61-PROD-ELECTRIC-DRIVE-UNIT
    type: mechanical
    description: Dual motor input shafts
  - id: IF-GBU-002
    to: Q100-61-PROD-OPEN-FAN-UNIT
    type: mechanical
    description: Fan hub connection
  - id: IF-GBU-003
    to: Q100-61-PROD-CONTROLLER-UNIT
    type: electrical
    description: Speed and torque sensors

certification:
  standards:
    - code: CS-E
      sections: [130, 140]
    - code: FAR-33
      sections: [35, 93]
  life_limits:
    tbo_hours: 10000
    inspection_interval_hours: 2500

assembly_reference: "../../ASSEMBLIES/OPEN_FAN_PROPULSOR/"
bom_reference: "../../BILL_OF_MATERIALS/Q100-61-BOM-GEARBOX-UNIT/"

