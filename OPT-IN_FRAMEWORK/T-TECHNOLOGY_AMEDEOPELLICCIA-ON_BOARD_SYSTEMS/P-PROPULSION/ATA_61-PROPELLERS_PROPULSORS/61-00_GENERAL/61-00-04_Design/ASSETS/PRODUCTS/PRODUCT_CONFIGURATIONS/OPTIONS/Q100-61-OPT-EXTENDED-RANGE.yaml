# Q100-61-OPT-EXTENDED-RANGE — Extended Range Option
# AMPEL360 BWB H2 Hy-E Propulsion System

option:
  id: Q100-61-OPT-EXTENDED-RANGE
  name: Extended Range Option
  version: "1.0"
  status: DRAFT
  program: Q100

description:
  short: Optimized for long-range cruise efficiency
  long: >-
    The Extended Range Option provides efficiency optimization for long-range
    missions through extended pitch range, optimized control algorithms, and
    enhanced acoustic treatment.

performance_delta:
  efficiency:
    baseline_percent: 92
    option_percent: 94.8
    improvement_percent: 3
  range:
    improvement_percent: 5
  cruise_rpm:
    baseline: 1200
    option: 1100
    reduction_percent: 8
  noise:
    reduction_dB: 2

changes:
  hardware:
    - component: Pitch Actuator
      baseline: Q100-61-P-PITCH-ACT
      option: Q100-61-P-PITCH-ACT-ER
      change: Extended travel range (40° vs 35°)
      
    - component: Acoustic Liners
      baseline: Standard
      option: Broadband Plus
      change: Enhanced absorption panels
      
  software:
    - component: Control Algorithms
      change: Efficiency-optimized control laws
      features:
        - Lower cruise RPM targeting
        - Pitch schedule optimization
        - Power distribution optimization
        
    - component: Flight Modes
      change: Added Extended Range cruise mode

weight_impact:
  delta_kg: +5
  reason: Enhanced acoustic treatment

cost_impact:
  category: low
  reason: Software changes and minor hardware updates

compatibility:
  products:
    - Q100-61-PROD-PROPULSOR-SYSTEM
  variants:
    - Q100-61-VAR-PROPULSOR-LH
    - Q100-61-VAR-PROPULSOR-RH
    - Q100-61-VAR-PROPULSOR-CENTER
    - Q100-61-VAR-PROPULSOR-EXTENDED-RANGE
  excludes:
    - Q100-61-OPT-HIGH-POWER  # Mutually exclusive

certification:
  impact: Software update approval
  additional_testing: Cruise performance verification

metadata:
  created: 2025-12-05
  modified: 2025-12-05
  author: AI (GitHub Copilot), prompted by Amedeo Pelliccia
  approver: TBD
