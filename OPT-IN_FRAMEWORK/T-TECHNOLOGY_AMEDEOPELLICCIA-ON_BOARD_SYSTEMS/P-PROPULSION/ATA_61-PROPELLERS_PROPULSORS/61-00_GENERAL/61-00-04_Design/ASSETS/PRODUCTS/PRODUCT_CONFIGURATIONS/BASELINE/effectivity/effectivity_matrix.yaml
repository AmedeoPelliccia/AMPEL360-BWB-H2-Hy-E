baseline:
  id: Q100-61-CFG-BASELINE-R01
  name: Initial Certification Baseline
  revision: R01
  status: DRAFT
  effective_date: TBD
  program: Q100
  ata_chapter: "61"

description: >-
  Initial configuration baseline for the Q100 program propulsion system.
  This baseline defines the certified configuration for type certification.

products:
  propulsor_system:
    id: Q100-61-PROD-PROPULSOR-SYSTEM
    revision: A
    configuration:
      open_fan_unit:
        id: Q100-61-PROD-OPEN-FAN-UNIT
        revision: A
        blade_count: 12
        blade_material: CFRP
        pitch_range_deg: [-5, 30]
        diameter_m: 2.8
        
      electric_drive_unit:
        id: Q100-61-PROD-ELECTRIC-DRIVE-UNIT
        revision: A
        motor_count: 2
        motor_power_kW: 500
        voltage_vdc: 800
        inverter_type: SiC
        
      gearbox_unit:
        id: Q100-61-PROD-GEARBOX-UNIT
        revision: A
        ratio: "3.5:1"
        type: planetary
        
      nacelle_unit:
        id: Q100-61-PROD-NACELLE-UNIT
        revision: A
        material: composite
        thrust_reverser: cascade
        
      controller_unit:
        id: Q100-61-PROD-CONTROLLER-UNIT
        revision: A
        fadec_channels: 2
        dal_level: A

