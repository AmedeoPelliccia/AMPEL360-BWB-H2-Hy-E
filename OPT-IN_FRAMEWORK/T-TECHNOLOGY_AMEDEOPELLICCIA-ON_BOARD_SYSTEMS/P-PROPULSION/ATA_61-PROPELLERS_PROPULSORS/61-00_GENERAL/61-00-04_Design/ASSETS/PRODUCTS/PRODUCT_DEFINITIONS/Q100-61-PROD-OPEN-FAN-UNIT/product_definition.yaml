# Q100-61-PROD-OPEN-FAN-UNIT — Product Definition
# AMPEL360 BWB H2 Hy-E Open Fan Unit

product:
  id: Q100-61-PROD-OPEN-FAN-UNIT
  name: Open Fan Unit
  revision: A
  status: DRAFT
  level: sub-product
  parent: Q100-61-PROD-PROPULSOR-SYSTEM
  ata_chapter: "61"
  program: Q100

description:
  short: >-
    Open-fan rotor assembly with variable-pitch CFRP blades
  long: >-
    The Q100-61-PROD-OPEN-FAN-UNIT provides the propulsive element of the 
    integrated propulsor system. It features a 12-blade unducted fan with 
    variable pitch capability for optimal efficiency across the flight envelope.
    The large diameter (2.8m) and high bypass ratio provide superior propulsive 
    efficiency compared to conventional turbofan designs.

performance:
  fan_diameter_m: 2.8
  blade_count: 12
  pitch_range_deg:
    min: -5
    max: 30
  rpm:
    max: 1800
    cruise: 1200
    idle: 400
  tip_speed:
    max_m_s: 263  # Subsonic to reduce noise
    cruise_m_s: 176
  efficiency:
    propulsive_percent: 92

physical:
  diameter_m: 2.8
  axial_length_m: 0.6
  weight_kg: 380
  materials:
    blades: CFRP
    hub: Ti-6Al-4V
    spinner: Composite

components:
  - name: Fan Blades
    quantity: 12
    material: CFRP
    weight_each_kg: 18
  - name: Fan Hub
    quantity: 1
    material: Ti-6Al-4V
    weight_kg: 95
  - name: Spinner
    quantity: 1
    material: Composite
    weight_kg: 12
  - name: Pitch Actuators
    quantity: 12
    type: Electro-hydraulic
    weight_each_kg: 3.5
  - name: De-icing Elements
    quantity: 12
    type: Electrothermal
    
interfaces:
  - id: IF-OFU-001
    to: Q100-61-PROD-GEARBOX-UNIT
    type: mechanical
    description: Output shaft spline connection
  - id: IF-OFU-002
    to: Q100-61-PROD-CONTROLLER-UNIT
    type: electrical
    description: Pitch control and feedback
  - id: IF-OFU-003
    to: Q100-61-PROD-NACELLE-UNIT
    type: structural
    description: Forward mounting ring

certification:
  standards:
    - code: CS-E
      sections: [510, 520, 780]
    - code: FAR-33
      sections: [75, 76, 77]
  containment:
    requirement: "Blade release containment per CS-E 810"
    test_status: TBD

assembly_reference: "../../ASSEMBLIES/OPEN_FAN_PROPULSOR/"
bom_reference: "../../BILL_OF_MATERIALS/Q100-61-BOM-OPEN-FAN-UNIT/"

metadata:
  created: 2025-12-05
  modified: 2025-12-05
