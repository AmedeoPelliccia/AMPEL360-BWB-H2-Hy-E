# Q100-61-SPEC-PERF-THRUST — Thrust Performance Specification
# AMPEL360 BWB H2 Hy-E Propulsion System

specification:
  id: Q100-61-SPEC-PERF-THRUST
  category: PERFORMANCE
  parameter: THRUST
  version: "1.0"
  status: DRAFT
  product: Q100-61-PROD-PROPULSOR-SYSTEM

description: >-
  Thrust performance specification for the integrated propulsor system
  across the flight envelope.

requirements:
  max_thrust:
    value: 85
    unit: kN
    condition: "Sea level, ISA, static"
    tolerance: "+0/-5%"
    
  cruise_thrust:
    value: 35
    unit: kN
    condition: "FL350, M0.78, ISA"
    tolerance: "±5%"
    
  idle_thrust:
    value: 5
    unit: kN
    condition: "All conditions"
    tolerance: "±10%"
    
  reverse_thrust:
    value: 25
    unit: kN
    condition: "Ground, max reverse"
    tolerance: "+0/-10%"

performance_map:
  altitudes:
    - altitude_ft: 0
      mach: 0
      thrust_kN: 85
    - altitude_ft: 35000
      mach: 0.78
      thrust_kN: 35
    - altitude_ft: 41000
      mach: 0.78
      thrust_kN: 28

verification:
  method: Test
  test_type: Ground and flight test
  acceptance_criteria: "Within tolerance bands"

traceability:
  requirements:
    - REQ-61-PERF-001
    - REQ-61-PERF-002
  certification:
    - CS-E 130

metadata:
  created: 2025-12-05
  modified: 2025-12-05
  author: AI (GitHub Copilot), prompted by Amedeo Pelliccia
  approver: TBD
