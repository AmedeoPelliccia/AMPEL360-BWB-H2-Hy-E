# Q100-61-VAR-PROPULSOR-CENTER — Delta from Baseline
# Differences from Q100-61-PROD-PROPULSOR-SYSTEM baseline

delta:
  variant: Q100-61-VAR-PROPULSOR-CENTER
  baseline: Q100-61-PROD-PROPULSOR-SYSTEM
  baseline_config: Q100-61-CFG-PROPULSOR-BASELINE

changes:
  mechanical:
    - component: Nacelle Inlet
      change: BLI-optimized design
      baseline: Standard circular inlet
      variant: S-duct BLI inlet
      affected_parts:
        - Q100-61-P-NAC-INLET-CTR
        - Q100-61-P-NAC-SDUCT
        
    - component: Mounting Structure
      change: Tail integration frame
      baseline: Wing pylon interface
      variant: Tail thrust frame
      affected_parts:
        - Q100-61-P-MNT-FRAME-CTR
        - Q100-61-P-MNT-LINK-CTR
        
    - component: Thrust Vectoring System
      change: Added capability
      baseline: Fixed nozzle
      variant: Vectoring nozzle
      affected_parts:
        - Q100-61-P-TV-NOZZLE
        - Q100-61-P-TV-ACT
        - Q100-61-P-TV-CTRL
        
  electrical:
    - component: Wiring Harness
      change: Centerline routing
      baseline: Q100-61-P-WH-MAIN
      variant: Q100-61-P-WH-MAIN-CTR
      
    - component: Thrust Vectoring Control
      change: Additional control channels
      baseline: N/A
      variant: Q100-61-P-TV-HARNESS
      
  software:
    - component: Thrust Vectoring Control
      change: Active vector control algorithm
      baseline: Not present
      variant: Added control laws
      
    - component: BLI Distortion Management
      change: Inlet distortion compensation
      baseline: Standard inlet control
      variant: Distortion-adaptive control

unchanged:
  - Electric motors (same power rating)
  - Inverters
  - Gearbox
  - Fan blades (same design)
  - FADEC hardware (software update only)

part_number_mapping:
  - baseline: Q100-61-P-NAC-INLET
    variant: Q100-61-P-NAC-INLET-CTR
  - baseline: Q100-61-P-MNT-BRK
    variant: Q100-61-P-MNT-FRAME-CTR
  - baseline: Q100-61-P-WH-MAIN
    variant: Q100-61-P-WH-MAIN-CTR
  - baseline: null
    variant: Q100-61-P-TV-NOZZLE
  - baseline: null
    variant: Q100-61-P-TV-ACT

interchangeability:
  with_baseline: no
  reason: Different mounting and inlet configuration

