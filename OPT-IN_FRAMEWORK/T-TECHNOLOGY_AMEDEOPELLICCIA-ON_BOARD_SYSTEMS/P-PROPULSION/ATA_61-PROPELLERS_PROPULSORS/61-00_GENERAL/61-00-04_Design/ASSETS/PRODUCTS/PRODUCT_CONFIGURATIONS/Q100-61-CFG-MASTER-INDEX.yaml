# Q100-61-CFG-MASTER-INDEX — Master Configuration Index
# AMPEL360 BWB H2 Hy-E Propulsion System Configuration Management

master_index:
  id: Q100-61-CFG-MASTER-INDEX
  version: "1.0"
  status: DRAFT
  program: Q100
  ata_chapter: "61"

products:
  - id: Q100-61-PROD-PROPULSOR-SYSTEM
    name: Integrated Propulsor System
    baseline: Q100-61-CFG-BASELINE-R01
    variants:
      - Q100-61-VAR-PROPULSOR-LH
      - Q100-61-VAR-PROPULSOR-RH
      - Q100-61-VAR-PROPULSOR-CENTER
      - Q100-61-VAR-PROPULSOR-EXTENDED-RANGE
      
  - id: Q100-61-PROD-OPEN-FAN-UNIT
    name: Open Fan Unit
    parent: Q100-61-PROD-PROPULSOR-SYSTEM
    
  - id: Q100-61-PROD-ELECTRIC-DRIVE-UNIT
    name: Electric Drive Unit
    parent: Q100-61-PROD-PROPULSOR-SYSTEM
    
  - id: Q100-61-PROD-GEARBOX-UNIT
    name: Gearbox Unit
    parent: Q100-61-PROD-PROPULSOR-SYSTEM
    
  - id: Q100-61-PROD-NACELLE-UNIT
    name: Nacelle Unit
    parent: Q100-61-PROD-PROPULSOR-SYSTEM
    
  - id: Q100-61-PROD-CONTROLLER-UNIT
    name: Controller Unit
    parent: Q100-61-PROD-PROPULSOR-SYSTEM

baselines:
  - id: Q100-61-CFG-BASELINE-R01
    name: Initial Baseline
    revision: R01
    status: active
    effective_date: TBD
    path: BASELINE/Q100-61-CFG-BASELINE-R01.yaml

options:
  - id: Q100-61-OPT-HIGH-POWER
    name: High Power Option
    description: Increased motor power for MTOW variants
    path: OPTIONS/Q100-61-OPT-HIGH-POWER.yaml
    compatibility:
      - Q100-61-PROD-PROPULSOR-SYSTEM
      
  - id: Q100-61-OPT-EXTENDED-RANGE
    name: Extended Range Option
    description: Optimized for long-range cruise efficiency
    path: OPTIONS/Q100-61-OPT-EXTENDED-RANGE.yaml
    compatibility:
      - Q100-61-PROD-PROPULSOR-SYSTEM
      - Q100-61-VAR-PROPULSOR-EXTENDED-RANGE
      
  - id: Q100-61-OPT-REDUCED-NOISE
    name: Reduced Noise Option
    description: Enhanced acoustic treatment
    path: OPTIONS/Q100-61-OPT-REDUCED-NOISE.yaml
    compatibility:
      - Q100-61-PROD-PROPULSOR-SYSTEM
      
  - id: Q100-61-OPT-SAF-OPTIMIZED
    name: SAF Optimized Option
    description: Optimized for SAF fuel operation
    path: OPTIONS/Q100-61-OPT-SAF-OPTIMIZED.yaml
    compatibility:
      - Q100-61-PROD-PROPULSOR-SYSTEM

customer_configurations:
  path: CUSTOMER_CONFIGS/
  format: Q100-61-CFG-[CUSTOMER]-[MSN].yaml

effectivity:
  msn_range:
    from: 1
    to: null
  path: BASELINE/effectivity/effectivity_matrix.yaml

change_control:
  authority: AMPEL360 Configuration Control Board
  process: ECO (Engineering Change Order)
  tracking: Configuration Management Database

metadata:
  created: 2025-12-05
  modified: 2025-12-05
  author: AI (GitHub Copilot), prompted by Amedeo Pelliccia
  approver: TBD
