# Q100-61-PROD-ELECTRIC-DRIVE-UNIT — Product Definition
# AMPEL360 BWB H2 Hy-E Electric Drive Unit

product:
  id: Q100-61-PROD-ELECTRIC-DRIVE-UNIT
  name: Electric Drive Unit
  revision: A
  status: DRAFT
  level: sub-product
  parent: Q100-61-PROD-PROPULSOR-SYSTEM
  ata_chapter: "61"
  program: Q100

description:
  short: >-
    Dual electric motor drive with SiC power electronics
  long: >-
    The Q100-61-PROD-ELECTRIC-DRIVE-UNIT provides the primary power conversion 
    for the propulsion system. It features dual 500 kW permanent magnet 
    synchronous motors with SiC-based inverters operating on the aircraft's 
    800 VDC bus. The dual motor configuration provides redundancy and allows 
    continued operation with reduced power in case of single motor failure.

performance:
  motor_count: 2
  power:
    continuous_per_motor_kW: 500
    peak_per_motor_kW: 600
    peak_duration_s: 30
  voltage:
    input_vdc: 800
    tolerance_percent: 10
  rpm:
    max: 6300
    rated: 5400
  torque:
    max_Nm: 1100
    continuous_Nm: 880
  efficiency:
    motor_percent: 97
    inverter_percent: 99
    combined_percent: 96

physical:
  length_m: 0.8
  diameter_m: 0.5
  weight_kg: 420
  cooling: liquid

components:
  - name: Electric Motor
    quantity: 2
    type: PMSM (Permanent Magnet Synchronous Motor)
    power_kW: 500
    weight_each_kg: 120
  - name: Power Inverter
    quantity: 2
    type: SiC (Silicon Carbide)
    weight_each_kg: 25
  - name: Motor Cooling Jacket
    quantity: 2
    type: Liquid cooled
    weight_each_kg: 15
  - name: HV Junction Box
    quantity: 1
    voltage_vdc: 800
    weight_kg: 18
  - name: Cooling Pump
    quantity: 1
    type: Electric centrifugal
    weight_kg: 5
  - name: Heat Exchanger
    quantity: 1
    type: Liquid-to-air
    weight_kg: 12

interfaces:
  - id: IF-EDU-001
    to: Q100-61-PROD-GEARBOX-UNIT
    type: mechanical
    description: Dual motor shaft to gearbox input
  - id: IF-EDU-002
    to: Q100-61-PROD-CONTROLLER-UNIT
    type: electrical
    description: Motor control and feedback signals
  - id: IF-EDU-003
    to: Aircraft HV Bus
    type: electrical
    voltage_vdc: 800
    max_current_a: 750
  - id: IF-EDU-004
    to: Aircraft Cooling
    type: fluid
    medium: glycol-water
    flow_lpm: 30

certification:
  standards:
    - code: CS-E
      sections: [50, 60, 210]
    - code: DO-160G
      sections: [20, 21, 22]  # Temperature, altitude, EMC
  safety:
    dal_level: A
    failure_modes: analyzed

assembly_reference: "../../ASSEMBLIES/ELECTRIC_MOTOR_DRIVE/"
bom_reference: "../../BILL_OF_MATERIALS/Q100-61-BOM-ELECTRIC-DRIVE-UNIT/"

metadata:
  created: 2025-12-05
  modified: 2025-12-05
