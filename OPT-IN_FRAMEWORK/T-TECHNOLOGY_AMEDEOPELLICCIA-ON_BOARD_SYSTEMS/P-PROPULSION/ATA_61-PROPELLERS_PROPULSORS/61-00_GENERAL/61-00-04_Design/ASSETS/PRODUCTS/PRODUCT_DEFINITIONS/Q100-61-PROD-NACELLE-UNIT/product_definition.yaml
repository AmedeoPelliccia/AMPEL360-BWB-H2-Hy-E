# Q100-61-PROD-NACELLE-UNIT — Product Definition
# AMPEL360 BWB H2 Hy-E Nacelle Unit

product:
  id: Q100-61-PROD-NACELLE-UNIT
  name: Nacelle Unit
  revision: A
  status: DRAFT
  level: sub-product
  parent: Q100-61-PROD-PROPULSOR-SYSTEM
  ata_chapter: "61"
  program: Q100

description:
  short: >-
    Composite nacelle structure with acoustic treatment and thrust reverser
  long: >-
    The Q100-61-PROD-NACELLE-UNIT provides the aerodynamic shaping, 
    structural support, and acoustic treatment for the propulsion system. 
    It houses the open-fan and drive components, includes a cascade-type 
    thrust reverser for ground operations, and incorporates broadband 
    acoustic liners for noise reduction.

performance:
  aerodynamic:
    drag_coefficient: TBD
    inlet_recovery: 0.995
  acoustic:
    liner_type: broadband
    attenuation_dB: TBD
  thrust_reverser:
    type: cascade
    effectiveness_percent: 40
    
physical:
  length_m: 2.6
  max_diameter_m: 3.0
  inlet_diameter_m: 2.85
  weight_kg: 420
  material: CFRP

components:
  - name: Inlet Cowl
    quantity: 1
    material: CFRP
    weight_kg: 85
  - name: Fan Cowl
    quantity: 2
    material: CFRP
    weight_each_kg: 45
    feature: Access panels
  - name: Core Cowl
    quantity: 2
    material: CFRP
    weight_each_kg: 35
  - name: Thrust Reverser Assembly
    quantity: 1
    type: Cascade
    weight_kg: 95
  - name: Acoustic Liner Panels
    quantity: multiple
    type: Broadband absorption
    weight_total_kg: 40
  - name: Forward Bulkhead
    quantity: 1
    material: Aluminum
  - name: Aft Bulkhead
    quantity: 1
    material: Aluminum
  - name: Nacelle Frame
    quantity: 4
    material: Aluminum
  - name: Fire Wall
    quantity: 1
    material: Titanium

interfaces:
  - id: IF-NAC-001
    to: Q100-61-PROD-OPEN-FAN-UNIT
    type: structural
    description: Fan mounting ring
  - id: IF-NAC-002
    to: Aircraft Pylon
    type: structural
    description: Pylon attachment points
  - id: IF-NAC-003
    to: Q100-61-PROD-CONTROLLER-UNIT
    type: electrical
    description: Reverser actuation control

certification:
  standards:
    - code: CS-25
      sections: [1191, 1193]  # Firewalls, Cowling
    - code: FAR-25
      sections: [1191, 1193]
  fire_protection:
    zones: designated
    detection: yes
    suppression: available

assembly_reference: "../../ASSEMBLIES/OPEN_FAN_PROPULSOR/"
bom_reference: "../../BILL_OF_MATERIALS/Q100-61-BOM-NACELLE-UNIT/"

