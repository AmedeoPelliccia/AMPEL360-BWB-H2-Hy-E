# Q100-61-VAR-PROPULSOR-RH — Variant Definition
# AMPEL360 BWB H2 Hy-E Right Hand Propulsor

variant:
  id: Q100-61-VAR-PROPULSOR-RH
  name: Right Hand Propulsor
  base_product: Q100-61-PROD-PROPULSOR-SYSTEM
  revision: A
  status: DRAFT
  position: right
  program: Q100

description:
  short: >-
    Right-hand (starboard side) propulsor variant
  long: >-
    The Q100-61-VAR-PROPULSOR-RH is the baseline configuration for right wing 
    mounting on the AMPEL360 BWB aircraft. It features standard mounting 
    hardware, counter-clockwise fan rotation (viewed from front), and 
    right-side optimized wiring routing.

position:
  side: right
  location: wing
  sub_position: inboard  # or outboard
  coordinates:
    x_mm: TBD
    y_mm: TBD
    z_mm: TBD
  thrust_vector:
    azimuth_deg: 180  # Aft
    elevation_deg: 0

rotation:
  direction: counter_clockwise  # Viewed from front
  counter_rotate_with: Q100-61-VAR-PROPULSOR-LH

mounting:
  type: standard
  pylon_interface: IF-61-001-RH
  attachment_points: 4

wiring:
  routing: right_side
  harness_variant: RH

software:
  pitch_control_logic: standard
  rotation_sense: negative

effectivity:
  configurations:
    - twin_wing
    - tri_propulsor
  msn_range:
    from: 1
    to: null

metadata:
  created: 2025-12-05
  modified: 2025-12-05
  author: AI (GitHub Copilot), prompted by Amedeo Pelliccia
  approver: TBD
