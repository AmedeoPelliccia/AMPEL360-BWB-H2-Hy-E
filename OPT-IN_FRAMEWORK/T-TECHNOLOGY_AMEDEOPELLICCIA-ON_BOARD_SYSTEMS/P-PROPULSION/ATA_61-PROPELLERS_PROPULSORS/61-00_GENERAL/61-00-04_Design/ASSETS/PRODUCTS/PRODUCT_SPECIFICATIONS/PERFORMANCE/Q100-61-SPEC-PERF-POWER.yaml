# Q100-61-SPEC-PERF-POWER — Power Performance Specification
# AMPEL360 BWB H2 Hy-E Propulsion System

specification:
  id: Q100-61-SPEC-PERF-POWER
  category: PERFORMANCE
  parameter: POWER
  version: "1.0"
  status: DRAFT
  product: Q100-61-PROD-PROPULSOR-SYSTEM

description: >-
  Electrical power performance specification for the electric drive system.

requirements:
  continuous_power:
    value: 1000
    unit: kW
    condition: "Normal operation"
    tolerance: "-0/+5%"
    
  peak_power:
    value: 1200
    unit: kW
    duration_s: 30
    condition: "Takeoff/go-around"
    tolerance: "-0/+5%"
    
  input_voltage:
    nominal: 800
    unit: VDC
    range_min: 720
    range_max: 880
    
  power_factor:
    value: 0.95
    unit: dimensionless
    minimum: 0.90

efficiency:
  motor:
    value: 97
    unit: "%"
    at_condition: "Rated power"
  inverter:
    value: 99
    unit: "%"
    at_condition: "Rated power"
  combined:
    value: 96
    unit: "%"
    at_condition: "Rated power"

verification:
  method: Test
  test_type: Dynamometer testing
  acceptance_criteria: "Within tolerance bands"

traceability:
  requirements:
    - REQ-61-PERF-010
    - REQ-61-PERF-011
  certification:
    - CS-E 60

metadata:
  created: 2025-12-05
  modified: 2025-12-05
  author: AI (GitHub Copilot), prompted by Amedeo Pelliccia
  approver: TBD
