<?xml version="1.0" encoding="UTF-8"?>
<!--
  Q100-61-TPL-SYM-PROPULSION.svg
  Propulsion System Symbol Library
  
  Template for AMPEL360-BWB-H2-Hy-E Q100 Program
  ATA Chapter 61 - Propellers/Propulsors
  
  Program-Specific Symbols for Hybrid BWB Aircraft
  
  Usage:
  - Import into drawing
  - Copy required symbols
  - Scale and position as needed
-->
<svg xmlns="http://www.w3.org/2000/svg" 
     width="200mm" height="120mm" 
     viewBox="0 0 200 120">
  
  <!-- Symbol Library Header -->
  <text x="100" y="8" font-size="5" font-weight="bold" text-anchor="middle">
    PROPULSION SYMBOL LIBRARY (Q100 PROGRAM)
  </text>
  
  <!-- Propulsors Section -->
  <g transform="translate(5, 15)">
    <text x="0" y="0" font-size="3.5" font-weight="bold">PROPULSORS</text>
    
    <!-- Electric Propulsor -->
    <g transform="translate(0, 5)">
      <circle cx="8" cy="8" r="8" fill="none" stroke="#000" stroke-width="0.5"/>
      <text x="8" y="10" font-size="5" text-anchor="middle">E</text>
      <polygon points="16,8 24,4 24,12" fill="none" stroke="#000" stroke-width="0.5"/>
      <text x="28" y="10" font-size="2.5">Electric Propulsor</text>
    </g>
    
    <!-- H2 Fuel Cell Propulsor -->
    <g transform="translate(85, 5)">
      <circle cx="8" cy="8" r="8" fill="none" stroke="#000" stroke-width="0.5"/>
      <text x="8" y="10" font-size="4" text-anchor="middle">H₂</text>
      <polygon points="16,8 24,4 24,12" fill="none" stroke="#000" stroke-width="0.5"/>
      <text x="28" y="10" font-size="2.5">H2 Fuel Cell Propulsor</text>
    </g>
  </g>
  
  <!-- Power Sources Section -->
  <g transform="translate(5, 40)">
    <text x="0" y="0" font-size="3.5" font-weight="bold">POWER SOURCES</text>
    
    <!-- Fuel Cell Stack -->
    <g transform="translate(0, 5)">
      <rect x="0" y="0" width="20" height="14" fill="none" stroke="#000" stroke-width="0.5"/>
      <line x1="5" y1="0" x2="5" y2="14" stroke="#000" stroke-width="0.35"/>
      <line x1="10" y1="0" x2="10" y2="14" stroke="#000" stroke-width="0.35"/>
      <line x1="15" y1="0" x2="15" y2="14" stroke="#000" stroke-width="0.35"/>
      <text x="24" y="9" font-size="2.5">Fuel Cell Stack</text>
    </g>
    
    <!-- Battery Pack -->
    <g transform="translate(75, 5)">
      <rect x="0" y="2" width="18" height="10" fill="none" stroke="#000" stroke-width="0.5"/>
      <line x1="4" y1="2" x2="4" y2="12" stroke="#000" stroke-width="0.35"/>
      <line x1="8" y1="2" x2="8" y2="12" stroke="#000" stroke-width="0.35"/>
      <line x1="12" y1="2" x2="12" y2="12" stroke="#000" stroke-width="0.35"/>
      <text x="22" y="9" font-size="2.5">Battery Pack</text>
    </g>
    
    <!-- Power Converter -->
    <g transform="translate(140, 5)">
      <rect x="0" y="0" width="14" height="14" fill="none" stroke="#000" stroke-width="0.5"/>
      <text x="7" y="10" font-size="6" text-anchor="middle">⎓</text>
      <text x="18" y="9" font-size="2.5">DC/DC Converter</text>
    </g>
  </g>
  
  <!-- H2 System Section -->
  <g transform="translate(5, 65)">
    <text x="0" y="0" font-size="3.5" font-weight="bold">HYDROGEN SYSTEM</text>
    
    <!-- H2 Tank -->
    <g transform="translate(0, 5)">
      <ellipse cx="10" cy="7" rx="10" ry="7" fill="none" stroke="#000" stroke-width="0.5"/>
      <text x="10" y="9" font-size="4" text-anchor="middle">H₂</text>
      <text x="24" y="9" font-size="2.5">H2 Storage Tank</text>
    </g>
    
    <!-- H2 Valve -->
    <g transform="translate(75, 5)">
      <polygon points="0,7 7,0 14,7 7,14" fill="none" stroke="#000" stroke-width="0.5"/>
      <text x="18" y="9" font-size="2.5">H2 Valve</text>
    </g>
    
    <!-- H2 Regulator -->
    <g transform="translate(130, 5)">
      <circle cx="7" cy="7" r="7" fill="none" stroke="#000" stroke-width="0.5"/>
      <text x="7" y="9" font-size="4" text-anchor="middle">R</text>
      <text x="18" y="9" font-size="2.5">Pressure Regulator</text>
    </g>
  </g>
  
  <!-- Cooling Section -->
  <g transform="translate(5, 90)">
    <text x="0" y="0" font-size="3.5" font-weight="bold">THERMAL MANAGEMENT</text>
    
    <!-- Heat Exchanger -->
    <g transform="translate(0, 5)">
      <rect x="0" y="0" width="16" height="12" fill="none" stroke="#000" stroke-width="0.5"/>
      <line x1="0" y1="4" x2="16" y2="4" stroke="#000" stroke-width="0.35"/>
      <line x1="0" y1="8" x2="16" y2="8" stroke="#000" stroke-width="0.35"/>
      <text x="20" y="8" font-size="2.5">Heat Exchanger</text>
    </g>
    
    <!-- Cooling Pump -->
    <g transform="translate(75, 5)">
      <circle cx="6" cy="6" r="6" fill="none" stroke="#000" stroke-width="0.5"/>
      <polygon points="6,2 9,10 3,10" fill="none" stroke="#000" stroke-width="0.5"/>
      <text x="16" y="8" font-size="2.5">Cooling Pump</text>
    </g>
    
    <!-- Radiator -->
    <g transform="translate(130, 5)">
      <rect x="0" y="0" width="18" height="12" fill="none" stroke="#000" stroke-width="0.5"/>
      <line x1="3" y1="0" x2="3" y2="12" stroke="#000" stroke-width="0.35"/>
      <line x1="6" y1="0" x2="6" y2="12" stroke="#000" stroke-width="0.35"/>
      <line x1="9" y1="0" x2="9" y2="12" stroke="#000" stroke-width="0.35"/>
      <line x1="12" y1="0" x2="12" y2="12" stroke="#000" stroke-width="0.35"/>
      <line x1="15" y1="0" x2="15" y2="12" stroke="#000" stroke-width="0.35"/>
      <text x="22" y="8" font-size="2.5">Radiator</text>
    </g>
  </g>
  
</svg>
