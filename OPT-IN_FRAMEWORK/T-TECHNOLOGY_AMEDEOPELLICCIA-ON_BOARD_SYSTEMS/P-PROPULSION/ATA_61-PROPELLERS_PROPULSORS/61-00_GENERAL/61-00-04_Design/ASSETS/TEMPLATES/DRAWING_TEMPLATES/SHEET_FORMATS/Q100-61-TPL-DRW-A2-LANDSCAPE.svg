<?xml version="1.0" encoding="UTF-8"?>
<!--
  Q100-61-TPL-DRW-A2-LANDSCAPE.svg
  A2 Landscape Drawing Sheet Format (594 × 420 mm)
  
  Template for AMPEL360-BWB-H2-Hy-E Q100 Program
  ATA Chapter 61 - Propellers/Propulsors
  
  Usage:
  - Import into CAD/drawing application
  - Add title block from TITLE_BLOCKS/
  - Configure drawing-specific fields
-->
<svg xmlns="http://www.w3.org/2000/svg" 
     width="594mm" height="420mm" 
     viewBox="0 0 594 420">
  
  <!-- Sheet Border -->
  <rect x="15" y="15" width="564" height="390" 
        fill="none" stroke="#000" stroke-width="0.7"/>
  
  <!-- Drawing Area Border -->
  <rect x="20" y="20" width="554" height="380" 
        fill="none" stroke="#000" stroke-width="0.35"/>
  
  <!-- Title Block Area (Bottom Right) -->
  <rect x="409" y="325" width="160" height="70" 
        fill="none" stroke="#000" stroke-width="0.35"/>
  
  <!-- Revision Block Area (Above Title Block) -->
  <rect x="409" y="255" width="160" height="70" 
        fill="none" stroke="#000" stroke-width="0.35"/>
  
  <!-- Zone Grid Reference - Horizontal -->
  <g id="zone-grid-horizontal" stroke="#000" stroke-width="0.18">
    <text x="99" y="13" font-size="4" text-anchor="middle">A</text>
    <text x="198" y="13" font-size="4" text-anchor="middle">B</text>
    <text x="297" y="13" font-size="4" text-anchor="middle">C</text>
    <text x="396" y="13" font-size="4" text-anchor="middle">D</text>
    <text x="495" y="13" font-size="4" text-anchor="middle">E</text>
  </g>
  
  <!-- Zone Grid Reference - Vertical -->
  <g id="zone-grid-vertical" stroke="#000" stroke-width="0.18">
    <text x="12" y="110" font-size="4" text-anchor="middle">1</text>
    <text x="12" y="210" font-size="4" text-anchor="middle">2</text>
    <text x="12" y="310" font-size="4" text-anchor="middle">3</text>
  </g>
  
  <!-- Template Info (to be removed in actual drawings) -->
  <text x="297" y="210" font-size="8" text-anchor="middle" fill="#999">
    Q100-61-TPL-DRW-A2-LANDSCAPE
  </text>
  <text x="297" y="225" font-size="5" text-anchor="middle" fill="#999">
    A2 Sheet Format Template (594 × 420 mm)
  </text>
  
</svg>
