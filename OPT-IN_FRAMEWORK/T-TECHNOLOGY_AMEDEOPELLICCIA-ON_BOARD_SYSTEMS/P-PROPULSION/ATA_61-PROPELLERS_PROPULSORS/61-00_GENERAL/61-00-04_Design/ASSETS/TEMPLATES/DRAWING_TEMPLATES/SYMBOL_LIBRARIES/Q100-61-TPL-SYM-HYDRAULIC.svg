<?xml version="1.0" encoding="UTF-8"?>
<!--
  Q100-61-TPL-SYM-HYDRAULIC.svg
  Hydraulic System Symbol Library
  
  Template for AMPEL360-BWB-H2-Hy-E Q100 Program
  ATA Chapter 61 - Propellers/Propulsors
  
  Reference Standard: ISO 1219
  
  Usage:
  - Import into drawing
  - Copy required symbols
  - Scale and position as needed
-->
<svg xmlns="http://www.w3.org/2000/svg" 
     width="200mm" height="120mm" 
     viewBox="0 0 200 120">
  
  <!-- Symbol Library Header -->
  <text x="100" y="8" font-size="5" font-weight="bold" text-anchor="middle">
    HYDRAULIC SYMBOL LIBRARY (ISO 1219)
  </text>
  
  <!-- Pumps and Motors Section -->
  <g transform="translate(5, 15)">
    <text x="0" y="0" font-size="3.5" font-weight="bold">PUMPS &amp; MOTORS</text>
    
    <!-- Hydraulic Pump -->
    <g transform="translate(0, 5)">
      <circle cx="6" cy="6" r="6" fill="none" stroke="#000" stroke-width="0.5"/>
      <polygon points="6,2 9,10 3,10" fill="#000"/>
      <text x="16" y="8" font-size="2.5">Hydraulic Pump</text>
    </g>
    
    <!-- Hydraulic Motor -->
    <g transform="translate(70, 5)">
      <circle cx="6" cy="6" r="6" fill="none" stroke="#000" stroke-width="0.5"/>
      <polygon points="6,10 9,2 3,2" fill="#000"/>
      <text x="16" y="8" font-size="2.5">Hydraulic Motor</text>
    </g>
    
    <!-- Variable Pump -->
    <g transform="translate(140, 5)">
      <circle cx="6" cy="6" r="6" fill="none" stroke="#000" stroke-width="0.5"/>
      <polygon points="6,2 9,10 3,10" fill="#000"/>
      <line x1="0" y1="12" x2="12" y2="0" stroke="#000" stroke-width="0.5"/>
      <text x="16" y="8" font-size="2.5">Variable Pump</text>
    </g>
  </g>
  
  <!-- Valves Section -->
  <g transform="translate(5, 40)">
    <text x="0" y="0" font-size="3.5" font-weight="bold">VALVES</text>
    
    <!-- Check Valve -->
    <g transform="translate(0, 5)">
      <circle cx="6" cy="6" r="4" fill="none" stroke="#000" stroke-width="0.5"/>
      <polygon points="2,6 10,6 6,2" fill="none" stroke="#000" stroke-width="0.5"/>
      <text x="14" y="8" font-size="2.5">Check Valve</text>
    </g>
    
    <!-- Relief Valve -->
    <g transform="translate(55, 5)">
      <rect x="0" y="2" width="12" height="8" fill="none" stroke="#000" stroke-width="0.5"/>
      <polygon points="6,2 9,6 3,6" fill="#000"/>
      <text x="16" y="8" font-size="2.5">Relief Valve</text>
    </g>
    
    <!-- Directional Valve -->
    <g transform="translate(115, 5)">
      <rect x="0" y="0" width="16" height="12" fill="none" stroke="#000" stroke-width="0.5"/>
      <line x1="8" y1="0" x2="8" y2="12" stroke="#000" stroke-width="0.35"/>
      <text x="20" y="8" font-size="2.5">Directional Valve</text>
    </g>
  </g>
  
  <!-- Actuators Section -->
  <g transform="translate(5, 65)">
    <text x="0" y="0" font-size="3.5" font-weight="bold">ACTUATORS</text>
    
    <!-- Single Acting Cylinder -->
    <g transform="translate(0, 5)">
      <rect x="0" y="2" width="20" height="8" fill="none" stroke="#000" stroke-width="0.5"/>
      <rect x="2" y="4" width="10" height="4" fill="none" stroke="#000" stroke-width="0.5"/>
      <text x="24" y="8" font-size="2.5">Single Acting Cylinder</text>
    </g>
    
    <!-- Double Acting Cylinder -->
    <g transform="translate(85, 5)">
      <rect x="0" y="2" width="20" height="8" fill="none" stroke="#000" stroke-width="0.5"/>
      <rect x="5" y="4" width="10" height="4" fill="none" stroke="#000" stroke-width="0.5"/>
      <line x1="0" y1="6" x2="5" y2="6" stroke="#000" stroke-width="0.5"/>
      <line x1="15" y1="6" x2="20" y2="6" stroke="#000" stroke-width="0.5"/>
      <text x="24" y="8" font-size="2.5">Double Acting Cylinder</text>
    </g>
  </g>
  
  <!-- Accessories Section -->
  <g transform="translate(5, 90)">
    <text x="0" y="0" font-size="3.5" font-weight="bold">ACCESSORIES</text>
    
    <!-- Filter -->
    <g transform="translate(0, 5)">
      <rect x="0" y="0" width="12" height="12" fill="none" stroke="#000" stroke-width="0.5"/>
      <line x1="0" y1="12" x2="12" y2="0" stroke="#000" stroke-width="0.35"/>
      <text x="16" y="8" font-size="2.5">Filter</text>
    </g>
    
    <!-- Accumulator -->
    <g transform="translate(55, 5)">
      <ellipse cx="6" cy="6" rx="6" ry="8" fill="none" stroke="#000" stroke-width="0.5"/>
      <line x1="0" y1="6" x2="12" y2="6" stroke="#000" stroke-width="0.35"/>
      <text x="16" y="8" font-size="2.5">Accumulator</text>
    </g>
    
    <!-- Reservoir -->
    <g transform="translate(110, 5)">
      <rect x="0" y="4" width="16" height="8" fill="none" stroke="#000" stroke-width="0.5"/>
      <line x1="0" y1="4" x2="16" y2="4" stroke="#000" stroke-width="0.5"/>
      <text x="20" y="8" font-size="2.5">Reservoir</text>
    </g>
  </g>
  
</svg>
