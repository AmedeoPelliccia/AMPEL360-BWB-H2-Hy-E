# Template ID: Q100-61-TPL-YAML-PRODUCT-DEF
# Version: 1.0
# Description: Product Definition Schema Template

schema_version: "1.0"
template_id: "Q100-61-TPL-YAML-PRODUCT-DEF"

product:
  # Identification (Required)
  product_number: "[REQUIRED: e.g., Q100-61-PROD-001]"
  revision: "[REQUIRED: e.g., A]"
  title: "[REQUIRED: Product Title]"
  description: "[REQUIRED: Brief description]"
  
  # Classification
  ata_chapter: 61
  category: "PRODUCT"
  product_type: "[REQUIRED: LRU | SRU | Component]"
  
  # Configuration
  configuration:
    baseline: "[Configuration baseline ID]"
    effectivity:
      aircraft: "[Aircraft model]"
      from_serial: ""
      to_serial: ""
    options: []
    variants: []
  
  # Physical Properties
  physical:
    mass:
      value: 0.0
      unit: "kg"
      max_mass: 0.0
    envelope:
      length: { value: 0.0, unit: "mm" }
      width: { value: 0.0, unit: "mm" }
      height: { value: 0.0, unit: "mm" }
  
  # Performance
  performance:
    - parameter: "[Parameter name]"
      value: 0.0
      unit: "[Unit]"
      tolerance: 0.0
      min: 0.0
      max: 0.0
  
  # Top-Level Assemblies
  assemblies:
    - assembly_number: "[REQUIRED]"
      quantity: 1
      configuration: "Standard"
  
  # Interfaces
  interfaces:
    mechanical: []
    electrical: []
    data: []
    fluid: []
  
  # Certification
  certification:
    type_certificate: ""
    qualification_status: "Pending"  # Pending | Qualified | Certified
    environmental_category: "[DO-160 category]"
  
  # Lifecycle
  lifecycle:
    status: "Draft"
    design_life_hours: 0
    design_life_cycles: 0
  
  # Document Control
  document_control:
    version: "1.0"
    status: "DRAFT"
    author: ""
    date_created: ""
    last_modified: ""
