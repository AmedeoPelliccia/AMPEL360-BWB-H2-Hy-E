<?xml version="1.0" encoding="UTF-8"?>
<!--
  Q100-61-TPL-DRW-A1-LANDSCAPE.svg
  A1 Landscape Drawing Sheet Format (841 × 594 mm)
  
  Template for AMPEL360-BWB-H2-Hy-E Q100 Program
  ATA Chapter 61 - Propellers/Propulsors
  
  Usage:
  - Import into CAD/drawing application
  - Add title block from TITLE_BLOCKS/
  - Configure drawing-specific fields
-->
<svg xmlns="http://www.w3.org/2000/svg" 
     width="841mm" height="594mm" 
     viewBox="0 0 841 594">
  
  <!-- Sheet Border -->
  <rect x="20" y="20" width="801" height="554" 
        fill="none" stroke="#000" stroke-width="0.7"/>
  
  <!-- Drawing Area Border -->
  <rect x="25" y="25" width="791" height="544" 
        fill="none" stroke="#000" stroke-width="0.35"/>
  
  <!-- Title Block Area (Bottom Right) -->
  <rect x="606" y="494" width="185" height="75" 
        fill="none" stroke="#000" stroke-width="0.35"/>
  
  <!-- Revision Block Area (Above Title Block) -->
  <rect x="606" y="419" width="185" height="75" 
        fill="none" stroke="#000" stroke-width="0.35"/>
  
  <!-- Zone Grid Reference - Horizontal -->
  <g id="zone-grid-horizontal" stroke="#000" stroke-width="0.18">
    <text x="119" y="18" font-size="5" text-anchor="middle">A</text>
    <text x="238" y="18" font-size="5" text-anchor="middle">B</text>
    <text x="357" y="18" font-size="5" text-anchor="middle">C</text>
    <text x="476" y="18" font-size="5" text-anchor="middle">D</text>
    <text x="595" y="18" font-size="5" text-anchor="middle">E</text>
    <text x="714" y="18" font-size="5" text-anchor="middle">F</text>
  </g>
  
  <!-- Zone Grid Reference - Vertical -->
  <g id="zone-grid-vertical" stroke="#000" stroke-width="0.18">
    <text x="17" y="120" font-size="5" text-anchor="middle">1</text>
    <text x="17" y="220" font-size="5" text-anchor="middle">2</text>
    <text x="17" y="320" font-size="5" text-anchor="middle">3</text>
    <text x="17" y="420" font-size="5" text-anchor="middle">4</text>
    <text x="17" y="520" font-size="5" text-anchor="middle">5</text>
  </g>
  
  <!-- Template Info (to be removed in actual drawings) -->
  <text x="420" y="297" font-size="10" text-anchor="middle" fill="#999">
    Q100-61-TPL-DRW-A1-LANDSCAPE
  </text>
  <text x="420" y="315" font-size="6" text-anchor="middle" fill="#999">
    A1 Sheet Format Template (841 × 594 mm)
  </text>
  
</svg>
