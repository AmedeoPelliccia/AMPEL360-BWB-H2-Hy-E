<?xml version="1.0" encoding="UTF-8"?>
<!--
  Q100-61-TPL-DRW-A4-PORTRAIT.svg
  A4 Portrait Drawing Sheet Format (210 × 297 mm)
  
  Template for AMPEL360-BWB-H2-Hy-E Q100 Program
  ATA Chapter 61 - Propellers/Propulsors
  
  Usage:
  - Import into CAD/drawing application
  - Add title block from TITLE_BLOCKS/
  - Configure drawing-specific fields
-->
<svg xmlns="http://www.w3.org/2000/svg" 
     width="210mm" height="297mm" 
     viewBox="0 0 210 297">
  
  <!-- Sheet Border -->
  <rect x="10" y="10" width="190" height="277" 
        fill="none" stroke="#000" stroke-width="0.5"/>
  
  <!-- Drawing Area Border -->
  <rect x="15" y="15" width="180" height="267" 
        fill="none" stroke="#000" stroke-width="0.25"/>
  
  <!-- Title Block Area (Bottom) -->
  <rect x="15" y="237" width="180" height="40" 
        fill="none" stroke="#000" stroke-width="0.25"/>
  
  <!-- Revision Block Area (Above Title Block) -->
  <rect x="15" y="197" width="180" height="40" 
        fill="none" stroke="#000" stroke-width="0.25"/>
  
  <!-- Zone Grid Reference - Horizontal -->
  <g id="zone-grid-horizontal" stroke="#000" stroke-width="0.18">
    <text x="70" y="8" font-size="3" text-anchor="middle">A</text>
    <text x="140" y="8" font-size="3" text-anchor="middle">B</text>
  </g>
  
  <!-- Zone Grid Reference - Vertical -->
  <g id="zone-grid-vertical" stroke="#000" stroke-width="0.18">
    <text x="7" y="74" font-size="3" text-anchor="middle">1</text>
    <text x="7" y="148" font-size="3" text-anchor="middle">2</text>
    <text x="7" y="222" font-size="3" text-anchor="middle">3</text>
  </g>
  
  <!-- Template Info (to be removed in actual drawings) -->
  <text x="105" y="120" font-size="6" text-anchor="middle" fill="#999">
    Q100-61-TPL-DRW-A4-PORTRAIT
  </text>
  <text x="105" y="132" font-size="3.5" text-anchor="middle" fill="#999">
    A4 Sheet Format Template (210 × 297 mm)
  </text>
  
</svg>
