<?xml version="1.0" encoding="UTF-8"?>
<!--
  Q100-61-TPL-SYM-ELECTRICAL.svg
  Electrical Schematic Symbol Library
  
  Template for AMPEL360-BWB-H2-Hy-E Q100 Program
  ATA Chapter 61 - Propellers/Propulsors
  
  Reference Standards: IEEE, IEC 60617
  
  Usage:
  - Import into drawing
  - Copy required symbols
  - Scale and position as needed
-->
<svg xmlns="http://www.w3.org/2000/svg" 
     width="200mm" height="150mm" 
     viewBox="0 0 200 150">
  
  <!-- Symbol Library Header -->
  <text x="100" y="8" font-size="5" font-weight="bold" text-anchor="middle">
    ELECTRICAL SYMBOL LIBRARY (IEC 60617)
  </text>
  
  <!-- Power Sources Section -->
  <g transform="translate(5, 15)">
    <text x="0" y="0" font-size="3.5" font-weight="bold">POWER SOURCES</text>
    
    <!-- DC Source -->
    <g transform="translate(0, 5)">
      <circle cx="6" cy="6" r="6" fill="none" stroke="#000" stroke-width="0.5"/>
      <line x1="3" y1="6" x2="5" y2="6" stroke="#000" stroke-width="0.5"/>
      <line x1="7" y1="4" x2="7" y2="8" stroke="#000" stroke-width="0.5"/>
      <line x1="8" y1="5" x2="8" y2="7" stroke="#000" stroke-width="0.5"/>
      <text x="16" y="8" font-size="2.5">DC Source</text>
    </g>
    
    <!-- AC Source -->
    <g transform="translate(55, 5)">
      <circle cx="6" cy="6" r="6" fill="none" stroke="#000" stroke-width="0.5"/>
      <path d="M 3 6 Q 4.5 3 6 6 Q 7.5 9 9 6" fill="none" stroke="#000" stroke-width="0.5"/>
      <text x="16" y="8" font-size="2.5">AC Source</text>
    </g>
    
    <!-- Battery -->
    <g transform="translate(110, 5)">
      <line x1="0" y1="3" x2="0" y2="9" stroke="#000" stroke-width="0.5"/>
      <line x1="3" y1="5" x2="3" y2="7" stroke="#000" stroke-width="0.5"/>
      <line x1="6" y1="3" x2="6" y2="9" stroke="#000" stroke-width="0.5"/>
      <line x1="9" y1="5" x2="9" y2="7" stroke="#000" stroke-width="0.5"/>
      <text x="14" y="8" font-size="2.5">Battery</text>
    </g>
  </g>
  
  <!-- Passive Components Section -->
  <g transform="translate(5, 35)">
    <text x="0" y="0" font-size="3.5" font-weight="bold">PASSIVE COMPONENTS</text>
    
    <!-- Resistor -->
    <g transform="translate(0, 5)">
      <rect x="0" y="3" width="12" height="6" fill="none" stroke="#000" stroke-width="0.5"/>
      <text x="16" y="8" font-size="2.5">Resistor</text>
    </g>
    
    <!-- Capacitor -->
    <g transform="translate(55, 5)">
      <line x1="0" y1="0" x2="0" y2="12" stroke="#000" stroke-width="0.5"/>
      <line x1="3" y1="0" x2="3" y2="12" stroke="#000" stroke-width="0.5"/>
      <text x="8" y="8" font-size="2.5">Capacitor</text>
    </g>
    
    <!-- Inductor -->
    <g transform="translate(105, 5)">
      <path d="M 0 6 Q 2 0 4 6 Q 6 12 8 6 Q 10 0 12 6" fill="none" stroke="#000" stroke-width="0.5"/>
      <text x="16" y="8" font-size="2.5">Inductor</text>
    </g>
  </g>
  
  <!-- Switches Section -->
  <g transform="translate(5, 60)">
    <text x="0" y="0" font-size="3.5" font-weight="bold">SWITCHES</text>
    
    <!-- SPST Switch -->
    <g transform="translate(0, 5)">
      <circle cx="0" cy="6" r="1" fill="#000"/>
      <circle cx="10" cy="6" r="1" fill="#000"/>
      <line x1="0" y1="6" x2="8" y2="2" stroke="#000" stroke-width="0.5"/>
      <text x="14" y="8" font-size="2.5">SPST Switch</text>
    </g>
    
    <!-- Relay -->
    <g transform="translate(60, 5)">
      <rect x="0" y="0" width="12" height="12" fill="none" stroke="#000" stroke-width="0.5"/>
      <text x="6" y="8" font-size="4" text-anchor="middle">K</text>
      <text x="16" y="8" font-size="2.5">Relay</text>
    </g>
    
    <!-- Circuit Breaker -->
    <g transform="translate(110, 5)">
      <circle cx="0" cy="6" r="1" fill="#000"/>
      <circle cx="10" cy="6" r="1" fill="#000"/>
      <line x1="0" y1="6" x2="4" y2="2" stroke="#000" stroke-width="0.5"/>
      <line x1="4" y1="2" x2="10" y2="6" stroke="#000" stroke-width="0.5"/>
      <text x="14" y="8" font-size="2.5">Circuit Breaker</text>
    </g>
  </g>
  
  <!-- Connectors Section -->
  <g transform="translate(5, 85)">
    <text x="0" y="0" font-size="3.5" font-weight="bold">CONNECTORS</text>
    
    <!-- Male Connector -->
    <g transform="translate(0, 5)">
      <circle cx="4" cy="6" r="4" fill="none" stroke="#000" stroke-width="0.5"/>
      <line x1="4" y1="3" x2="4" y2="9" stroke="#000" stroke-width="0.5"/>
      <text x="12" y="8" font-size="2.5">Male Connector</text>
    </g>
    
    <!-- Female Connector -->
    <g transform="translate(60, 5)">
      <circle cx="4" cy="6" r="4" fill="none" stroke="#000" stroke-width="0.5"/>
      <text x="12" y="8" font-size="2.5">Female Connector</text>
    </g>
    
    <!-- Ground -->
    <g transform="translate(120, 5)">
      <line x1="4" y1="0" x2="4" y2="4" stroke="#000" stroke-width="0.5"/>
      <line x1="0" y1="4" x2="8" y2="4" stroke="#000" stroke-width="0.5"/>
      <line x1="1" y1="6" x2="7" y2="6" stroke="#000" stroke-width="0.5"/>
      <line x1="2" y1="8" x2="6" y2="8" stroke="#000" stroke-width="0.5"/>
      <text x="12" y="6" font-size="2.5">Ground</text>
    </g>
  </g>
  
  <!-- Motors and Generators Section -->
  <g transform="translate(5, 110)">
    <text x="0" y="0" font-size="3.5" font-weight="bold">MOTORS &amp; GENERATORS</text>
    
    <!-- Motor -->
    <g transform="translate(0, 5)">
      <circle cx="6" cy="6" r="6" fill="none" stroke="#000" stroke-width="0.5"/>
      <text x="6" y="8" font-size="5" text-anchor="middle">M</text>
      <text x="16" y="8" font-size="2.5">Motor</text>
    </g>
    
    <!-- Generator -->
    <g transform="translate(55, 5)">
      <circle cx="6" cy="6" r="6" fill="none" stroke="#000" stroke-width="0.5"/>
      <text x="6" y="8" font-size="5" text-anchor="middle">G</text>
      <text x="16" y="8" font-size="2.5">Generator</text>
    </g>
    
    <!-- Transformer -->
    <g transform="translate(110, 5)">
      <circle cx="4" cy="6" r="4" fill="none" stroke="#000" stroke-width="0.5"/>
      <circle cx="10" cy="6" r="4" fill="none" stroke="#000" stroke-width="0.5"/>
      <text x="18" y="8" font-size="2.5">Transformer</text>
    </g>
  </g>
  
</svg>
