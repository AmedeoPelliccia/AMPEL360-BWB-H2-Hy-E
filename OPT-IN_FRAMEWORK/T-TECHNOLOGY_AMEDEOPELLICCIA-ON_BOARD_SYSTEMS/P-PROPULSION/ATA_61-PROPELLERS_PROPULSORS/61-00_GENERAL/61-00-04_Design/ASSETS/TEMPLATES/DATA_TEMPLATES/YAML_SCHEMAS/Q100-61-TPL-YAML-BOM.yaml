# Template ID: Q100-61-TPL-YAML-BOM
# Version: 1.0
# Description: Bill of Materials Schema Template

schema_version: "1.0"
template_id: "Q100-61-TPL-YAML-BOM"

bom:
  # Header (Required)
  parent:
    part_number: "[REQUIRED: Parent assembly/product number]"
    revision: "[REQUIRED: e.g., A]"
    title: "[REQUIRED: Assembly title]"
  
  # BOM Configuration
  configuration:
    bom_type: "Engineering"  # Engineering | Manufacturing | Service
    effectivity: "[Configuration effectivity]"
    date: "[YYYY-MM-DD]"
  
  # Items
  items:
    - find_number: 1
      part_number: "[REQUIRED]"
      revision: ""
      title: "[Item description]"
      quantity: 1
      unit: "EA"  # EA | SET | KIT | FT | IN
      category: "Part"  # Part | Assembly | Standard | Consumable
      make_buy: "Buy"  # Make | Buy
      notes: ""
    
    # Add more items as needed
    - find_number: 2
      part_number: ""
      revision: ""
      title: ""
      quantity: 1
      unit: "EA"
      category: ""
      make_buy: ""
      notes: ""
  
  # Summary
  summary:
    total_items: 0
    total_parts: 0
    total_assemblies: 0
    total_standards: 0
  
  # Document Control
  document_control:
    version: "1.0"
    status: "DRAFT"
    author: ""
    date_created: ""
    last_modified: ""
