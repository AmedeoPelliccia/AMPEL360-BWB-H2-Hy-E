<?xml version="1.0" encoding="UTF-8"?>
<!--
  Q100-61-TPL-DRW-A3-LANDSCAPE.svg
  A3 Landscape Drawing Sheet Format (420 × 297 mm)
  
  Template for AMPEL360-BWB-H2-Hy-E Q100 Program
  ATA Chapter 61 - Propellers/Propulsors
  
  Usage:
  - Import into CAD/drawing application
  - Add title block from TITLE_BLOCKS/
  - Configure drawing-specific fields
-->
<svg xmlns="http://www.w3.org/2000/svg" 
     width="420mm" height="297mm" 
     viewBox="0 0 420 297">
  
  <!-- Sheet Border -->
  <rect x="10" y="10" width="400" height="277" 
        fill="none" stroke="#000" stroke-width="0.5"/>
  
  <!-- Drawing Area Border -->
  <rect x="15" y="15" width="390" height="267" 
        fill="none" stroke="#000" stroke-width="0.25"/>
  
  <!-- Title Block Area (Bottom Right) -->
  <rect x="275" y="227" width="125" height="50" 
        fill="none" stroke="#000" stroke-width="0.25"/>
  
  <!-- Revision Block Area (Above Title Block) -->
  <rect x="275" y="177" width="125" height="50" 
        fill="none" stroke="#000" stroke-width="0.25"/>
  
  <!-- Zone Grid Reference - Horizontal -->
  <g id="zone-grid-horizontal" stroke="#000" stroke-width="0.18">
    <text x="84" y="8" font-size="3.5" text-anchor="middle">A</text>
    <text x="168" y="8" font-size="3.5" text-anchor="middle">B</text>
    <text x="252" y="8" font-size="3.5" text-anchor="middle">C</text>
    <text x="336" y="8" font-size="3.5" text-anchor="middle">D</text>
  </g>
  
  <!-- Zone Grid Reference - Vertical -->
  <g id="zone-grid-vertical" stroke="#000" stroke-width="0.18">
    <text x="7" y="99" font-size="3.5" text-anchor="middle">1</text>
    <text x="7" y="198" font-size="3.5" text-anchor="middle">2</text>
  </g>
  
  <!-- Template Info (to be removed in actual drawings) -->
  <text x="210" y="148" font-size="7" text-anchor="middle" fill="#999">
    Q100-61-TPL-DRW-A3-LANDSCAPE
  </text>
  <text x="210" y="162" font-size="4" text-anchor="middle" fill="#999">
    A3 Sheet Format Template (420 × 297 mm)
  </text>
  
</svg>
