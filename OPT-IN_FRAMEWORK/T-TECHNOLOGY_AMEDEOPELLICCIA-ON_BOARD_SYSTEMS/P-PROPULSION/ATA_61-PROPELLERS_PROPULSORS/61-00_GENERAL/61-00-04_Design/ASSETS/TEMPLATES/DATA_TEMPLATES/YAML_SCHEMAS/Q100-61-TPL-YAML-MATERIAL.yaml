# Template ID: Q100-61-TPL-YAML-MATERIAL
# Version: 1.0
# Description: Material Data Schema Template

schema_version: "1.0"
template_id: "Q100-61-TPL-YAML-MATERIAL"

material:
  # Identification (Required)
  material_id: "[REQUIRED: e.g., MAT-AL7075-T6]"
  name: "[REQUIRED: Material name]"
  specification: "[REQUIRED: e.g., AMS 4045]"
  
  # Classification
  category: "[Metal | Polymer | Composite | Ceramic | Other]"
  subcategory: "[Aluminum | Steel | Titanium | CFRP | etc.]"
  grade: "[Material grade]"
  temper: "[Temper condition]"
  
  # Mechanical Properties
  mechanical:
    tensile_strength:
      ultimate: { value: 0.0, unit: "MPa" }
      yield: { value: 0.0, unit: "MPa" }
    elongation: { value: 0.0, unit: "%" }
    modulus_elasticity: { value: 0.0, unit: "GPa" }
    poisson_ratio: 0.0
    hardness: { value: 0.0, unit: "HRC" }
    fatigue_strength: { value: 0.0, unit: "MPa", cycles: 1e7 }
  
  # Physical Properties
  physical:
    density: { value: 0.0, unit: "kg/m3" }
    melting_point: { value: 0.0, unit: "C" }
    thermal_conductivity: { value: 0.0, unit: "W/m-K" }
    specific_heat: { value: 0.0, unit: "J/kg-K" }
    cte: { value: 0.0, unit: "1e-6/C" }
    electrical_resistivity: { value: 0.0, unit: "ohm-m" }
  
  # Chemical Composition
  composition:
    - element: "[Element symbol]"
      min_percent: 0.0
      max_percent: 0.0
      nominal_percent: 0.0
  
  # Processing
  processing:
    form: "[Sheet | Plate | Bar | Forging | Casting]"
    heat_treatment: ""
    surface_treatment: ""
  
  # Approvals
  approvals:
    aerospace_specs: []  # AMS, MIL-SPEC, etc.
    oem_approvals: []
  
  # Document Control
  document_control:
    version: "1.0"
    status: "DRAFT"
    source: "[Data source]"
    date_created: ""
    last_modified: ""
