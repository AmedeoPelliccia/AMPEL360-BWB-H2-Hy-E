<?xml version="1.0" encoding="UTF-8"?>
<!--
  Q100-61-TPL-SYM-PNEUMATIC.svg
  Pneumatic System Symbol Library
  
  Template for AMPEL360-BWB-H2-Hy-E Q100 Program
  ATA Chapter 61 - Propellers/Propulsors
  
  Reference Standard: ISO 1219
  
  Usage:
  - Import into drawing
  - Copy required symbols
  - Scale and position as needed
-->
<svg xmlns="http://www.w3.org/2000/svg" 
     width="200mm" height="100mm" 
     viewBox="0 0 200 100">
  
  <!-- Symbol Library Header -->
  <text x="100" y="8" font-size="5" font-weight="bold" text-anchor="middle">
    PNEUMATIC SYMBOL LIBRARY (ISO 1219)
  </text>
  
  <!-- Air Sources Section -->
  <g transform="translate(5, 15)">
    <text x="0" y="0" font-size="3.5" font-weight="bold">AIR SOURCES</text>
    
    <!-- Compressor -->
    <g transform="translate(0, 5)">
      <circle cx="6" cy="6" r="6" fill="none" stroke="#000" stroke-width="0.5"/>
      <polygon points="6,2 9,10 3,10" fill="none" stroke="#000" stroke-width="0.5"/>
      <text x="16" y="8" font-size="2.5">Compressor</text>
    </g>
    
    <!-- Air Supply -->
    <g transform="translate(65, 5)">
      <circle cx="6" cy="6" r="6" fill="none" stroke="#000" stroke-width="0.5"/>
      <text x="16" y="8" font-size="2.5">Air Supply</text>
    </g>
    
    <!-- Vacuum Pump -->
    <g transform="translate(120, 5)">
      <circle cx="6" cy="6" r="6" fill="none" stroke="#000" stroke-width="0.5"/>
      <polygon points="6,10 9,2 3,2" fill="none" stroke="#000" stroke-width="0.5"/>
      <text x="16" y="8" font-size="2.5">Vacuum Pump</text>
    </g>
  </g>
  
  <!-- Valves Section -->
  <g transform="translate(5, 40)">
    <text x="0" y="0" font-size="3.5" font-weight="bold">VALVES</text>
    
    <!-- 3/2 Valve -->
    <g transform="translate(0, 5)">
      <rect x="0" y="0" width="12" height="12" fill="none" stroke="#000" stroke-width="0.5"/>
      <text x="16" y="8" font-size="2.5">3/2 Valve</text>
    </g>
    
    <!-- 5/2 Valve -->
    <g transform="translate(55, 5)">
      <rect x="0" y="0" width="24" height="12" fill="none" stroke="#000" stroke-width="0.5"/>
      <line x1="12" y1="0" x2="12" y2="12" stroke="#000" stroke-width="0.35"/>
      <text x="28" y="8" font-size="2.5">5/2 Valve</text>
    </g>
    
    <!-- Quick Exhaust -->
    <g transform="translate(120, 5)">
      <circle cx="6" cy="6" r="6" fill="none" stroke="#000" stroke-width="0.5"/>
      <line x1="0" y1="6" x2="6" y2="6" stroke="#000" stroke-width="0.5"/>
      <line x1="6" y1="6" x2="12" y2="0" stroke="#000" stroke-width="0.5"/>
      <text x="16" y="8" font-size="2.5">Quick Exhaust</text>
    </g>
  </g>
  
  <!-- Treatment Section -->
  <g transform="translate(5, 65)">
    <text x="0" y="0" font-size="3.5" font-weight="bold">AIR TREATMENT</text>
    
    <!-- Filter -->
    <g transform="translate(0, 5)">
      <rect x="0" y="0" width="12" height="12" fill="none" stroke="#000" stroke-width="0.5"/>
      <line x1="0" y1="12" x2="12" y2="0" stroke="#000" stroke-width="0.35"/>
      <text x="16" y="8" font-size="2.5">Air Filter</text>
    </g>
    
    <!-- Regulator -->
    <g transform="translate(55, 5)">
      <rect x="0" y="0" width="12" height="12" fill="none" stroke="#000" stroke-width="0.5"/>
      <polygon points="6,2 10,6 6,10 2,6" fill="none" stroke="#000" stroke-width="0.5"/>
      <text x="16" y="8" font-size="2.5">Pressure Regulator</text>
    </g>
    
    <!-- Lubricator -->
    <g transform="translate(120, 5)">
      <rect x="0" y="0" width="12" height="12" fill="none" stroke="#000" stroke-width="0.5"/>
      <circle cx="6" cy="6" r="3" fill="none" stroke="#000" stroke-width="0.35"/>
      <text x="16" y="8" font-size="2.5">Lubricator</text>
    </g>
  </g>
  
  <!-- Exhaust/Silencer -->
  <g transform="translate(5, 85)">
    <text x="0" y="0" font-size="3.5" font-weight="bold">EXHAUST</text>
    
    <g transform="translate(0, 2)">
      <polygon points="0,0 8,0 4,8" fill="none" stroke="#000" stroke-width="0.5"/>
      <text x="12" y="5" font-size="2.5">Exhaust to Atmosphere</text>
    </g>
    
    <g transform="translate(70, 2)">
      <polygon points="0,0 8,0 4,8" fill="none" stroke="#000" stroke-width="0.5"/>
      <line x1="1" y1="6" x2="7" y2="6" stroke="#000" stroke-width="0.35"/>
      <text x="12" y="5" font-size="2.5">Silencer</text>
    </g>
  </g>
  
</svg>
