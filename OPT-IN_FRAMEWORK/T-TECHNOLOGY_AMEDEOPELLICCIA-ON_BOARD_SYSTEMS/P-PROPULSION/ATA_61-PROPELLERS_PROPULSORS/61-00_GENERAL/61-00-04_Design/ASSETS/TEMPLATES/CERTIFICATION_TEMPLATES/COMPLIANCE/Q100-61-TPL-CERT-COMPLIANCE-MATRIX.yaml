# Template ID: Q100-61-TPL-CERT-COMPLIANCE-MATRIX
# Version: 1.0
# Description: Compliance Matrix Template

schema_version: "1.0"
template_id: "Q100-61-TPL-CERT-COMPLIANCE-MATRIX"

compliance_matrix:
  header:
    document_id: "[REQUIRED: e.g., 61-00-04-CM-001]"
    title: "[REQUIRED: Compliance Matrix Title]"
    subject: "[REQUIRED: Product/System]"
    regulation: "[REQUIRED: CS-25 / FAR Part 25 / etc.]"
    revision: "A"
    date: "[YYYY-MM-DD]"
  
  requirements:
    - requirement_id: "[REQ-001]"
      regulatory_reference: "[e.g., CS 25.1309]"
      requirement_text: "[Requirement description]"
      applicability: "Applicable"  # Applicable | Not Applicable | Partial
      means_of_compliance:
        - method: "Analysis"  # Analysis | Test | Inspection | Demonstration
          document: "[MOC document reference]"
      compliance_status: "Open"  # Open | In Progress | Compliant | Not Compliant
      evidence:
        - type: "Report"
          document_id: "[Evidence document ID]"
          title: "[Document title]"
          status: "Draft"
      notes: ""
    
    # Add more requirements as needed
    - requirement_id: "[REQ-002]"
      regulatory_reference: ""
      requirement_text: ""
      applicability: ""
      means_of_compliance: []
      compliance_status: "Open"
      evidence: []
      notes: ""
  
  summary:
    total_requirements: 0
    applicable: 0
    compliant: 0
    in_progress: 0
    open: 0
  
  document_control:
    version: "1.0"
    status: "DRAFT"
    author: ""
    date_created: ""
    last_modified: ""
