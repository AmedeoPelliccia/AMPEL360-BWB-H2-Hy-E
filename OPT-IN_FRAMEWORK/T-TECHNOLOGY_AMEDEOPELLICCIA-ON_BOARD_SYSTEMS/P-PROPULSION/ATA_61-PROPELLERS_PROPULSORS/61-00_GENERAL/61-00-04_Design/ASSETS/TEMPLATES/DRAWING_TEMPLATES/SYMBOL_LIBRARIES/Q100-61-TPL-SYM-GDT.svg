<?xml version="1.0" encoding="UTF-8"?>
<!--
  Q100-61-TPL-SYM-GDT.svg
  Geometric Dimensioning and Tolerancing Symbol Library
  
  Template for AMPEL360-BWB-H2-Hy-E Q100 Program
  ATA Chapter 61 - Propellers/Propulsors
  
  Reference Standards: ISO 1101, ASME Y14.5
  
  Usage:
  - Import into drawing
  - Copy required symbols
  - Scale and position as needed
-->
<svg xmlns="http://www.w3.org/2000/svg" 
     width="200mm" height="150mm" 
     viewBox="0 0 200 150">
  
  <!-- Symbol Library Header -->
  <text x="100" y="8" font-size="5" font-weight="bold" text-anchor="middle">
    GD&amp;T SYMBOL LIBRARY (ISO 1101 / ASME Y14.5)
  </text>
  
  <!-- Form Tolerances Section -->
  <g transform="translate(5, 15)">
    <text x="0" y="0" font-size="3.5" font-weight="bold">FORM TOLERANCES</text>
    
    <!-- Straightness -->
    <g transform="translate(0, 5)">
      <rect x="0" y="0" width="8" height="8" fill="none" stroke="#000" stroke-width="0.35"/>
      <line x1="1" y1="4" x2="7" y2="4" stroke="#000" stroke-width="0.5"/>
      <text x="12" y="6" font-size="2.5">Straightness</text>
    </g>
    
    <!-- Flatness -->
    <g transform="translate(45, 5)">
      <rect x="0" y="0" width="8" height="8" fill="none" stroke="#000" stroke-width="0.35"/>
      <polygon points="1,6 4,2 7,6" fill="none" stroke="#000" stroke-width="0.5"/>
      <text x="12" y="6" font-size="2.5">Flatness</text>
    </g>
    
    <!-- Circularity -->
    <g transform="translate(90, 5)">
      <rect x="0" y="0" width="8" height="8" fill="none" stroke="#000" stroke-width="0.35"/>
      <circle cx="4" cy="4" r="2.5" fill="none" stroke="#000" stroke-width="0.5"/>
      <text x="12" y="6" font-size="2.5">Circularity</text>
    </g>
    
    <!-- Cylindricity -->
    <g transform="translate(135, 5)">
      <rect x="0" y="0" width="8" height="8" fill="none" stroke="#000" stroke-width="0.35"/>
      <ellipse cx="4" cy="4" rx="3" ry="2" fill="none" stroke="#000" stroke-width="0.5"/>
      <line x1="1" y1="2" x2="1" y2="6" stroke="#000" stroke-width="0.5"/>
      <line x1="7" y1="2" x2="7" y2="6" stroke="#000" stroke-width="0.5"/>
      <text x="12" y="6" font-size="2.5">Cylindricity</text>
    </g>
  </g>
  
  <!-- Orientation Tolerances Section -->
  <g transform="translate(5, 40)">
    <text x="0" y="0" font-size="3.5" font-weight="bold">ORIENTATION TOLERANCES</text>
    
    <!-- Perpendicularity -->
    <g transform="translate(0, 5)">
      <rect x="0" y="0" width="8" height="8" fill="none" stroke="#000" stroke-width="0.35"/>
      <line x1="2" y1="6" x2="6" y2="6" stroke="#000" stroke-width="0.5"/>
      <line x1="4" y1="2" x2="4" y2="6" stroke="#000" stroke-width="0.5"/>
      <text x="12" y="6" font-size="2.5">Perpendicularity</text>
    </g>
    
    <!-- Angularity -->
    <g transform="translate(55, 5)">
      <rect x="0" y="0" width="8" height="8" fill="none" stroke="#000" stroke-width="0.35"/>
      <line x1="2" y1="6" x2="6" y2="6" stroke="#000" stroke-width="0.5"/>
      <line x1="2" y1="6" x2="6" y2="2" stroke="#000" stroke-width="0.5"/>
      <text x="12" y="6" font-size="2.5">Angularity</text>
    </g>
    
    <!-- Parallelism -->
    <g transform="translate(110, 5)">
      <rect x="0" y="0" width="8" height="8" fill="none" stroke="#000" stroke-width="0.35"/>
      <line x1="1" y1="3" x2="7" y2="3" stroke="#000" stroke-width="0.5"/>
      <line x1="1" y1="5" x2="7" y2="5" stroke="#000" stroke-width="0.5"/>
      <text x="12" y="6" font-size="2.5">Parallelism</text>
    </g>
  </g>
  
  <!-- Location Tolerances Section -->
  <g transform="translate(5, 65)">
    <text x="0" y="0" font-size="3.5" font-weight="bold">LOCATION TOLERANCES</text>
    
    <!-- Position -->
    <g transform="translate(0, 5)">
      <rect x="0" y="0" width="8" height="8" fill="none" stroke="#000" stroke-width="0.35"/>
      <circle cx="4" cy="4" r="2" fill="none" stroke="#000" stroke-width="0.5"/>
      <line x1="4" y1="1" x2="4" y2="7" stroke="#000" stroke-width="0.5"/>
      <line x1="1" y1="4" x2="7" y2="4" stroke="#000" stroke-width="0.5"/>
      <text x="12" y="6" font-size="2.5">Position</text>
    </g>
    
    <!-- Concentricity -->
    <g transform="translate(45, 5)">
      <rect x="0" y="0" width="8" height="8" fill="none" stroke="#000" stroke-width="0.35"/>
      <circle cx="4" cy="4" r="2.5" fill="none" stroke="#000" stroke-width="0.5"/>
      <circle cx="4" cy="4" r="1" fill="none" stroke="#000" stroke-width="0.5"/>
      <text x="12" y="6" font-size="2.5">Concentricity</text>
    </g>
    
    <!-- Symmetry -->
    <g transform="translate(100, 5)">
      <rect x="0" y="0" width="8" height="8" fill="none" stroke="#000" stroke-width="0.35"/>
      <line x1="1" y1="3" x2="7" y2="3" stroke="#000" stroke-width="0.5"/>
      <line x1="1" y1="5" x2="7" y2="5" stroke="#000" stroke-width="0.5"/>
      <line x1="1" y1="4" x2="7" y2="4" stroke="#000" stroke-width="0.5"/>
      <text x="12" y="6" font-size="2.5">Symmetry</text>
    </g>
  </g>
  
  <!-- Runout Tolerances Section -->
  <g transform="translate(5, 90)">
    <text x="0" y="0" font-size="3.5" font-weight="bold">RUNOUT TOLERANCES</text>
    
    <!-- Circular Runout -->
    <g transform="translate(0, 5)">
      <rect x="0" y="0" width="8" height="8" fill="none" stroke="#000" stroke-width="0.35"/>
      <path d="M 2 6 A 2.5 2.5 0 0 1 6 6" fill="none" stroke="#000" stroke-width="0.5"/>
      <text x="12" y="6" font-size="2.5">Circular Runout</text>
    </g>
    
    <!-- Total Runout -->
    <g transform="translate(55, 5)">
      <rect x="0" y="0" width="8" height="8" fill="none" stroke="#000" stroke-width="0.35"/>
      <path d="M 2 6 A 2.5 2.5 0 0 1 6 6" fill="none" stroke="#000" stroke-width="0.5"/>
      <path d="M 2 5 A 2.5 2.5 0 0 1 6 5" fill="none" stroke="#000" stroke-width="0.5"/>
      <text x="12" y="6" font-size="2.5">Total Runout</text>
    </g>
  </g>
  
  <!-- Profile Tolerances Section -->
  <g transform="translate(5, 115)">
    <text x="0" y="0" font-size="3.5" font-weight="bold">PROFILE TOLERANCES</text>
    
    <!-- Profile of Line -->
    <g transform="translate(0, 5)">
      <rect x="0" y="0" width="8" height="8" fill="none" stroke="#000" stroke-width="0.35"/>
      <path d="M 1 6 C 2 2, 6 2, 7 6" fill="none" stroke="#000" stroke-width="0.5"/>
      <text x="12" y="6" font-size="2.5">Profile of Line</text>
    </g>
    
    <!-- Profile of Surface -->
    <g transform="translate(55, 5)">
      <rect x="0" y="0" width="8" height="8" fill="none" stroke="#000" stroke-width="0.35"/>
      <ellipse cx="4" cy="4" rx="3" ry="2" fill="none" stroke="#000" stroke-width="0.5"/>
      <text x="12" y="6" font-size="2.5">Profile of Surface</text>
    </g>
  </g>
  
  <!-- Modifiers Section -->
  <g transform="translate(110, 90)">
    <text x="0" y="0" font-size="3.5" font-weight="bold">MODIFIERS</text>
    
    <g transform="translate(0, 5)">
      <circle cx="4" cy="4" r="4" fill="none" stroke="#000" stroke-width="0.35"/>
      <text x="4" y="5.5" font-size="4" text-anchor="middle">M</text>
      <text x="12" y="5" font-size="2.5">MMC</text>
    </g>
    
    <g transform="translate(0, 15)">
      <circle cx="4" cy="4" r="4" fill="none" stroke="#000" stroke-width="0.35"/>
      <text x="4" y="5.5" font-size="4" text-anchor="middle">L</text>
      <text x="12" y="5" font-size="2.5">LMC</text>
    </g>
    
    <g transform="translate(0, 25)">
      <circle cx="4" cy="4" r="4" fill="none" stroke="#000" stroke-width="0.35"/>
      <text x="4" y="5.5" font-size="4" text-anchor="middle">P</text>
      <text x="12" y="5" font-size="2.5">Projected</text>
    </g>
  </g>
  
  <!-- Datum Symbol -->
  <g transform="translate(150, 90)">
    <text x="0" y="0" font-size="3.5" font-weight="bold">DATUM</text>
    
    <g transform="translate(0, 5)">
      <rect x="0" y="0" width="10" height="8" fill="none" stroke="#000" stroke-width="0.35"/>
      <text x="5" y="6" font-size="5" text-anchor="middle">A</text>
      <text x="14" y="6" font-size="2.5">Datum Feature</text>
    </g>
  </g>
  
</svg>
