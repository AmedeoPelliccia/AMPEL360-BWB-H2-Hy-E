# Template ID: Q100-61-TPL-YAML-PART-DEF
# Version: 1.0
# Description: Part Definition Schema Template

# TEMPLATE INSTRUCTIONS (Remove this block when using):
# Replace all [PLACEHOLDER] values with actual data.
# Remove optional fields if not needed.
# Ensure all required fields are populated.

schema_version: "1.0"
template_id: "Q100-61-TPL-YAML-PART-DEF"

part:
  # Identification (Required)
  part_number: "[REQUIRED: e.g., Q100-61-PRT-001]"
  revision: "[REQUIRED: e.g., A]"
  title: "[REQUIRED: Part Title]"
  description: "[REQUIRED: Brief description of the part]"
  
  # Classification
  ata_chapter: 61
  category: "PART"  # PART | DETAIL | STANDARD | CONSUMABLE
  criticality: "[REQUIRED: Critical | Major | Minor]"
  
  # Physical Properties
  physical:
    mass:
      value: 0.0  # [REQUIRED]
      unit: "kg"
      tolerance: 0.0
    material:
      primary: "[REQUIRED: Material specification]"
      secondary: ""
      coating: ""
    dimensions:
      length: { value: 0.0, unit: "mm" }
      width: { value: 0.0, unit: "mm" }
      height: { value: 0.0, unit: "mm" }
  
  # Design Data
  design:
    designer: "[REQUIRED: Name]"
    design_date: "[REQUIRED: YYYY-MM-DD]"
    cad_file: "[Path to CAD file]"
    drawing_number: "[Drawing reference]"
  
  # Manufacturing
  manufacturing:
    make_buy: "[REQUIRED: Make | Buy | MakeBuy]"
    process: "[Primary manufacturing process]"
    special_processes: []
    supplier: ""
    lead_time_days: 0
  
  # Lifecycle
  lifecycle:
    status: "Draft"  # Draft | Review | Released | Obsolete
    effectivity: "[From configuration]"
    supersedes: ""
    superseded_by: ""
  
  # Traceability
  traceability:
    requirements: []  # [REQ-61-001, REQ-61-002]
    hazards: []       # [HZ-61-001]
    tests: []         # [TEST-61-001]
  
  # Document Control
  document_control:
    version: "1.0"
    status: "DRAFT"
    author: "[Author name]"
    date_created: "[YYYY-MM-DD]"
    last_modified: "[YYYY-MM-DD]"
