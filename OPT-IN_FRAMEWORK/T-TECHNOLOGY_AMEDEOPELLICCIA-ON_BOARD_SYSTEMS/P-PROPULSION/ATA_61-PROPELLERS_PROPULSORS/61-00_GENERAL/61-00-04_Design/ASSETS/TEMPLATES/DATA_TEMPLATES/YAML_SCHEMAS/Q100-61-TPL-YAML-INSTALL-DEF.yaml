# Template ID: Q100-61-TPL-YAML-INSTALL-DEF
# Version: 1.0
# Description: Installation Definition Schema Template

schema_version: "1.0"
template_id: "Q100-61-TPL-YAML-INSTALL-DEF"

installation:
  # Identification (Required)
  installation_id: "[REQUIRED: e.g., Q100-61-INST-001]"
  revision: "[REQUIRED: e.g., A]"
  title: "[REQUIRED: Installation Title]"
  description: "[REQUIRED: Brief description]"
  
  # Classification
  ata_chapter: 61
  zone: "[Aircraft zone]"
  location: "[Specific location]"
  
  # Installed Item
  installed_item:
    item_number: "[REQUIRED: Product/Assembly number]"
    item_type: "Product"  # Product | Assembly | Part
    quantity: 1
  
  # Mounting
  mounting:
    method: "[Bolted | Bonded | Quick-release | Other]"
    interface_structure: "[Structure reference]"
    fasteners:
      - type: "[Bolt | Rivet | Pin]"
        part_number: ""
        quantity: 0
        torque: { value: 0.0, unit: "Nm" }
  
  # Position
  position:
    reference_frame: "[Aircraft | Structure | Local]"
    coordinates:
      x: { value: 0.0, unit: "mm" }
      y: { value: 0.0, unit: "mm" }
      z: { value: 0.0, unit: "mm" }
    orientation:
      roll: { value: 0.0, unit: "deg" }
      pitch: { value: 0.0, unit: "deg" }
      yaw: { value: 0.0, unit: "deg" }
  
  # Clearances
  clearances:
    - direction: "[+X | -X | +Y | -Y | +Z | -Z]"
      required: { value: 0.0, unit: "mm" }
      actual: { value: 0.0, unit: "mm" }
  
  # Connections
  connections:
    electrical: []
    fluid: []
    pneumatic: []
    data: []
  
  # Access
  access:
    panels: []  # Access panel references
    tools_required: []
    special_equipment: []
  
  # Document Control
  document_control:
    version: "1.0"
    status: "DRAFT"
    author: ""
    date_created: ""
    last_modified: ""
