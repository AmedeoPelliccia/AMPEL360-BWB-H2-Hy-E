  assembly_number: "[REQUIRED: e.g., Q100-61-ASSY-001]"
  revision: "[REQUIRED: e.g., A]"
  title: "[REQUIRED: Assembly Title]"
  description: "[REQUIRED: Brief description]"
  
  # Classification
  ata_chapter: 61
  category: "ASSEMBLY"
  level: "[REQUIRED: Top | Sub | Detail]"
  criticality: "[REQUIRED: Critical | Major | Minor]"
  
  # Physical Properties
  physical:
    mass:
      value: 0.0
      unit: "kg"
      tolerance: 0.0
    envelope:
      length: { value: 0.0, unit: "mm" }
      width: { value: 0.0, unit: "mm" }
      height: { value: 0.0, unit: "mm" }
    cg_location:
      x: { value: 0.0, unit: "mm" }
      y: { value: 0.0, unit: "mm" }
      z: { value: 0.0, unit: "mm" }
  
