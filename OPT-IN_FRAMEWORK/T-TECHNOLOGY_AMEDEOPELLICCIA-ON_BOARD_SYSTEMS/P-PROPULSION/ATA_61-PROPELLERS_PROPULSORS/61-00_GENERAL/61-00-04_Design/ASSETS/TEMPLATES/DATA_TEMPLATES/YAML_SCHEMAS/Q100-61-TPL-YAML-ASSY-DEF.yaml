  components:
    - part_number: "[REQUIRED]"
      quantity: 1
      find_number: 1
      item_type: "Part"  # Part | Assembly | Standard
    # Add more components as needed
  
  # Interfaces
  interfaces:
    mechanical: []
    electrical: []
    fluid: []
    thermal: []
  
  # Design Data
  design:
    designer: "[REQUIRED]"
    design_date: "[YYYY-MM-DD]"
    cad_file: "[Path to CAD assembly]"
    drawing_number: "[Drawing reference]"
  
  # Lifecycle
  lifecycle:
    status: "Draft"
    effectivity: ""
    supersedes: ""
  
  # Traceability
  traceability:
    requirements: []
    hazards: []
    tests: []
  
