<?xml version="1.0" encoding="UTF-8"?>
<!--
  Q100-61-TPL-REVISION-BLOCK.svg
  Drawing Revision History Block
  
  Template for AMPEL360-BWB-H2-Hy-E Q100 Program
  ATA Chapter 61 - Propellers/Propulsors
  
  Usage:
  - Import into sheet format
  - Position above or to the left of title block
  - Add revision entries as changes are made
-->
<svg xmlns="http://www.w3.org/2000/svg" 
     width="180mm" height="40mm" 
     viewBox="0 0 180 40">
  
  <!-- Revision Block Outer Border -->
  <rect x="0" y="0" width="180" height="40" 
        fill="none" stroke="#000" stroke-width="0.5"/>
  
  <!-- Header Row -->
  <rect x="0" y="0" width="180" height="8" 
        fill="#f0f0f0" stroke="#000" stroke-width="0.25"/>
  
  <!-- Column Dividers -->
  <line x1="15" y1="0" x2="15" y2="40" stroke="#000" stroke-width="0.25"/>
  <line x1="35" y1="0" x2="35" y2="40" stroke="#000" stroke-width="0.25"/>
  <line x1="55" y1="0" x2="55" y2="40" stroke="#000" stroke-width="0.25"/>
  
  <!-- Row Dividers -->
  <line x1="0" y1="16" x2="180" y2="16" stroke="#000" stroke-width="0.18"/>
  <line x1="0" y1="24" x2="180" y2="24" stroke="#000" stroke-width="0.18"/>
  <line x1="0" y1="32" x2="180" y2="32" stroke="#000" stroke-width="0.18"/>
  
  <!-- Header Labels -->
  <g font-size="2.5" font-weight="bold" fill="#000">
    <text x="7.5" y="5.5" text-anchor="middle">REV</text>
    <text x="25" y="5.5" text-anchor="middle">DATE</text>
    <text x="45" y="5.5" text-anchor="middle">BY</text>
    <text x="117.5" y="5.5" text-anchor="middle">DESCRIPTION</text>
  </g>
  
  <!-- Placeholder Rows (replace when using) -->
  <g font-size="2.5" fill="#999">
    <!-- Row 1 -->
    <text x="7.5" y="13" text-anchor="middle">[A]</text>
    <text x="25" y="13" text-anchor="middle">[DATE]</text>
    <text x="45" y="13" text-anchor="middle">[XX]</text>
    <text x="57" y="13">[Initial Release]</text>
    
    <!-- Row 2 -->
    <text x="7.5" y="21" text-anchor="middle">[B]</text>
    <text x="25" y="21" text-anchor="middle">[DATE]</text>
    <text x="45" y="21" text-anchor="middle">[XX]</text>
    <text x="57" y="21">[Description of change]</text>
    
    <!-- Row 3 -->
    <text x="7.5" y="29" text-anchor="middle">[C]</text>
    <text x="25" y="29" text-anchor="middle">[DATE]</text>
    <text x="45" y="29" text-anchor="middle">[XX]</text>
    <text x="57" y="29">[Description of change]</text>
    
    <!-- Row 4 -->
    <text x="7.5" y="37" text-anchor="middle">[D]</text>
    <text x="25" y="37" text-anchor="middle">[DATE]</text>
    <text x="45" y="37" text-anchor="middle">[XX]</text>
    <text x="57" y="37">[Description of change]</text>
  </g>
  
</svg>
