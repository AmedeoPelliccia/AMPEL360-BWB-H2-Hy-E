# Description: Model Definition Schema Template

schema_version: "1.0"
template_id: "Q100-61-TPL-YAML-MODEL-DEF"

model:
  # Identification (Required)
  model_id: "[REQUIRED: e.g., Q100-61-MODL-001]"
  revision: "[REQUIRED: e.g., A]"
  title: "[REQUIRED: Model Title]"
  description: "[REQUIRED: Brief description]"
  
  # Classification
  ata_chapter: 61
  model_type: "[REQUIRED: CAD | FEA | CFD | System | Thermal | Other]"
  purpose: "[Analysis | Simulation | Visualization | Manufacturing]"
  
  # Model Information
  model_info:
    software: "[Software name and version]"
    format: "[File format]"
    file_path: "[Relative path to model file]"
    file_size_mb: 0.0
    units: "mm"  # mm | m | in
  
  # Scope
  scope:
    subject: "[What the model represents]"
    fidelity: "[High | Medium | Low]"
    assumptions: []
    limitations: []
  
  # Input Data
  inputs:
    - name: "[Input parameter]"
      value: 0.0
      unit: "[Unit]"
      source: "[Source document]"
  
  # Output Data
  outputs:
    - name: "[Output parameter]"
      value: 0.0
      unit: "[Unit]"
      location: "[Where to find result]"
  
  # Validation
  validation:
    status: "Pending"  # Pending | Validated | Not Validated
    method: ""
    reference: ""
    date: ""
  
  # Dependencies
  dependencies:
    parent_models: []
    child_models: []
    input_data: []
  
  # Traceability
  traceability:
    requirements: []
    analysis_reports: []
    test_data: []
  
  # Document Control
  document_control:
    version: "1.0"
    status: "DRAFT"
    author: ""
    date_created: ""
    last_modified: ""
