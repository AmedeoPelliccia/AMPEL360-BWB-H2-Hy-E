# Template ID: Q100-61-TPL-YAML-CONFIG
# Version: 1.0
# Description: Configuration Schema Template

schema_version: "1.0"
template_id: "Q100-61-TPL-YAML-CONFIG"

configuration:
  # Identification (Required)
  config_id: "[REQUIRED: e.g., Q100-61-CFG-001]"
  revision: "[REQUIRED: e.g., A]"
  title: "[REQUIRED: Configuration Title]"
  description: "[REQUIRED: Brief description]"
  
  # Baseline
  baseline:
    type: "Development"  # Development | Functional | Allocated | Product
    date: "[YYYY-MM-DD]"
    milestone: "[PDR | CDR | TRR | First Flight]"
  
  # Scope
  scope:
    product: "[Product number]"
    assembly: "[Assembly number]"
    subsystem: "[Subsystem name]"
  
  # Configuration Items
  items:
    - ci_number: "[CI identifier]"
      ci_name: "[CI name]"
      revision: ""
      status: "Baseline"  # Baseline | Changed | Pending
    
  # Options and Variants
  options:
    - option_code: "[Option code]"
      description: "[Option description]"
      selected: false
  
  variants:
    - variant_code: "[Variant code]"
      description: "[Variant description]"
      effectivity: ""
  
  # Effectivity
  effectivity:
    aircraft_model: "[Model]"
    serial_range:
      from: ""
      to: ""
    mod_number: ""
  
  # Changes
  pending_changes: []
  
  # Document Control
  document_control:
    version: "1.0"
    status: "DRAFT"
    author: ""
    date_created: ""
    last_modified: ""
