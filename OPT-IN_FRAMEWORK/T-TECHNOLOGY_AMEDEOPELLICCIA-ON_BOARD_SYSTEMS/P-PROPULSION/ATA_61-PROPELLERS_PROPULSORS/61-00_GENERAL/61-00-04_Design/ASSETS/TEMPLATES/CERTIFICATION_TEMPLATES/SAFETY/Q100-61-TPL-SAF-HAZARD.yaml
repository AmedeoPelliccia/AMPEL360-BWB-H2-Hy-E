# Template ID: Q100-61-TPL-SAF-HAZARD
# Version: 1.0
# Description: Hazard Analysis Template

schema_version: "1.0"
template_id: "Q100-61-TPL-SAF-HAZARD"

hazard_analysis:
  header:
    document_id: "[REQUIRED: e.g., 61-00-04-HA-001]"
    title: "[REQUIRED: Hazard Analysis Title]"
    subject: "[REQUIRED: System/Product]"
    revision: "A"
    date: "[YYYY-MM-DD]"
    analyst: ""
  
  scope:
    system: "[System name]"
    phases: ["Ground", "Takeoff", "Cruise", "Landing"]
    assumptions: []
  
  hazards:
    - id: "HZ-001"
      description: "[REQUIRED: Hazard description]"
      cause: "[Potential cause]"
      phase: "[Flight phase]"
      effect: "[Effect on aircraft/crew/passengers]"
      severity: "Catastrophic"  # Catastrophic | Hazardous | Major | Minor | No Effect
      likelihood: "Remote"  # Frequent | Probable | Remote | Extremely Remote | Extremely Improbable
      risk_level: "High"  # High | Medium | Low | Acceptable
      existing_controls: "[Current mitigations]"
      recommended_actions: "[Additional mitigations]"
      residual_risk: ""
      status: "Open"  # Open | In Progress | Closed
      responsible: ""
      target_date: ""
    
    # Add more hazards as needed
  
  risk_matrix:
    # Define severity levels
    severity_levels:
      - level: "Catastrophic"
        definition: "Multiple fatalities, hull loss"
        classification: "1"
      - level: "Hazardous"
        definition: "Large reduction in safety margins"
        classification: "2"
      - level: "Major"
        definition: "Significant reduction in safety margins"
        classification: "3"
      - level: "Minor"
        definition: "Slight reduction in safety margins"
        classification: "4"
      - level: "No Effect"
        definition: "No effect on safety"
        classification: "5"
  
  summary:
    total_hazards: 0
    high_risk: 0
    medium_risk: 0
    low_risk: 0
    closed: 0
  
  document_control:
    version: "1.0"
    status: "DRAFT"
    author: ""
    approved_by: ""
