# Q100-61-INST-DEF-MOTOR-TO-GEARBOX — Motor to Gearbox Installation Definition
# AMPEL360-BWB-H2-Hy-E Hybrid Propulsion System

installation:
  id: "Q100-61-INST-DEF-MOTOR-TO-GEARBOX"
  name: "Motor to Gearbox Installation"
  version: "1.0.0"
  status: "Draft"
  ata_chapter: "61"
  program: "Q100"

  description: |
    Defines the interface and mounting requirements for coupling the 
    electric motor to the reduction gearbox.

  mechanical:
    mount_type: "Bolted flange with spline coupling"
    
    motor_flange:
      bolt_circle_diameter_mm: 280
      flange_thickness_mm: 25
      fasteners:
        - type: "NAS6206-16"
          quantity: 12
          torque_Nm: 55
          safety_wire: true
      alignment_pins:
        type: "Dowel pin"
        quantity: 2
        diameter_mm: 10
        fit: "H7/n6"
    
    spline_coupling:
      type: "Involute spline"
      class: "Class 5 fit"
      teeth: 36
      module: 3
      pressure_angle_deg: 30
      face_width_mm: 40
      torque_capacity_Nm: 5000
      lubrication: "Grease, MIL-PRF-23827"
    
    alignment:
      angular_misalignment_max_mrad: 0.5
      parallel_offset_max_mm: 0.05
      axial_float_mm: 2.0
      method: "Laser alignment"

  electrical:
    temperature_sensors:
      - location: "Stator winding"
        type: "PT1000"
        quantity: 6
      - location: "Bearing"
        type: "PT1000"
        quantity: 2
    
    speed_sensor:
      type: "Resolver"
      poles: 4
      connector: "MIL-DTL-38999"
      
    power_connection:
      type: "Terminal block"
      phases: 3
      current_rating_A: 600
      voltage_rating_V: 800

  fluid:
    cooling_jacket:
      type: "Integral water jacket"
      inlet_size_mm: 20
      outlet_size_mm: 20
      flow_rate_lpm: 30
      pressure_drop_bar: 0.5
      medium: "Propylene glycol/water 50/50"

  clearances:
    coupling_access_mm: 150
    bolt_access_mm: 100
    sensor_access_mm: 80

  weight:
    motor_kg: 85
    coupling_hardware_kg: 8

  references:
    icds:
      - "ICD-61-010"
    drawings:
      - "Q100-61-DRW-EMD-MOTOR-001"
      - "Q100-61-DRW-EMD-COUPLING-001"
    requirements:
      - "REQ-61-EMD-001"
      - "REQ-61-EMD-002"
      - "REQ-61-EMD-003"
    safety:
      - "HZ-61-0020"
