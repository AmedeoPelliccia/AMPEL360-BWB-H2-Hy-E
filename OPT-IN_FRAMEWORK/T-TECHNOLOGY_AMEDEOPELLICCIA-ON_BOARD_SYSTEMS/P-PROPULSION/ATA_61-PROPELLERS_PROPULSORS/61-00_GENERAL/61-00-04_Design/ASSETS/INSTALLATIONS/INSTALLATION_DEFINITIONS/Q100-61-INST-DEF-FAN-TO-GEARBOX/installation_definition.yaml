# Q100-61-INST-DEF-FAN-TO-GEARBOX — Fan to Gearbox Installation Definition
# AMPEL360-BWB-H2-Hy-E Hybrid Propulsion System

installation:
  id: "Q100-61-INST-DEF-FAN-TO-GEARBOX"
  name: "Fan to Gearbox Installation"
  version: "1.0.0"
  status: "Draft"
  ata_chapter: "61"
  program: "Q100"

  description: |
    Defines the interface and mounting requirements for installing the 
    open-fan assembly onto the reduction gearbox output shaft.

  mechanical:
    mount_type: "Splined hub with retention nut"
    
    hub_spline:
      type: "Involute spline"
      teeth: 48
      module: 4
      pressure_angle_deg: 30
      class: "Class 5 fit"
      torque_capacity_Nm: 15000
    
    hub_retention:
      type: "Spanner nut with locking tab"
      thread: "M120x2"
      preload_kN: 200
      torque_Nm: 450
      locking: "Tab washer, bent into slots"
    
    blades:
      quantity: 12
      root_type: "Dovetail with retention pin"
      preload: "Centrifugal, self-tightening"
      retention_pin_shear_kN: 50
    
    pitch_mechanism:
      type: "Hydraulic rotary actuator"
      range_deg: "-15 to +90"
      rate_deg_per_sec: 10
      holding_torque_Nm: 500
    
    spinner:
      attachment: "Threaded ring, 24 fasteners"
      fastener_type: "NAS1801-4"
      torque_Nm: 3.5
      material: "Carbon fiber composite"

  balance:
    static_imbalance_max_g_mm: 10
    dynamic_imbalance_max_g_mm2: 50
    balance_plane_1_location_mm: 0  # Hub plane
    balance_plane_2_location_mm: 300  # Blade mid-span
    balance_speed_rpm: 1500
    balance_method: "Trial weight"
    balance_weights:
      type: "Clamp-on or bolt-on"
      material: "Tungsten or steel"
      locations: "Hub balance ring"

  clearances:
    blade_tip_mm: 50
    spinner_gap_mm: 5
    pitch_mechanism_access_mm: 200

  weight:
    hub_kg: 45
    blades_total_kg: 120
    spinner_kg: 8
    pitch_mechanism_kg: 25
    balance_weights_kg: 2

  references:
    icds:
      - "ICD-61-030"
    drawings:
      - "Q100-61-DRW-OFP-HUB-001"
      - "Q100-61-DRW-OFP-BLADE-001"
    requirements:
      - "REQ-61-OFP-001"
      - "REQ-61-OFP-002"
      - "REQ-61-OFP-003"
    safety:
      - "HZ-61-0040"
      - "HZ-61-0041"
