  Q100-61-TPL-REVISION-BLOCK — Standard Revision Block Template
-->
<svg xmlns="http://www.w3.org/2000/svg"
     xmlns:xlink="http://www.w3.org/1999/xlink"
     width="180mm"
     height="40mm"
     viewBox="0 0 180 40">
  
  <title>Q100-61-TPL-REVISION-BLOCK — AMPEL360 Revision Block</title>
  <desc>Standard revision block template for ATA 61 drawings</desc>
  
  <defs>
    <style>
      .border { stroke: #000000; stroke-width: 0.5; fill: none; }
      .thin { stroke: #000000; stroke-width: 0.18; fill: none; }
      .text-header { font-family: Arial, Helvetica, sans-serif; font-size: 2.5; font-weight: bold; fill: #000000; }
      .text-label { font-family: Arial, Helvetica, sans-serif; font-size: 2; fill: #000000; }
    </style>
  </defs>
  
  <!-- Outer Border -->
  <rect x="0" y="0" width="180" height="40" class="border"/>
  
  <!-- Header Row -->
  <rect x="0" y="0" width="180" height="8" class="border"/>
  <text x="90" y="5.5" text-anchor="middle" class="text-header">REVISION HISTORY</text>
  
  <!-- Column Headers -->
  <rect x="0" y="8" width="180" height="6" class="border"/>
  
  <!-- REV Column -->
  <rect x="0" y="8" width="15" height="6" class="border"/>
  <text x="7.5" y="12.5" text-anchor="middle" class="text-label">REV</text>
  
  <!-- DATE Column -->
  <rect x="15" y="8" width="25" height="6" class="border"/>
  <text x="27.5" y="12.5" text-anchor="middle" class="text-label">DATE</text>
  
  <!-- BY Column -->
  <rect x="40" y="8" width="20" height="6" class="border"/>
  <text x="50" y="12.5" text-anchor="middle" class="text-label">BY</text>
  
  <!-- DESCRIPTION Column -->
  <rect x="60" y="8" width="90" height="6" class="border"/>
  <text x="105" y="12.5" text-anchor="middle" class="text-label">DESCRIPTION</text>
  
  <!-- ECN Column -->
  <rect x="150" y="8" width="30" height="6" class="border"/>
  <text x="165" y="12.5" text-anchor="middle" class="text-label">ECN</text>
  
  <!-- Data Rows (4 rows) -->
  <!-- Row 1 -->
  <rect x="0" y="14" width="15" height="6" class="border"/>
  <rect x="15" y="14" width="25" height="6" class="border"/>
  <rect x="40" y="14" width="20" height="6" class="border"/>
  <rect x="60" y="14" width="90" height="6" class="border"/>
  <rect x="150" y="14" width="30" height="6" class="border"/>
  
  <!-- Row 2 -->
  <rect x="0" y="20" width="15" height="6" class="border"/>
  <rect x="15" y="20" width="25" height="6" class="border"/>
  <rect x="40" y="20" width="20" height="6" class="border"/>
  <rect x="60" y="20" width="90" height="6" class="border"/>
  <rect x="150" y="20" width="30" height="6" class="border"/>
  
  <!-- Row 3 -->
  <rect x="0" y="26" width="15" height="6" class="border"/>
  <rect x="15" y="26" width="25" height="6" class="border"/>
  <rect x="40" y="26" width="20" height="6" class="border"/>
  <rect x="60" y="26" width="90" height="6" class="border"/>
  <rect x="150" y="26" width="30" height="6" class="border"/>
  
  <!-- Row 4 -->
  <rect x="0" y="32" width="15" height="8" class="border"/>
  <rect x="15" y="32" width="25" height="8" class="border"/>
  <rect x="40" y="32" width="20" height="8" class="border"/>
  <rect x="60" y="32" width="90" height="8" class="border"/>
  <rect x="150" y="32" width="30" height="8" class="border"/>
  
</svg>
