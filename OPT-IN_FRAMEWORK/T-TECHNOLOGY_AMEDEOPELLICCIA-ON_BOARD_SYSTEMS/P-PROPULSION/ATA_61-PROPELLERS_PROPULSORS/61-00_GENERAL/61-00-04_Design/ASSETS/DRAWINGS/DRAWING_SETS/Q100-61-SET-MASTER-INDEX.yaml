# Q100-61-SET-MASTER-INDEX — Master Index of Drawing Sets for ATA 61
# This file maintains the authoritative list of all drawing sets for the
# Q100 program propulsion system (ATA 61 - Propellers/Propulsors).

version: 1
ata_chapter: "61"
program: "Q100"
owner: "AMPEL360 Propulsion Engineering"
last_updated: "2025-12-04"
status: "Draft"

# Drawing Sets Registry
sets:
  - id: "Q100-61-SET-OFP"
    name: "Open Fan Propulsor Set"
    description: "Engineering drawings for open-fan propulsor blades, hub, and nacelle"
    ata_sections:
      - "61-10"
      - "61-20"
    subsystems:
      - "Fan blades"
      - "Hub assembly"
      - "Nacelle structure"
      - "Pitch control mechanism"
    location: "./Q100-61-SET-OFP/"
    status: "Active"
    revision: "1.0"

  - id: "Q100-61-SET-EMD"
    name: "Electric Motor Drive Set"
    description: "Engineering drawings for electric motor drive system components"
    ata_sections:
      - "61-30"
    subsystems:
      - "Electric motor"
      - "Motor controller"
      - "Power electronics"
      - "Cooling system"
    location: "./Q100-61-SET-EMD/"
    status: "Active"
    revision: "1.0"

  - id: "Q100-61-SET-PV"
    name: "Propeller Variants Set"
    description: "Engineering drawings for propeller blade variants and configurations"
    ata_sections:
      - "61-40"
    subsystems:
      - "Blade variants"
      - "Material specifications"
      - "Performance configurations"
    location: "./Q100-61-SET-PV/"
    status: "Active"
    revision: "1.0"

  - id: "Q100-61-SET-MNT"
    name: "Mounting System Set"
    description: "Engineering drawings for propulsor mounting and structural integration"
    ata_sections:
      - "61-50"
    subsystems:
      - "Engine mounts"
      - "Pylon structure"
      - "Vibration isolation"
      - "Structural attachments"
    location: "./Q100-61-SET-MNT/"
    status: "Active"
    revision: "1.0"

  - id: "Q100-61-SET-FPS"
    name: "Full Propulsor System Set"
    description: "System-level drawings for complete propulsor assembly and integration"
    ata_sections:
      - "61-00"
      - "61-60"
    subsystems:
      - "System integration"
      - "Interface control"
      - "Assembly drawings"
      - "System schematics"
    location: "./Q100-61-SET-FPS/"
    status: "Active"
    revision: "1.0"

# Naming Convention Reference
naming_convention:
  pattern: "Q100-61-[TYPE]-[SYSTEM]-[COMPONENT].[ext]"
  types:
    DRW: "Engineering Drawing"
    SCH: "Schematic"
    ICD: "Interface Control Drawing"
    INST: "Installation Drawing"
    DIAG: "Diagram"
  systems:
    OFP: "Open Fan Propulsor"
    EMD: "Electric Motor Drive"
    PV: "Propeller Variants"
    MNT: "Mounting System"
    FPS: "Full Propulsor System"

# Program Context
program_context:
  aircraft: "AMPEL360-BWB-H2-Hy-E"
  propulsion_type: "Hybrid H₂ PEM fuel-cells with open-fan propulsors"
  energy_storage: "Closed-loop CO₂ battery for peak-power buffering"
  fuel_compatibility: "SAF compatible"
