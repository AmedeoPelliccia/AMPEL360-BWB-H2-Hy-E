  Q100-61-SYM-GDT — Geometric Dimensioning and Tolerancing Symbol Library
  Reference: ASME Y14.5 / ISO 1101
-->
<svg xmlns="http://www.w3.org/2000/svg"
     xmlns:xlink="http://www.w3.org/1999/xlink"
     width="200mm"
     height="150mm"
     viewBox="0 0 200 150">
  
  <title>Q100-61-SYM-GDT — GD&amp;T Symbol Library</title>
  <desc>Geometric Dimensioning and Tolerancing symbols for ATA 61 drawings</desc>
  
  <defs>
    <style>
      .symbol { stroke: #000000; stroke-width: 0.35; fill: none; }
      .filled { stroke: #000000; stroke-width: 0.35; fill: #000000; }
      .text { font-family: Arial, sans-serif; font-size: 3; fill: #000000; }
      .gdt-text { font-family: Arial, sans-serif; font-size: 4; fill: #000000; }
    </style>
    
    <!-- Position Symbol -->
    <symbol id="gdt-position" viewBox="0 0 12 12">
      <circle cx="6" cy="6" r="5" class="symbol"/>
      <line x1="6" y1="1" x2="6" y2="11" class="symbol"/>
      <line x1="1" y1="6" x2="11" y2="6" class="symbol"/>
    </symbol>
    
    <!-- Flatness Symbol -->
    <symbol id="gdt-flatness" viewBox="0 0 12 8">
      <polygon points="0,4 12,4 9,0 3,0" class="symbol"/>
    </symbol>
    
    <!-- Cylindricity Symbol -->
    <symbol id="gdt-cylindricity" viewBox="0 0 12 12">
      <circle cx="6" cy="6" r="5" class="symbol"/>
      <circle cx="6" cy="6" r="3" class="symbol"/>
    </symbol>
    
    <!-- Perpendicularity Symbol -->
    <symbol id="gdt-perpendicularity" viewBox="0 0 12 12">
      <line x1="2" y1="10" x2="10" y2="10" class="symbol"/>
      <line x1="6" y1="10" x2="6" y2="2" class="symbol"/>
    </symbol>
    
    <!-- Parallelism Symbol -->
    <symbol id="gdt-parallelism" viewBox="0 0 12 12">
      <line x1="2" y1="4" x2="10" y2="4" class="symbol"/>
      <line x1="2" y1="8" x2="10" y2="8" class="symbol"/>
    </symbol>
    
    <!-- Runout Symbol -->
    <symbol id="gdt-runout" viewBox="0 0 12 12">
      <line x1="2" y1="10" x2="6" y2="2" class="symbol"/>
      <line x1="6" y1="2" x2="10" y2="10" class="symbol"/>
    </symbol>
    
    <!-- Total Runout Symbol -->
    <symbol id="gdt-total-runout" viewBox="0 0 12 12">
      <line x1="2" y1="10" x2="6" y2="2" class="symbol"/>
      <line x1="6" y1="2" x2="10" y2="10" class="symbol"/>
      <line x1="3" y1="10" x2="6" y2="4" class="symbol"/>
      <line x1="6" y1="4" x2="9" y2="10" class="symbol"/>
    </symbol>
    
    <!-- Diameter Symbol -->
    <symbol id="gdt-diameter" viewBox="0 0 12 12">
      <circle cx="6" cy="6" r="5" class="symbol"/>
      <line x1="1" y1="11" x2="11" y2="1" class="symbol"/>
    </symbol>
    
    <!-- Feature Control Frame -->
    <symbol id="gdt-fcf" viewBox="0 0 48 12">
      <rect x="0" y="0" width="48" height="12" class="symbol"/>
      <line x1="12" y1="0" x2="12" y2="12" class="symbol"/>
      <line x1="30" y1="0" x2="30" y2="12" class="symbol"/>
    </symbol>
    
  </defs>
  
  <!-- Symbol Display Grid -->
  <text x="100" y="10" text-anchor="middle" class="text" style="font-size: 5; font-weight: bold;">
    GD&amp;T SYMBOLS — Q100-61-SYM-GDT
  </text>
  
  <g transform="translate(20,25)">
    <use xlink:href="#gdt-position" x="0" y="0" width="12" height="12"/>
    <text x="6" y="22" text-anchor="middle" class="text">Position</text>
  </g>
  
  <g transform="translate(50,27)">
    <use xlink:href="#gdt-flatness" x="0" y="0" width="12" height="8"/>
    <text x="6" y="20" text-anchor="middle" class="text">Flatness</text>
  </g>
  
  <g transform="translate(80,25)">
    <use xlink:href="#gdt-cylindricity" x="0" y="0" width="12" height="12"/>
    <text x="6" y="22" text-anchor="middle" class="text">Cylindricity</text>
  </g>
  
  <g transform="translate(120,25)">
    <use xlink:href="#gdt-perpendicularity" x="0" y="0" width="12" height="12"/>
    <text x="6" y="22" text-anchor="middle" class="text">Perpendicularity</text>
  </g>
  
  <g transform="translate(160,25)">
    <use xlink:href="#gdt-parallelism" x="0" y="0" width="12" height="12"/>
    <text x="6" y="22" text-anchor="middle" class="text">Parallelism</text>
  </g>
  
  <g transform="translate(20,60)">
    <use xlink:href="#gdt-runout" x="0" y="0" width="12" height="12"/>
    <text x="6" y="22" text-anchor="middle" class="text">Runout</text>
  </g>
  
  <g transform="translate(50,60)">
    <use xlink:href="#gdt-total-runout" x="0" y="0" width="12" height="12"/>
    <text x="6" y="22" text-anchor="middle" class="text">Total Runout</text>
  </g>
  
  <g transform="translate(100,60)">
    <use xlink:href="#gdt-diameter" x="0" y="0" width="12" height="12"/>
    <text x="6" y="22" text-anchor="middle" class="text">Diameter</text>
  </g>
  
  <g transform="translate(130,60)">
    <use xlink:href="#gdt-fcf" x="0" y="0" width="48" height="12"/>
    <text x="24" y="22" text-anchor="middle" class="text">Feature Control Frame</text>
  </g>
  
</svg>
