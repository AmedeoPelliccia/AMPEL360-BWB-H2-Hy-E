  Q100-61-TPL-A4-PORTRAIT — A4 Portrait Drawing Template
  Size: 210mm x 297mm
-->
<svg xmlns="http://www.w3.org/2000/svg"
     xmlns:xlink="http://www.w3.org/1999/xlink"
     width="210mm"
     height="297mm"
     viewBox="0 0 210 297">
  
  <title>Q100-61-TPL-A4-PORTRAIT — AMPEL360 Drawing Template</title>
  <desc>A4 Portrait drawing template for ATA 61 Propellers/Propulsors</desc>
  
  <defs>
    <style>
      .border { stroke: #000000; stroke-width: 0.7; fill: none; }
      .thin { stroke: #000000; stroke-width: 0.18; fill: none; }
      .text-title { font-family: Arial, Helvetica, sans-serif; font-size: 3.5; fill: #000000; }
      .text-normal { font-family: Arial, Helvetica, sans-serif; font-size: 2; fill: #000000; }
    </style>
  </defs>
  
  <!-- Drawing Border -->
  <rect x="20" y="10" width="180" height="277" class="border"/>
  
  <!-- Inner Border -->
  <rect x="25" y="15" width="170" height="267" class="thin"/>
  
  <!-- Title Block Area (bottom) -->
  <rect x="25" y="227" width="170" height="55" class="border"/>
  
  <!-- Title Block Content -->
  <g transform="translate(30,232)">
    <text x="0" y="8" class="text-title">AMPEL360-BWB-H2-Hy-E</text>
    <text x="0" y="16" class="text-normal">Q100 Program — ATA 61</text>
    <line x1="0" y1="20" x2="160" y2="20" class="thin"/>
    <text x="0" y="28" class="text-normal">TITLE:</text>
    <text x="0" y="36" class="text-normal">DWG NO:</text>
    <text x="0" y="44" class="text-normal">REV:</text>
    <text x="35" y="44" class="text-normal">SHEET:</text>
    <text x="80" y="44" class="text-normal">SCALE:</text>
    <text x="120" y="44" class="text-normal">DATE:</text>
  </g>
  
  <!-- Revision Block Area -->
  <rect x="25" y="187" width="170" height="35" class="border"/>
  <text x="30" y="197" class="text-normal">REVISION HISTORY</text>
  
  <!-- Zone Markers -->
  <g class="text-normal">
    <text x="8" y="60">A</text>
    <text x="8" y="120">B</text>
    <text x="8" y="180">C</text>
    
    <text x="60" y="293">1</text>
    <text x="120" y="293">2</text>
    <text x="175" y="293">3</text>
  </g>
  
  <!-- Template Placeholder Text -->
  <text x="105" y="100" text-anchor="middle" class="text-title" style="fill: #cccccc;">
    A4 PORTRAIT TEMPLATE
  </text>
  
</svg>
