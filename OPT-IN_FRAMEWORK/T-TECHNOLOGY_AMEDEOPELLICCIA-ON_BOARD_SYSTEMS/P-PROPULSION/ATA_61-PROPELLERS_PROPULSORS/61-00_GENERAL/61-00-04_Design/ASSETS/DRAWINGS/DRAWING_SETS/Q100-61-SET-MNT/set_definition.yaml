# Q100-61-SET-MNT — Mounting System Drawing Set Definition

set_id: "Q100-61-SET-MNT"
name: "Mounting System Set"
version: "1.0"
status: "Active"
owner: "AMPEL360 Propulsion Engineering"
created: "2025-12-04"
last_updated: "2025-12-04"

# Scope Definition
scope:
  ata_sections:
    - "61-50"
  description: |
    Engineering drawings for propulsor mounting and structural
    integration including engine mounts, pylon, and vibration isolation.

# Subsystems covered by this set
subsystems:
  - id: "MNT-MOUNT"
    name: "Engine Mounts"
    description: "Primary and secondary engine mount assemblies"
    drawing_prefix: "Q100-61-DRW-MNT-MOUNT"

  - id: "MNT-PYLON"
    name: "Pylon Structure"
    description: "Pylon structural elements and fairings"
    drawing_prefix: "Q100-61-DRW-MNT-PYLON"

  - id: "MNT-VIB"
    name: "Vibration Isolation"
    description: "Vibration dampers and isolation mounts"
    drawing_prefix: "Q100-61-DRW-MNT-VIB"

  - id: "MNT-ATT"
    name: "Structural Attachments"
    description: "Attachment fittings and load transfer elements"
    drawing_prefix: "Q100-61-DRW-MNT-ATT"

  - id: "MNT-FAIR"
    name: "Fairings"
    description: "Aerodynamic fairings and covers"
    drawing_prefix: "Q100-61-DRW-MNT-FAIR"

# Drawing types applicable to this set
drawing_types:
  - DRW  # Engineering drawings
  - SCH  # Schematics
  - ICD  # Interface control drawings
  - INST # Installation drawings

# External interfaces
interfaces:
  - system: "Q100-61-SET-OFP"
    description: "Nacelle-to-pylon interface"
  - system: "Q100-61-SET-EMD"
    description: "Motor mounting interface"
  - system: "ATA 53"
    description: "Fuselage structural interface"
  - system: "ATA 57"
    description: "Wing structural interface"

# Requirements traceability
requirements:
  source_docs:
    - "61-00-03_Requirements/RQ-61-MNT-*.md"
  safety_items:
    - "FMEA-61-MNT-001"

# Revision history
revisions:
  - version: "1.0"
    date: "2025-12-04"
    author: "AMPEL360 Engineering"
    description: "Initial set definition"
