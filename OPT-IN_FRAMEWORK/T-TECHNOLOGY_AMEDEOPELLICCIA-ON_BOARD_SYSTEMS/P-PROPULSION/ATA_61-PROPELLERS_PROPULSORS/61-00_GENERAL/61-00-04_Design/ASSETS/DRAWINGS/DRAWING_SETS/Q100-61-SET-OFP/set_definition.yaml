# Q100-61-SET-OFP — Open Fan Propulsor Drawing Set Definition

set_id: "Q100-61-SET-OFP"
name: "Open Fan Propulsor Set"
version: "1.0"
status: "Active"
owner: "AMPEL360 Propulsion Engineering"
created: "2025-12-04"
last_updated: "2025-12-04"

# Scope Definition
scope:
  ata_sections:
    - "61-10"
    - "61-20"
  description: |
    Engineering drawings for open-fan propulsor blades, hub, nacelle,
    and pitch control mechanism components.

# Subsystems covered by this set
subsystems:
  - id: "OFP-BLADE"
    name: "Fan Blades"
    description: "Composite and metallic fan blade designs"
    drawing_prefix: "Q100-61-DRW-OFP-BLADE"

  - id: "OFP-HUB"
    name: "Hub Assembly"
    description: "Propeller hub and blade retention system"
    drawing_prefix: "Q100-61-DRW-OFP-HUB"

  - id: "OFP-NAC"
    name: "Nacelle Structure"
    description: "Nacelle, inlet, and cowling components"
    drawing_prefix: "Q100-61-DRW-OFP-NAC"

  - id: "OFP-PITCH"
    name: "Pitch Control"
    description: "Variable pitch mechanism and controls"
    drawing_prefix: "Q100-61-DRW-OFP-PITCH"

  - id: "OFP-DEICE"
    name: "De-icing System"
    description: "Blade and nacelle de-icing provisions"
    drawing_prefix: "Q100-61-DRW-OFP-DEICE"

# Drawing types applicable to this set
drawing_types:
  - DRW  # Engineering drawings
  - SCH  # Schematics
  - ICD  # Interface control drawings
  - INST # Installation drawings

# External interfaces
interfaces:
  - system: "Q100-61-SET-EMD"
    description: "Electric motor drive interface at hub"
  - system: "Q100-61-SET-MNT"
    description: "Nacelle-to-pylon mounting interface"
  - system: "ATA 24"
    description: "Electrical power for pitch control"
  - system: "ATA 30"
    description: "De-icing system interface"

# Requirements traceability
requirements:
  source_docs:
    - "61-00-03_Requirements/RQ-61-OFP-*.md"
  safety_items:
    - "FMEA-61-OFP-001"

# Revision history
revisions:
  - version: "1.0"
    date: "2025-12-04"
    author: "AMPEL360 Engineering"
    description: "Initial set definition"
