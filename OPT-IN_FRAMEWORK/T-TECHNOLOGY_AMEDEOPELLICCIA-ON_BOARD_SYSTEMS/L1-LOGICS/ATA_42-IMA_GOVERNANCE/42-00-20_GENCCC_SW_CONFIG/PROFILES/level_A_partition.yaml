# 42-00-20 Level A Partition Profile
# DO-178C Level A Configuration for Safety-Critical Partitions
# Applicable to: P-FCS, P-GNC, and similar DAL-A partitions

metadata:
  profile_name: "Level_A_Partition"
  version: "1.0"
  created: "2025-12-04"
  author: "AMPEL360 SW Team"
  description: "Configuration profile for DO-178C Level A partitions"
  do178c_level: "A"

# DO-178C Level A Objectives
do178c_objectives:
  planning:
    plan_for_software_aspects: true
    srs_plan: true
    sds_plan: true
    scmp_plan: true
    sqap_plan: true
    svp_plan: true
  development:
    high_level_requirements: true
    low_level_requirements: true
    software_architecture: true
    source_code: true
    executable_object_code: true
  verification:
    reviews_analyses:
      hlr_reviews: true
      llr_reviews: true
      architecture_reviews: true
      source_code_reviews: true
      integration_reviews: true
    testing:
      hlr_based_testing: true
      llr_based_testing: true
      software_integration_testing: true
      hardware_software_integration_testing: true
    structural_coverage:
      statement_coverage: true
      decision_coverage: true
      mc_dc_coverage: true
      data_coupling: true
      control_coupling: true
  configuration_management:
    identification: true
    change_control: true
    status_accounting: true
    archive_retrieval: true
    protection: true
    release: true
  quality_assurance:
    software_conformance_reviews: true
    sqa_audits: true
    sqa_records: true
    problem_reporting: true

# ARINC 653 Configuration
arinc653:
  partition_type: "System"
  scheduling:
    mode: "Fixed"
    period_ms: 10
    duration_ms: 5
    deadline_type: "Hard"
  health_monitoring:
    enabled: true
    error_levels:
      - "Module"
      - "Partition"
      - "Process"
    recovery_actions:
      module_level: "Reset"
      partition_level: "Restart"
      process_level: "Warm_Start"
  communication:
    queuing_ports: []
    sampling_ports: []
    blackboard_ports: []
  memory:
    partition_size_mb: 64
    stack_size_kb: 256
    heap_enabled: false

# CAST-32A Multi-core Configuration
cast32a:
  core_assignment:
    primary_core: 0
    secondary_cores: []
    migration_allowed: false
  interference_analysis:
    required: true
    channels:
      - channel_id: "IC-CACHE-L1"
        type: "Cache"
        mitigation: "Cache_Partitioning"
      - channel_id: "IC-CACHE-L2"
        type: "Cache"
        mitigation: "Cache_Coloring"
      - channel_id: "IC-MEMORY"
        type: "Memory_Bandwidth"
        mitigation: "Rate_Limiting"
      - channel_id: "IC-BUS"
        type: "Interconnect"
        mitigation: "TDM_Scheduling"
  timing_analysis:
    wcet_method: "Static_Analysis"
    wcet_margin_percent: 20
    jitter_budget_us: 50

# Verification Requirements
verification:
  static_analysis:
    required: true
    tools:
      - "Polyspace_Code_Prover"
      - "Astree"
    checks:
      - "Null_Pointer_Dereference"
      - "Buffer_Overflow"
      - "Uninitialized_Variables"
      - "Division_By_Zero"
      - "Arithmetic_Overflow"
      - "Dead_Code"
      - "Unreachable_Code"
  dynamic_testing:
    unit_testing:
      required: true
      coverage_target_percent: 100
    integration_testing:
      required: true
      coverage_target_percent: 100
    structural_coverage:
      statement_target_percent: 100
      decision_target_percent: 100
      mc_dc_target_percent: 100
  formal_methods:
    recommended: true
    tools:
      - "SPARK"
      - "Frama-C"
    scope: "Critical_Functions"

# Coding Standards
coding_standards:
  primary: "MISRA-C:2012"
  additional:
    - "CERT-C"
    - "DO-178C_Guidelines"
  deviations:
    allowed: true
    approval_required: true
    documentation_required: true

# AI Assistance Rules
ai_assistance:
  allowed: true
  restrictions:
    - "All AI-generated code must be 100% reviewed"
    - "All AI-generated code must pass static analysis"
    - "All AI-generated code must achieve full structural coverage"
    - "AI cannot generate safety-critical algorithms without formal review"
  verification_level: "Full"
  documentation_required: true

# Traceability Requirements
traceability:
  requirements_to_design: "Mandatory"
  design_to_code: "Mandatory"
  requirements_to_tests: "Mandatory"
  code_to_tests: "Mandatory"
  hazards_to_requirements: "Mandatory"
  gap_tolerance: 0

# Certification Evidence
certification_evidence:
  psac: true
  srs: true
  sds: true
  source_code_listing: true
  seci: true
  sas: true
  scmp: true
  sqap: true
  svp: true
  svcp: true
  problem_reports: true
  configuration_index: true

---
# END OF CONFIGURATION
