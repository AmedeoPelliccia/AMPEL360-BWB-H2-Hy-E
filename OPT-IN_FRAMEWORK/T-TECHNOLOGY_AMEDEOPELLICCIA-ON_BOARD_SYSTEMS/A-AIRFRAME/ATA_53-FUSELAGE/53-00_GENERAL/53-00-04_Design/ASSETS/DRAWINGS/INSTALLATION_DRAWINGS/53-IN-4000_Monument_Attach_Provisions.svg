<svg viewBox="0 0 1400 1000" xmlns="http://www.w3.org/2000/svg" style="background-color: #0a1628">
  <defs>
    <!-- Grid Pattern -->
    <pattern id="grid" width="25" height="25" patternUnits="userSpaceOnUse">
      <path d="M 25 0 L 0 0 0 25" fill="none" stroke="#1a3a5c" stroke-width="0.3"/>
    </pattern>
    
    <!-- Fine Grid -->
    <pattern id="fineGrid" width="125" height="125" patternUnits="userSpaceOnUse">
      <rect width="125" height="125" fill="url(#grid)"/>
      <path d="M 125 0 L 0 0 0 125" fill="none" stroke="#1e4a6e" stroke-width="0.5"/>
    </pattern>
    
    <!-- Insulation Hatch Pattern (Tank Reference) -->
    <pattern id="insulationHatch" patternUnits="userSpaceOnUse" width="8" height="8" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="8" stroke="#f72585" stroke-width="0.6" opacity="0.3"/>
    </pattern>

    <!-- Monument Zone Pattern (Galley) -->
    <pattern id="galleyPattern" patternUnits="userSpaceOnUse" width="10" height="10" patternTransform="rotate(45)">
       <line x1="0" y1="0" x2="10" y2="0" stroke="#ffd60a" stroke-width="0.5"/>
    </pattern>

    <!-- Monument Zone Pattern (Lavatory) -->
    <pattern id="lavPattern" patternUnits="userSpaceOnUse" width="10" height="10">
       <circle cx="5" cy="5" r="1" fill="#4361ee"/>
    </pattern>

     <!-- Monument Zone Pattern (Stowage/Closet) -->
    <pattern id="stowPattern" patternUnits="userSpaceOnUse" width="8" height="8" patternTransform="rotate(-45)">
       <line x1="0" y1="0" x2="8" y2="0" stroke="#06d6a0" stroke-width="0.5"/>
    </pattern>
    
    <!-- Attachment Symbols -->
    <!-- Type 1: Hardpoint (Floor/Seat Track) -->
    <symbol id="attachHardpoint" viewBox="-6 -6 12 12">
      <rect x="-4" y="-4" width="8" height="8" fill="#ffffff" stroke="#ffffff" stroke-width="1"/>
      <line x1="-6" y1="-6" x2="6" y2="6" stroke="#1a1a1a" stroke-width="1"/>
      <line x1="-6" y1="6" x2="6" y2="-6" stroke="#1a1a1a" stroke-width="1"/>
    </symbol>

    <!-- Type 2: Tie-Rod / Overhead -->
    <symbol id="attachTieRod" viewBox="-6 -6 12 12">
      <circle cx="0" cy="0" r="4" fill="none" stroke="#ffd60a" stroke-width="1.5"/>
      <circle cx="0" cy="0" r="1.5" fill="#ffd60a"/>
    </symbol>
    
    <!-- Type 3: Intercostal / Wall -->
    <symbol id="attachWall" viewBox="-6 -6 12 12">
      <polygon points="0,-5 5,4 -5,4" fill="none" stroke="#06d6a0" stroke-width="1.5"/>
    </symbol>

    <!-- Arrow Marker -->
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#88c0d0"/>
    </marker>
  </defs>
  
  <!-- Background Grid -->
  <rect width="1400" height="1000" fill="url(#fineGrid)"/>
  
  <!-- Main Drawing Area Border -->
  <rect x="20" y="60" width="1360" height="800" fill="none" stroke="#4cc9f0" stroke-width="1.5"/>
  
  <!-- Drawing Title -->
  <text x="700" y="35" text-anchor="middle" fill="#4cc9f0" font-family="Arial, sans-serif" font-size="22" font-weight="bold">
    ATA 53 – FUSELAGE ZONE 100 MONUMENT ATTACHMENT PROVISIONS
  </text>
  <text x="700" y="52" text-anchor="middle" fill="#88c0d0" font-family="Arial, sans-serif" font-size="12">
    BWB Forward Fuselage • Plan View • Galley, Lavatory & Crew Rest Interfaces
  </text>
  
  <!-- ========== BWB GEOMETRY ========== -->
  <path d="M 140,480 
           Q 95,480 115,400 
           C 160,310 240,230 400,175
           C 580,115 820,80 1100,65
           C 1220,58 1300,70 1330,100
           L 1350,480
           L 1330,860
           C 1300,890 1220,902 1100,895
           C 820,880 580,845 400,785
           C 240,730 160,650 115,560
           Q 95,480 140,480"
        fill="none" stroke="#4cc9f0" stroke-width="3"/>
        
  <!-- Wing Contours -->
  <path d="M 220,450 C 350,390 600,330 950,295" fill="none" stroke="#2a5a7a" stroke-width="0.8" stroke-dasharray="12,6"/>
  <path d="M 220,510 C 350,570 600,630 950,665" fill="none" stroke="#2a5a7a" stroke-width="0.8" stroke-dasharray="12,6"/>

  <!-- ========== FRAME STATIONS ========== -->
  <g stroke="#ffd60a" stroke-width="1.5" stroke-dasharray="10,5">
    <line x1="200" y1="340" x2="200" y2="620"/>
    <line x1="350" y1="250" x2="350" y2="710"/>
    <line x1="500" y1="200" x2="500" y2="760"/>
    <line x1="650" y1="160" x2="650" y2="800"/>
    <line x1="800" y1="130" x2="800" y2="830"/>
    <line x1="950" y1="110" x2="950" y2="850"/>
    <line x1="1100" y1="95" x2="1100" y2="865"/>
  </g>

  <g fill="#ffd60a" font-family="monospace" font-size="11" font-weight="bold" text-anchor="middle">
    <text x="200" y="330">FS 0</text>
    <text x="350" y="240">FS 150</text>
    <text x="500" y="190">FS 300</text>
    <text x="650" y="150">FS 450</text>
    <text x="800" y="120">FS 600</text>
    <text x="950" y="100">FS 750</text>
    <text x="1100" y="85">FS 900</text>
  </g>

  <!-- ========== ZONES ========== -->

  <!-- Cockpit Zone -->
  <path d="M 140,480 Q 115,480 130,420 C 160,360 200,310 260,280 
           L 310,280 L 330,330 L 330,630 L 310,680 L 260,680 
           C 200,650 160,600 130,540 Q 115,480 140,480"
        fill="#7209b7" fill-opacity="0.25" stroke="#7209b7" stroke-width="2"/>
  <text x="220" y="485" text-anchor="middle" fill="#d4a5ff" font-family="monospace" font-size="12" font-weight="bold">COCKPIT</text>

  <!-- H2 Tank Reference -->
  <rect x="480" y="380" width="620" height="200" rx="100" ry="100" 
        fill="url(#insulationHatch)" stroke="#f72585" stroke-width="2" stroke-dasharray="18,6"/>
  <text x="790" y="475" text-anchor="middle" fill="#f72585" font-family="Arial" font-size="14" font-weight="bold">CRYOGENIC LH₂ TANK ZONE</text>
  <text x="790" y="495" text-anchor="middle" fill="#ffb3d9" font-family="monospace" font-size="10">NO MONUMENT ATTACHMENT PERMITTED</text>

  <!-- Bifurcation Walls -->
  <line x1="350" y1="365" x2="1100" y2="360" stroke="#ff6b35" stroke-width="3"/>
  <line x1="350" y1="595" x2="1100" y2="600" stroke="#ff6b35" stroke-width="3"/>

  <!-- ========== MONUMENTS & ATTACHMENTS - PORT SIDE ========== -->

  <!-- G1: Fwd Port Galley (FS 350-450) -->
  <rect x="650" y="200" width="120" height="150" fill="url(#galleyPattern)" stroke="#ffd60a" stroke-width="1.5"/>
  <text x="710" y="275" text-anchor="middle" fill="#ffd60a" font-family="Arial" font-size="10" font-weight="bold" transform="rotate(-90, 710, 275)">G1 - FWD GALLEY</text>
  
  <!-- Attachments for G1 -->
  <!-- Floor Hardpoints -->
  <use href="#attachHardpoint" x="660" y="210"/> <text x="670" y="215" fill="#ffffff" font-size="8">FP1</text>
  <use href="#attachHardpoint" x="760" y="210"/> <text x="770" y="215" fill="#ffffff" font-size="8">FP2</text>
  <use href="#attachHardpoint" x="660" y="340"/> <text x="670" y="345" fill="#ffffff" font-size="8">FP3</text>
  <use href="#attachHardpoint" x="760" y="340"/> <text x="770" y="345" fill="#ffffff" font-size="8">FP4</text>
  <!-- Overhead Tie-Rods -->
  <use href="#attachTieRod" x="660" y="275"/>
  <use href="#attachTieRod" x="760" y="275"/>
  
  <!-- L1: Fwd Port Lavatory (FS 500-550) -->
  <rect x="800" y="180" width="90" height="90" fill="url(#lavPattern)" stroke="#4361ee" stroke-width="1.5" opacity="0.6"/>
  <text x="845" y="225" text-anchor="middle" fill="#4361ee" font-family="Arial" font-size="10" font-weight="bold">L1</text>

  <!-- Attachments for L1 -->
  <use href="#attachHardpoint" x="810" y="190"/>
  <use href="#attachHardpoint" x="880" y="190"/>
  <use href="#attachHardpoint" x="810" y="260"/>
  <use href="#attachHardpoint" x="880" y="260"/>
  <use href="#attachWall" x="845" y="180"/> <!-- Wall attachment -->

  <!-- S1: Fwd Port Stowage/Closet (FS 200-250) -->
  <rect x="400" y="260" width="50" height="90" fill="url(#stowPattern)" stroke="#06d6a0" stroke-width="1.5"/>
  <text x="425" y="305" text-anchor="middle" fill="#06d6a0" font-family="Arial" font-size="9" font-weight="bold" transform="rotate(-90, 425, 305)">S1</text>
   <!-- Attachments for S1 -->
  <use href="#attachHardpoint" x="410" y="270"/>
  <use href="#attachHardpoint" x="440" y="270"/>
  <use href="#attachHardpoint" x="410" y="340"/>
  <use href="#attachHardpoint" x="440" y="340"/>


  <!-- ========== MONUMENTS & ATTACHMENTS - STARBOARD SIDE ========== -->

  <!-- G2: Fwd Stbd Galley (FS 350-450) -->
  <rect x="650" y="610" width="120" height="150" fill="url(#galleyPattern)" stroke="#ffd60a" stroke-width="1.5"/>
  <text x="710" y="685" text-anchor="middle" fill="#ffd60a" font-family="Arial" font-size="10" font-weight="bold" transform="rotate(-90, 710, 685)">G2 - FWD GALLEY</text>

  <!-- Attachments for G2 -->
  <use href="#attachHardpoint" x="660" y="620"/> <text x="670" y="625" fill="#ffffff" font-size="8">FP5</text>
  <use href="#attachHardpoint" x="760" y="620"/> <text x="770" y="625" fill="#ffffff" font-size="8">FP6</text>
  <use href="#attachHardpoint" x="660" y="750"/> <text x="670" y="755" fill="#ffffff" font-size="8">FP7</text>
  <use href="#attachHardpoint" x="760" y="750"/> <text x="770" y="755" fill="#ffffff" font-size="8">FP8</text>
  <use href="#attachTieRod" x="660" y="685"/>
  <use href="#attachTieRod" x="760" y="685"/>

  <!-- L2: Fwd Stbd Lavatory (FS 500-550) -->
  <rect x="800" y="690" width="90" height="90" fill="url(#lavPattern)" stroke="#4361ee" stroke-width="1.5" opacity="0.6"/>
  <text x="845" y="735" text-anchor="middle" fill="#4361ee" font-family="Arial" font-size="10" font-weight="bold">L2</text>

  <!-- Attachments for L2 -->
  <use href="#attachHardpoint" x="810" y="700"/>
  <use href="#attachHardpoint" x="880" y="700"/>
  <use href="#attachHardpoint" x="810" y="770"/>
  <use href="#attachHardpoint" x="880" y="770"/>
  <use href="#attachWall" x="845" y="780"/> <!-- Wall attachment -->

  <!-- CR1: Crew Rest (FS 950-1050) - Center/Aft -->
  <!-- Note: Moving slightly aft for Crew Rest typical placement in BWB blends -->
  <rect x="1150" y="420" width="120" height="120" fill="#06d6a0" fill-opacity="0.2" stroke="#06d6a0" stroke-width="1.5" stroke-dasharray="4,2"/>
  <text x="1210" y="480" text-anchor="middle" fill="#06d6a0" font-family="Arial" font-size="10" font-weight="bold">CR1</text>
  <text x="1210" y="495" text-anchor="middle" fill="#06d6a0" font-family="monospace" font-size="8">CREW REST (OPT)</text>
  
  <!-- CENTERLINE -->
  <line x1="100" y1="480" x2="1350" y2="480" stroke="#88c0d0" stroke-width="1" stroke-dasharray="20,6,4,6"/>
  <text x="1365" y="483" fill="#88c0d0" font-family="monospace" font-size="10">℄</text>
  
  <!-- ========== LEGEND BOX ========== -->
  <rect x="20" y="875" width="500" height="110" fill="#0d1f38" stroke="#4cc9f0" stroke-width="1"/>
  <text x="35" y="895" fill="#4cc9f0" font-family="Arial" font-size="12" font-weight="bold">LEGEND – ATTACHMENT TYPES</text>
  <line x1="20" y1="903" x2="520" y2="903" stroke="#4cc9f0" stroke-width="0.5"/>
  
  <!-- Legend Items -->
  <use href="#attachHardpoint" x="45" y="925" width="16" height="16"/>
  <text x="70" y="930" fill="white" font-family="monospace" font-size="9">FLOOR HARDPOINT (TYPE 1)</text>
  <text x="280" y="930" fill="#88c0d0" font-family="monospace" font-size="8">Seat Track / Beam Mtd.</text>

  <use href="#attachTieRod" x="45" y="950" width="16" height="16"/>
  <text x="70" y="955" fill="white" font-family="monospace" font-size="9">OVERHEAD TIE-ROD (TYPE 2)</text>
  <text x="280" y="955" fill="#88c0d0" font-family="monospace" font-size="8">Upper Shell Frame Mtd.</text>

  <use href="#attachWall" x="45" y="975" width="16" height="16"/>
  <text x="70" y="980" fill="white" font-family="monospace" font-size="9">WALL/INTERCOSTAL (TYPE 3)</text>
  <text x="280" y="980" fill="#88c0d0" font-family="monospace" font-size="8">Stabilizing Bracket</text>

  <!-- ========== MONUMENT LEGEND BOX ========== -->
  <rect x="530" y="875" width="280" height="110" fill="#0d1f38" stroke="#4cc9f0" stroke-width="1"/>
  <text x="545" y="895" fill="#4cc9f0" font-family="Arial" font-size="12" font-weight="bold">MONUMENT ZONES</text>
  <line x1="530" y1="903" x2="810" y2="903" stroke="#4cc9f0" stroke-width="0.5"/>
  
  <rect x="545" y="915" width="15" height="15" fill="url(#galleyPattern)" stroke="#ffd60a"/>
  <text x="570" y="927" fill="white" font-family="monospace" font-size="9">GALLEY (G)</text>

  <rect x="545" y="940" width="15" height="15" fill="url(#lavPattern)" stroke="#4361ee"/>
  <text x="570" y="952" fill="white" font-family="monospace" font-size="9">LAVATORY (L)</text>

  <rect x="545" y="965" width="15" height="15" fill="url(#stowPattern)" stroke="#06d6a0"/>
  <text x="570" y="977" fill="white" font-family="monospace" font-size="9">STOWAGE (S)</text>
  
  <!-- ========== TITLE BLOCK ========== -->
  <rect x="1080" y="875" width="300" height="110" fill="#0d1f38" stroke="#4cc9f0" stroke-width="1.5"/>
  
  <!-- Title Block Grid -->
  <line x1="1080" y1="905" x2="1380" y2="905" stroke="#4cc9f0" stroke-width="0.5"/>
  <line x1="1080" y1="930" x2="1380" y2="930" stroke="#4cc9f0" stroke-width="0.5"/>
  <line x1="1080" y1="955" x2="1380" y2="955" stroke="#4cc9f0" stroke-width="0.5"/>
  <line x1="1200" y1="930" x2="1200" y2="985" stroke="#4cc9f0" stroke-width="0.5"/>
  <line x1="1280" y1="955" x2="1280" y2="985" stroke="#4cc9f0" stroke-width="0.5"/>
  
  <!-- Title Block Content -->
  <text x="1090" y="898" fill="#4cc9f0" font-family="monospace" font-size="9">GAIA AIR – AMPEL360 BWB AIRCRAFT</text>
  <text x="1280" y="898" fill="#88c0d0" font-family="monospace" font-size="8">PLAN VIEW</text>
  
  <text x="1090" y="922" fill="white" font-family="monospace" font-size="8">TITLE: ZONE 100 MONUMENT PROVISIONS</text>
  
  <text x="1090" y="948" fill="white" font-family="monospace" font-size="8">DWG NO:</text>
  <text x="1150" y="948" fill="#ffd60a" font-family="monospace" font-size="11" font-weight="bold">53-IN-4000</text>
  
  <text x="1090" y="972" fill="white" font-family="monospace" font-size="8">SCALE:</text>
  <text x="1130" y="972" fill="white" font-family="monospace" font-size="9">1:50</text>
  <text x="1210" y="972" fill="white" font-family="monospace" font-size="8">REV:</text>
  <text x="1240" y="972" fill="#06d6a0" font-family="monospace" font-size="10" font-weight="bold">A</text>
  <text x="1290" y="972" fill="white" font-family="monospace" font-size="8">DATE:</text>
  <text x="1330" y="972" fill="white" font-family="monospace" font-size="9">2025-11-25</text>
  
  <text x="1090" y="982" fill="#88c0d0" font-family="monospace" font-size="7">SHEET 1 OF 1</text>
  
  <!-- Scale Bar -->
  <g transform="translate(1150, 820)">
    <text x="60" y="-5" text-anchor="middle" fill="#4cc9f0" font-family="monospace" font-size="9">SCALE 1:50 (METERS)</text>
    <rect x="0" y="5" width="30" height="8" fill="white"/>
    <rect x="30" y="5" width="30" height="8" fill="#0a1628" stroke="white" stroke-width="0.5"/>
    <rect x="60" y="5" width="30" height="8" fill="white"/>
    <rect x="90" y="5" width="30" height="8" fill="#0a1628" stroke="white" stroke-width="0.5"/>
    <text x="0" y="25" text-anchor="middle" fill="white" font-family="monospace" font-size="7">0</text>
    <text x="30" y="25" text-anchor="middle" fill="white" font-family="monospace" font-size="7">1.5</text>
    <text x="60" y="25" text-anchor="middle" fill="white" font-family="monospace" font-size="7">3</text>
    <text x="90" y="25" text-anchor="middle" fill="white" font-family="monospace" font-size="7">4.5</text>
    <text x="120" y="25" text-anchor="middle" fill="white" font-family="monospace" font-size="7">6m</text>
  </g>
  
  <!-- Directional Indicator -->
  <g transform="translate(1300, 780)">
    <circle cx="0" cy="0" r="40" fill="none" stroke="#4cc9f0" stroke-width="1"/>
    <polygon points="0,-35 5,-20 -5,-20" fill="#4cc9f0"/>
    <text x="0" y="-42" text-anchor="middle" fill="#4cc9f0" font-family="Arial" font-size="12" font-weight="bold">FWD</text>
    <text x="0" y="8" text-anchor="middle" fill="#88c0d0" font-family="monospace" font-size="7">LOOKING</text>
    <text x="0" y="18" text-anchor="middle" fill="#88c0d0" font-family="monospace" font-size="7">DOWN</text>
  </g>

</svg>
