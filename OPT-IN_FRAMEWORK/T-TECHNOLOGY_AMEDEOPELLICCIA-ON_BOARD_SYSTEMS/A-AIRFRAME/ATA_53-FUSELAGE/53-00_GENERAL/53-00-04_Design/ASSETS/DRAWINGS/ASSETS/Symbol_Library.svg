<?xml version="1.0" encoding="UTF-8"?>
<!-- AMPEL360 Model: Q100 - Standard Symbol Library for ATA 53 Drawings -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <style>
      .label { font-family: Arial, sans-serif; font-size: 12px; fill: #000; }
    </style>
  </defs>
  
  <text x="400" y="30" class="label" text-anchor="middle" font-size="18px" font-weight="bold">AMPEL360 Q100 Standard Symbol Library</text>
  
  <!-- Fastener Symbols -->
  <g id="fasteners" transform="translate(50,60)">
    <text x="0" y="0" class="label" font-weight="bold">Fasteners:</text>
    <circle cx="20" cy="30" r="5" fill="none" stroke="#000" stroke-width="1"/>
    <text x="40" y="35" class="label">Rivet</text>
    
    <circle cx="20" cy="60" r="5" fill="#000"/>
    <text x="40" y="65" class="label">Hi-Lok</text>
    
    <circle cx="20" cy="90" r="5" fill="none" stroke="#000" stroke-width="1"/>
    <line x1="15" y1="90" x2="25" y2="90" stroke="#000" stroke-width="1"/>
    <line x1="20" y1="85" x2="20" y2="95" stroke="#000" stroke-width="1"/>
    <text x="40" y="95" class="label">Bolt</text>
  </g>
  
  <!-- Weld Symbols -->
  <g id="welds" transform="translate(300,60)">
    <text x="0" y="0" class="label" font-weight="bold">Welds:</text>
    <path d="M 10 30 L 30 30 M 20 25 L 20 35" stroke="#000" fill="none" stroke-width="2"/>
    <text x="40" y="35" class="label">Fillet Weld</text>
    
    <rect x="15" y="55" width="10" height="10" fill="#000"/>
    <text x="40" y="65" class="label">Square Groove</text>
    
    <path d="M 15 90 L 25 85 L 25 95 Z" fill="#000"/>
    <text x="40" y="95" class="label">V-Groove</text>
  </g>
  
  <!-- Surface Finish -->
  <g id="surface" transform="translate(550,60)">
    <text x="0" y="0" class="label" font-weight="bold">Surface:</text>
    <path d="M 10 30 L 30 30 L 30 40 L 20 35 L 10 40 Z" fill="none" stroke="#000" stroke-width="1"/>
    <text x="40" y="35" class="label">Ra 3.2</text>
    
    <path d="M 10 60 L 30 60 L 30 70 L 20 65 L 10 70 Z" fill="none" stroke="#000" stroke-width="1"/>
    <path d="M 10 60 L 30 60 L 30 70 L 20 65 L 10 70 Z" fill="#e0e0e0" stroke="#000" stroke-width="1"/>
    <text x="40" y="65" class="label">Ra 1.6</text>
  </g>
  
  <!-- Datum Symbols -->
  <g id="datums" transform="translate(50,220)">
    <text x="0" y="0" class="label" font-weight="bold">Datums:</text>
    <path d="M 20 25 L 20 35 M 15 35 L 25 35" stroke="#000" stroke-width="2"/>
    <rect x="15" y="40" width="10" height="10" fill="none" stroke="#000" stroke-width="1"/>
    <text x="20" y="47" class="label" text-anchor="middle" font-size="10px">A</text>
    <text x="40" y="45" class="label">Datum A</text>
  </g>
  
  <!-- GD&T Symbols -->
  <g id="gdt" transform="translate(300,220)">
    <text x="0" y="0" class="label" font-weight="bold">GD&T Symbols:</text>
    <circle cx="20" cy="30" r="8" fill="none" stroke="#000" stroke-width="1"/>
    <text x="40" y="35" class="label">Concentricity</text>
    
    <path d="M 12 60 L 28 60 M 20 52 L 20 68" stroke="#000" stroke-width="1"/>
    <text x="40" y="65" class="label">Position</text>
    
    <path d="M 12 90 L 28 90 M 12 90 L 12 98 M 28 90 L 28 98" stroke="#000" stroke-width="1"/>
    <text x="40" y="95" class="label">Parallelism</text>
  </g>
</svg>