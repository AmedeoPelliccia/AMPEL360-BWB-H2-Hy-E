notes: |
  This is a template file. When creating a new drawing:
  1. Copy this template to the appropriate subfolder (GA, DETAIL, INTERFACE, INSTALLATION, or SECTION)
  2. Rename the file following the pattern: 54-00-04-Dnnn_DRWG_ShortName.yaml
  3. Update all placeholder values with actual drawing information
  4. Update traceability links to reference actual assemblies and requirements
  5. Set status to "Planned", "In Progress", "Review", or "Approved" as appropriate
  6. Add the drawing to the 00_INDEX.md register
  7. Update ASSETS/INDEX.meta.yaml with the new drawing entry
