# Additional Notes
notes: |
  Hi-Lok HL11 is a standard aerospace structural fastener used throughout
  nacelle and pylon assemblies. The HL11 series has a 1/4 inch (6.35mm) diameter
  and is suitable for both tension and shear applications.
  
  Usage considerations:
  - Widely used in composite-to-metal and metal-to-metal joints
  - Self-locking collar eliminates need for separate locknut
  - Break-off collar provides consistent installation torque
  - Available in various grip lengths to suit material thickness
  - Corrosion protection coating must be appropriate for application
  - Installation requires specific Hi-Lok installation tooling
  - Material selection (steel vs titanium) depends on application
  - Large quantities used per nacelle/pylon assembly (hundreds to thousands)
  
  Standard part number format: HL11-X-Y
  - X = Grip length code
  - Y = Material/finish code
