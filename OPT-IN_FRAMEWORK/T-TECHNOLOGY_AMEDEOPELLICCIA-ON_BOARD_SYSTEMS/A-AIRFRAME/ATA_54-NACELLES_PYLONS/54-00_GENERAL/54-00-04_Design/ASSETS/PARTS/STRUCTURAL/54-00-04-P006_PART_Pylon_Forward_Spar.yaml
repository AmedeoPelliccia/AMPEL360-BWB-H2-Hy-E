# Certification
certification:
  critical_part: true
  cert_basis: "CS-25.571, CS-25.613"
  special_conditions:
    - "Static and fatigue testing per AC 20-107B"
    - "Ultimate load test to 150% limit load"
    - "Lightning strike test required"

# Additional Notes
notes: |
  The pylon forward spar is the primary structural member carrying loads between
  the wing and nacelle/engine. It forms the front load path of the pylon and must
  withstand all flight and ground loads including engine thrust, weight, and
  emergency landing scenarios.
  
  Critical design considerations:
  - Optimized composite layup for multi-directional loading
  - Co-bonded fittings eliminate mechanical fastener stress concentrations
  - Lightning strike protection critical for safety
  - Integration with wing primary structure is safety-critical
  - Fuel system routing must not compromise structural integrity
