# Certification
certification:
  critical_part: true
  cert_basis: "CS-25.571, CS-36 (noise)"
  special_conditions:
    - "Acoustic certification testing required"
    - "Fire resistance per CS-25.1191"

# Additional Notes
notes: |
  The fan cowl forward panel provides aerodynamic fairing and acoustic treatment
  for the fan section of the engine. It includes provisions for maintenance access
  and must meet stringent noise reduction requirements.
  
  Key design features:
  - Acoustic panels with honeycomb core optimize noise reduction
  - Hinged inspection doors allow engine access without cowl removal
  - Quick-release latches enable rapid cowl opening for maintenance
  - Composite construction reduces weight while maintaining strength
