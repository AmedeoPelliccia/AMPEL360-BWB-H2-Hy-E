  operating_temp_max_c: 130
  humidity_max_percent: 100
  salt_fog_resistance: "Per ASTM B117, 1000 hours minimum"

# Design Features
design_features:
  - "C-channel cross-section for torsion resistance"
  - "Co-bonded titanium inserts at high-load interfaces"
  - "Lightning strike protection layer"
