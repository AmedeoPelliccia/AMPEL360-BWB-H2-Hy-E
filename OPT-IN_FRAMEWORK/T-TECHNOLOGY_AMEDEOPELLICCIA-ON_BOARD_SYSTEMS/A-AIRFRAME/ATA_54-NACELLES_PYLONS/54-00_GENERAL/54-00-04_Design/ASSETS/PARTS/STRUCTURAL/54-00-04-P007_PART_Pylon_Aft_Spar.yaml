  minimum_order_quantity: 1

# Certification
certification:
  critical_part: true
  cert_basis: "CS-25.571, CS-25.613"
  special_conditions:
    - "Static and fatigue testing per AC 20-107B"
    - "Ultimate load test to 150% limit load"
    - "Lightning strike test required"

# Additional Notes
notes: |
  The pylon aft spar works in conjunction with the forward spar to form the
  primary structural load path of the pylon. It carries loads from the aft
  engine mount point to the wing rear spar, and provides torsional stiffness
  to the pylon structure.
  
  Key design features:
  - Optimized for combined bending and torsion loads
  - Co-bonded inserts reduce stress concentrations
  - Lightning strike protection integrated into layup
  - Lighter than forward spar due to reduced bending moment
  - Systems integration provisions minimize interference
