# 54-00-04-P000 — Part Definition Template
# This file serves as a template for creating new part definitions in ATA 54

# Part Identification
id: "54-00-04-P000"
title: "Part Title Template"
category: "PART"
part_type: "Structural|Fitting|Movable|Secondary|Hardware"
ata_chapter: "54"
description: "Description of the part and its function"
status: "Draft"
version: "0.1.0"
owner: "Responsible discipline (e.g., Nacelle Structures, Pylon Structures)"
last_updated: "2026-01-02"

# Traceability Links
traceability:
  parent_assembly:
    id: "54-00-04-A00X"
    title: "Parent Assembly Title"
  requirements:
    - id: "54-00-03-01-00X"
      title: "Requirement Title"
  drawings:
    - id: "54-00-04-D00X"
      title: "Drawing Title"

# Material Specifications
material:
  primary: "Material name (e.g., CFRP-Epoxy, Ti-6Al-4V)"
  specification: "Specification reference (e.g., AMS 4911, ASTM D5528)"
  alternative_materials:
    - "Alternative material 1 (if applicable)"

# Physical Dimensions
dimensions:
  length_mm: TBD
  width_mm: TBD
  thickness_mm: TBD
  weight_kg: TBD
  tolerance: "TBD (e.g., ±0.5mm, ±0.05kg)"

# Manufacturing Information
manufacturing:
  process: "Manufacturing process (e.g., Autoclave cure, CNC machining, Casting)"
  tooling: "Required tooling (e.g., Mold ASM-54-T-001)"
  cycle_time_hours: TBD
  inspection_requirements:
    - "Inspection requirement 1 (e.g., Dimensional inspection per drawing)"
    - "Inspection requirement 2 (e.g., NDT - Ultrasonic C-scan 100% coverage)"

# Mechanical Properties
mechanical_properties:
  tensile_strength_mpa: TBD
  compressive_strength_mpa: TBD
  elastic_modulus_gpa: TBD
  yield_strength_mpa: TBD
  ultimate_strength_mpa: TBD

# Environmental Limits
environmental_limits:
  operating_temp_min_c: -55
  operating_temp_max_c: TBD
  humidity_max_percent: 100
  salt_fog_resistance: "Per ASTM B117 (if applicable)"

# Design Features
design_features:
  - "Feature 1 (e.g., Integral flanges for attachment)"
  - "Feature 2 (e.g., Lightning strike protection provisions)"
  - "Feature 3 (e.g., Anti-icing channels)"

# Interfaces
interfaces:
  - interface_id: "IF-P000-XXX"
    description: "Interface description (e.g., Bolt pattern to frame)"
    fastener_type: "Fastener type (e.g., Hi-Lok HL11, Titanium M8 bolt)"
    quantity: TBD

# Maintenance Information
maintenance:
  inspection_interval_fh: TBD
  inspection_method: "Inspection method (e.g., Visual inspection, Eddy current)"
  special_maintenance_requirements:
    - "Requirement 1 (if applicable)"

# Supply Chain
supply_chain:
  manufacturer: "TBD"
  supplier_part_number: "TBD"
  lead_time_weeks: TBD
  minimum_order_quantity: TBD

# Certification
certification:
  critical_part: false
  cert_basis: "CS-25 / FAA Part 25 (if critical)"
  special_conditions: []

# Additional Notes
notes: |
  Additional notes, design considerations, or special instructions for this part.
  Include any relevant information that doesn't fit in the structured fields above.
