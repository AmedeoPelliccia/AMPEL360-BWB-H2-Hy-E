title: "Pylon Wing Attachment Fitting"
category: "PART"
part_type: "Fitting"
ata_chapter: "54"
description: "High-strength fitting connecting pylon structure to wing primary structure"
status: "Draft"
version: "0.1.0"
owner: "Pylon Structures"
last_updated: "2026-01-02"

