# Manufacturing Information
manufacturing:
  process: "Investment casting with CNC finish machining, heat treatment to H1025"
  tooling: "Wax pattern tool, 5-axis CNC mill, heat treatment furnace"
  cycle_time_hours: 36
  inspection_requirements:
    - "100% dimensional inspection per drawing 54-00-04-D004"
    - "NDT - Magnetic particle inspection 100% coverage"
    - "Hardness verification (minimum HRC 38)"
    - "Load test to 150% design ultimate load"

# Mechanical Properties
mechanical_properties:
  tensile_strength_mpa: 1310
  compressive_strength_mpa: 1250
  elastic_modulus_gpa: 197
  yield_strength_mpa: 1170
  ultimate_strength_mpa: 1310

# Environmental Limits
environmental_limits:
  operating_temp_min_c: -55
  operating_temp_max_c: 150
  humidity_max_percent: 100
  salt_fog_resistance: "Per ASTM B117, 5000 hours minimum"

# Design Features
design_features:
  - "Lug-type fitting with double-shear pin joints"
  - "Fail-safe multi-load path design"
  - "Corrosion-resistant stainless steel construction"
  - "Precision bore for close-tolerance pins"
  - "Lightning strike bonding provisions"

# Interfaces
interfaces:
  - interface_id: "IF-P008-WING"
    description: "Wing rear spar attachment lugs"
    fastener_type: "Double-shear pin (40mm dia)"
    quantity: 2
  - interface_id: "IF-P008-SPAR"
    description: "Pylon forward spar attachment"
    fastener_type: "Hi-Lok HL19"
    quantity: 12
  - interface_id: "IF-P008-BOND"
    description: "Electrical bonding to wing structure"
    fastener_type: "Bonding strap with stud"
    quantity: 2

# Maintenance Information
maintenance:
  inspection_interval_fh: 4000
  inspection_method: "Visual inspection, magnetic particle inspection"
  special_maintenance_requirements:
    - "Pin bore inspection for wear/ovalization every 8000 FH"
    - "Magnetic particle inspection every 12000 FH"
    - "Electrical bonding resistance check every 2000 FH"

# Supply Chain
supply_chain:
  manufacturer: "TBD - Aerospace fittings supplier"
  supplier_part_number: "TBD"
  lead_time_weeks: 20
  minimum_order_quantity: 2

# Certification
certification:
  critical_part: true
  cert_basis: "CS-25.571, CS-25.613, CS-25.899 (fail-safe)"
  special_conditions:
    - "Static and fatigue testing required"
    - "Ultimate load test to 150% limit load"
    - "Fail-safe demonstration required"

# Additional Notes
notes: |
  The pylon wing attachment fitting is one of the most critical structural
  components in the aircraft. It transfers all engine and pylon loads into the
  wing structure and must meet stringent fail-safe and damage tolerance requirements.
  
  Critical design features:
  - Double-shear lug design provides redundant load paths
  - High-strength stainless steel provides excellent corrosion resistance
  - Precision machining ensures proper fit and load distribution
  - Multiple attachment points to pylon spar distribute loads
  - Must accommodate thermal expansion differences between materials
  - Lightning strike bonding is critical for electrical safety
