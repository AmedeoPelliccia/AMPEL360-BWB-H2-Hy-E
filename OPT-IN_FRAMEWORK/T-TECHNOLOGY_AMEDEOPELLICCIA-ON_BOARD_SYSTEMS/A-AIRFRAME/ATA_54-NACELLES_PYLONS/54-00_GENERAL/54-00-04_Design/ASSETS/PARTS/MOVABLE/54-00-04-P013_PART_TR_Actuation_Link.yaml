# Additional Notes
notes: |
  The TR actuation link is a critical component of the thrust reverser kinematic
  system. It transfers motion from the hydraulic actuator to the blocker door,
  converting linear actuator motion into rotational door movement.
  
  Design considerations:
  - Spherical bearings accommodate angular misalignment during door travel
  - Lightweight titanium construction minimizes inertia
  - High-cycle fatigue resistance for frequent operation
  - Corrosion-resistant for long-term reliability
  - Multiple links per thrust reverser (typically 2-4 per door)
  - Must transmit high actuation forces without buckling or bending
  - Fail-safe design prevents catastrophic failure
