# =============================================================================
# ATA 54 DRAWING TEMPLATE
# =============================================================================
# Instructions:
# 1. Copy this template and rename: 54-00-04-D<NNN>_DRWG_<Name>.yaml
# 2. Replace all <PLACEHOLDER> values with actual data
# 3. Remove sections marked [OPTIONAL] if not applicable
# 4. Ensure traceability links are correct
# 5. Update ASSETS/INDEX.meta.yaml with the new drawing entry
# =============================================================================

id: "54-00-04-D<NNN>"
title: "<Drawing Title>"
category: "DRWG"
ata_chapter: "54"

# Drawing Identification
drawing_metadata:
  drawing_number: "54-<XX>-<NNNN>"
  sheet_number: "<N of M>"  # e.g., "1 of 3"
  revision: "<Rev>"
  drawing_type: "<GA|Detail|Interface|Installation|Section>"
  scale: "<Scale>"  # e.g., "1:10", "1:1", "NTS"
  units: "<Metric|Imperial>"
  format: "<A0|A1|A2|A3|A4|ANSI-A|ANSI-B|ANSI-C|ANSI-D|ANSI-E>"
  cad_format: "<DWG|DXF|PDF|SVG>"
  status: "<Preliminary|Released|Superseded|Obsolete>"
  plm_item_id: "TC-DRWG-54-<AREA>-<NNN>"

# Subject Matter
subject:
  assembly_id: "ASM-54-<AREA>-<NNN>"  # [OPTIONAL] If drawing depicts assembly
  part_id: "54-00-04-P<NNN>"  # [OPTIONAL] If drawing depicts part
  ci_number: "CI-54-<CI>"
  zone: "<ZZZ-ZZZ>"  # e.g., 540-560
  description: "<Detailed description of what drawing shows>"
  
# Drawing Content
content:
  views:
    - name: "<Front|Top|Side|Isometric|Section A-A>"
      scale: "<Scale>"  # Can differ from overall drawing scale
      detail_level: "<High|Medium|Low>"
    # Add more views as needed
  dimensions:
    primary_dimensions: <N>  # Count of primary dimensions
    reference_dimensions: <N>  # Count of reference dimensions [OPTIONAL]
    tolerances_specified: <true|false>
  notes_count: <N>
  detail_callouts: <N>  # [OPTIONAL]
  bom_included: <true|false>

# Technical Specifications
specifications:
  material_callouts:
    - part: "<Part or Zone>"
      material: "<Material Specification>"
      finish: "<Surface Finish>"
    # Add more material callouts as needed
  geometric_tolerances:
    - feature: "<Feature Description>"
      tolerance: "<GD&T Specification>"
      datum: "<Datum Reference>"
    # Add more GD&T callouts as needed
  surface_finish:
    default_roughness_ra: <X.X>  # microns
    critical_surfaces:
      - location: "<Surface Description>"
        roughness_ra: <X.X>
        notes: "<Special requirements>"
  general_tolerances: "<Tolerance Standard>"  # e.g., ISO 2768-m, ±0.1mm

# References
references:
  related_drawings:
    - id: "54-00-04-D<NNN>"
      title: "<Related Drawing Title>"
      relationship: "<Parent|Child|Referenced>"
  assembly_drawings:
    - "ASM-54-<AREA>-<NNN>"  # [OPTIONAL]
  detail_drawings:
    - "54-00-04-D<NNN>"  # [OPTIONAL]
  interface_documents:
    - "54-00-05-<XX>-<NNN>"  # [OPTIONAL]

# Traceability
traceability:
  requirements:
    - "54-00-03-<XX>-<NNN>"  # Link to requirements
  safety_items:
    - "54-00-02-<XX>-<NNN>"  # Link to FHA/safety analyses [OPTIONAL]
  design_analyses:
    - "54-00-04-M<NNN>"  # Link to structural/thermal/aero models [OPTIONAL]
  test_procedures:
    - "54-00-07-<XX>-<NNN>"  # Link to V&V procedures [OPTIONAL]
  standards:
    - "<CS-25.xxx>"  # Certification basis
    - "<ISO-XXXX>"  # Drawing standards [OPTIONAL]

# Change Control
change_control:
  revision_history:
    - revision: "<Rev>"
      date: "<YYYY-MM-DD>"
      author: "<Name>"
      ecn_number: "<ECN-XXXX>"  # Engineering Change Notice [OPTIONAL]
      description: "<Summary of changes>"
    # Add more revisions as needed
  supersedes: "<Previous Drawing Number>"  # [OPTIONAL]
  superseded_by: "<New Drawing Number>"  # [OPTIONAL]

# Production & Distribution
production:
  cad_master_file: "<Filename.dwg>"
  pdf_export_required: <true|false>
  svg_export_required: <true|false>
  distribution_list:
    - "<Department or Person>"
    - "<External Vendor>"  # [OPTIONAL]
  controlled_copy: <true|false>
  export_controlled: <true|false>

# Compliance & Standards
compliance:
  drawing_standards:
    - "<ASME Y14.5>"  # GD&T standard
    - "<ISO 128>"  # Technical drawings standard
    - "<Company Drawing Standard>"
  certification_basis:
    - "<CS-25.xxx>"
  material_standards:
    - "<Material Spec>"  # e.g., AMS, ASTM
  manufacturing_standards:
    - "<Manufacturing Spec>"  # [OPTIONAL]

# Notes & Instructions
notes: |
  <Free-form notes about the drawing>
  
  Key features:
  - <Feature 1>
  - <Feature 2>
  
  Critical dimensions:
  - <Dimension 1 and why it's critical>
  - <Dimension 2 and why it's critical>
  
  Manufacturing considerations:
  - <Consideration 1>
  - <Consideration 2>
  
  Inspection requirements:
  - <Requirement 1>
  
  Special instructions:
  - <Instruction 1>

# Document Control
document_control:
  version: "1.0"
  status: "<Draft|Released|Obsolete>"
  created_date: "<YYYY-MM-DD>"
  last_updated: "<YYYY-MM-DD>"
  author: "<Name or Team>"
  checker: "<Name>"  # [OPTIONAL]
  approver: "<Name or Role>"
  change_history:
    - version: "1.0"
      date: "<YYYY-MM-DD>"
      author: "<Name>"
      changes: "<Initial release>"
    # Add more change records as needed
