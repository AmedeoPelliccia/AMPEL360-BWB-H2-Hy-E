notes: |
  Left pylon assembly is a critical structural component that transfers all
  engine/nacelle loads to the wing primary structure. The pylon must maintain
  precise engine alignment while accommodating thermal growth and operational loads.
  
  Key considerations:
  - Primary load path for thrust, vertical, side, and gyroscopic loads
  - High stiffness requirements for engine alignment (critical for performance)
  - Fatigue critical structure with damage tolerance design
  - Wing attachment interface is safety-critical
  - Engine mount interface must accommodate thermal expansion
  - Systems routing for fuel, hydraulic, electrical through pylon
  - Lightning strike protection integrated
  - Crashworthiness per CS-25.561
  
  The pylon interfaces with three major systems: wing structure, engine mounting,
  and nacelle system. All interfaces are controlled by ICDs.
  
  Manufacturing note: Critical alignment requirements necessitate precision tooling
  and laser measurement during assembly.
