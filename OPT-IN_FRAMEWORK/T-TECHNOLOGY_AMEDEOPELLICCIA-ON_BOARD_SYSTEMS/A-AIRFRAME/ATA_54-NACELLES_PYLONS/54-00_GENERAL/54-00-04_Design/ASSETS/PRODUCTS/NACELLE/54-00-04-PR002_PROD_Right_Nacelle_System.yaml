notes: |
  Right nacelle system is a complete ship set including all structural components,
  acoustic treatment, and interfaces for thrust reverser integration. This product
  is delivered fully assembled and tested, ready for installation on the aircraft.
  
  Key considerations:
  - Symmetrical design to left nacelle (PR001) with mirrored geometry
  - Acoustic performance critical for noise certification
  - High-temperature capability required in core and exhaust regions
  - Bird strike and lightning protection integrated
  - Maintenance access via fan cowl doors
  
  The nacelle interfaces with the pylon for mounting and with the engine for
  operational systems integration.
