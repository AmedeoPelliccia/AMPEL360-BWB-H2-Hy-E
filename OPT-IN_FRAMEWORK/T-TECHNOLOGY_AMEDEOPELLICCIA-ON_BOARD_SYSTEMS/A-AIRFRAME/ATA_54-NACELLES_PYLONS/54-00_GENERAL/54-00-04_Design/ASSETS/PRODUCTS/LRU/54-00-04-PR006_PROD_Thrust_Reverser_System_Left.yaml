notes: |
  Thrust Reverser System - Left is a complete Line Replaceable Unit designed for
  rapid removal and replacement during maintenance operations. The system provides
  thrust reversal capability for landing deceleration and rejected takeoffs.
  
  Key features:
  - Cascade-type thrust reverser with translating cowl
  - Dual hydraulic actuators for redundancy
  - Position sensing and monitoring for flight deck indication
  - Fail-safe design with automatic stowing capability
  - Integration with FADEC for engine interlock protection
  
  Safety considerations:
  - Deployment prevented during flight (weight-on-wheels interlock)
  - Asymmetric reverser deployment protection
  - Uncommanded deployment protection
  - Fail-safe stowing (loss of hydraulic pressure)
  
  The LRU is designed for quick removal (approx. 3.5 hours) to support line
  maintenance operations. The system undergoes extensive functional and endurance
  testing before delivery to ensure reliability and safety.
  
  Maintenance: Regular inspection of hydraulic seals, position sensors, and
  mechanical linkages required. Major overhaul includes complete disassembly,
  inspection, and replacement of wear items.
