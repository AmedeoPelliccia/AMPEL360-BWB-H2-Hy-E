analysis_parameters:
  method: "CFD - RANS for cruise, URANS/DES for high-lift configurations"
  solver: "TBD (STAR-CCM+, Fluent, or SU2)"
  key_parameters: |
    - Flight conditions: M0.78-0.85, cruise altitude 35,000-41,000 ft
    - Reynolds number: based on nacelle diameter
    - Turbulence model: k-omega SST or Spalart-Allmaras
    - Grid resolution: y+ < 1 at walls for accurate drag prediction
  boundary_conditions: "Far-field, engine mass flow, symmetry at centerline"
  assumptions: |
    - Fully turbulent flow (conservative for drag)
    - Steady-state cruise conditions
    - Engine mass flow from thrust setting
    - No separation in cruise (validated in analysis)

software_tools:
  primary: "TBD (STAR-CCM+ or Fluent for RANS CFD)"
  preprocessing: "TBD - unstructured hex mesh with prism layers"
  postprocessing: "TBD - drag decomposition, surface pressure visualization"
  version: "TBD"

