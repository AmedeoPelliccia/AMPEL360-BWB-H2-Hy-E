analysis_parameters:
  method: "Finite element structural dynamics coupled with unsteady aerodynamics"
  solver: "TBD (NASTRAN SOL 145/146 for flutter, or ZAERO)"
  key_parameters: |
    - Structural modes: up to 30 Hz (10-15 modes)
    - Aerodynamic method: Doublet-Lattice Method (subsonic), ZONA7 (transonic)
    - Flight envelope: M0 to M0.85, sea level to 41,000 ft
    - Damping: 2-4% structural damping assumed
    - Flutter margin: 15% above dive speed VD per CS-25.629
  boundary_conditions: "Wing root constraint, engine mass and gyroscopics"
  assumptions: |
    - Linear structural dynamics (small deformations)
    - Linear aerodynamics (acceptable for subsonic/transonic)
    - Engine modeled as rigid mass with gyroscopic effects
    - Fuel in wing affects coupled modes (swept in sensitivity)

