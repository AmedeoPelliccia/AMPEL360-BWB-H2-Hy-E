  primary: "TBD (NASTRAN with ZAERO, or MSC.Nastran SOL 145/146)"
  preprocessing: "TBD - modal analysis and aerodynamic panel meshing"
  postprocessing: "TBD - V-g plots, damping trends, mode tracking"
  version: "TBD"

input_requirements:
  geometry: "Structural FEM from M705 (mass, stiffness), aero panels for nacelle/pylon"
  loads: "Aerodynamic pressure distributions (unsteady)"
  material_properties: "Mass distribution, stiffness, damping"
  environmental_conditions: "Altitude, Mach, air density for flutter boundary"

results_summary:
  status: "Pending analysis"
  key_outputs: []
  validation_status: "Not validated"
  notes: |
    Critical flutter modes to investigate:
    - Pylon bending (vertical, lateral)
    - Pylon torsion
    - Nacelle pitch and yaw
    - Coupled wing-pylon-nacelle modes
    
    Flutter clearance required:
    - No flutter up to 1.15 × VD (dive speed)
    - Positive damping at all speeds below clearance speed
    - Sensitivity to mass and stiffness variations

verification:
