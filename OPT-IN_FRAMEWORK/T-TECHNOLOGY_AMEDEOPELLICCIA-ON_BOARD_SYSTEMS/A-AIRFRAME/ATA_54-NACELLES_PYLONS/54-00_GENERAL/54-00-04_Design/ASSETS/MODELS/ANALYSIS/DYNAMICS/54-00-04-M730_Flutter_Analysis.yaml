notes: |
  Flutter is a flight-safety critical concern. Failure to clear flutter can result
  in catastrophic structural failure.
  
  CS-25.629 requirements:
  - No flutter or divergence up to 1.15 × VD
  - Positive damping demonstrated by analysis and test
  - Consideration of mass/stiffness variations in service
  
  Coordinate with:
  - Structures for mass and stiffness data
  - Flight test for GVT and FFT planning
  - Certification authority for compliance approach
  
  Special considerations:
  - Engine mounting stiffness (critical for pylon modes)
  - Control surface coupling (if applicable)
  - External stores or modifications (future growth)
  - Manufacturing tolerances on stiffness

