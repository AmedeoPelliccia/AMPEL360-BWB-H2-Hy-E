description: |
  Thermal model for heat transfer between engine and nacelle structure:
  - Engine external surface temperatures
  - Heat flux to nacelle inner surfaces
  - Cooling air flow paths and effectiveness
  - Radiation exchange in engine bay
  - Ventilation system thermal performance
  This model provides boundary conditions for M710 nacelle thermal analysis.
