notes: |
  Thermal management is critical for:
  - Structural integrity (material limits)
  - Fire safety (barriers and detection)
  - System reliability (equipment cooling)
  - Crew and passenger safety (fire zones)
  
  Must coordinate with:
  - ATA 26 Fire Protection
  - ATA 30 Ice and Rain Protection
  - ATA 71 Powerplant (engine heat sources)
  
  Emergency scenarios to evaluate:
  - Engine fire (15-minute exposure)
  - APU fire exposure
  - Hot engine shutdown on ground

