notes: |
  Vibration is a key driver for:
  - Structural fatigue life (high-cycle fatigue)
  - Equipment reliability (avionics, sensors, actuators)
  - Passenger comfort (cabin noise and vibration)
  - Maintenance costs (wear and tear)
  
  Design guidelines:
  - Avoid resonances with engine orders (N1, N2, BPF)
  - Provide adequate damping (viscoelastic treatments if needed)
  - Isolate sensitive equipment from high-vibration zones
  - Acoustic panels designed for high SPL environment
  
  Coordinate with:
  - Engine OEM for vibration spectra and limits
  - Equipment suppliers for mounting requirements
  - Flight test for vibration survey instrumentation
  - Maintenance for inspection of vibration-critical areas
  
  Special considerations:
  - Blade-off event (extreme transient vibration)
  - Ground vibration during engine runup
  - Acoustic fatigue in fan duct and exhaust areas
  - Long-term degradation of damping materials

