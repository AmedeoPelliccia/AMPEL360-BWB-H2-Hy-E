analysis_parameters:
  method: "Frequency response analysis (harmonic excitation)"
  solver: "TBD (NASTRAN SOL 108/111 for frequency response)"
  key_parameters: |
    - Structural modal analysis (0-500 Hz range)
    - Engine excitation frequencies: N1, N2, blade passing (BPF)
    - Damping: 2-5% critical (structure), higher for acoustic panels
    - Random vibration: power spectral density from test data
  boundary_conditions: "Wing/engine attachment points, excitation at engine mounts"
  assumptions: |
    - Linear structural response (acceptable for vibration levels)
    - Modal superposition for frequency response
    - Engine vibration levels from OEM specifications
    - Structural damping includes material and joint damping

