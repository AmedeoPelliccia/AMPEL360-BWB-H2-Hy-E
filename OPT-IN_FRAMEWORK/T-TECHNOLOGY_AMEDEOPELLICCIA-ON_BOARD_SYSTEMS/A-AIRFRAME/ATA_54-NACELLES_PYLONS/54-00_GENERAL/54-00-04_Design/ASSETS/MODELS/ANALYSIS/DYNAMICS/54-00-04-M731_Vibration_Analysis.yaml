results_summary:
  status: "Pending analysis"
  key_outputs: []
  validation_status: "Not validated"
  notes: |
    Critical vibration concerns:
    - Resonance with engine orders (1×N1, 2×N1, 1×N2, BPF)
    - High-cycle fatigue from sustained vibration
    - Equipment mounting locations (avoid high vibration)
    - Acoustic panel response to high SPL (sound pressure level)
    
    Target vibration levels:
    - Structure: < 1g RMS at critical locations
    - Equipment mounts: per MIL-STD-810 or equivalent
    - Avoidance of resonances within ±10% of operating speeds

