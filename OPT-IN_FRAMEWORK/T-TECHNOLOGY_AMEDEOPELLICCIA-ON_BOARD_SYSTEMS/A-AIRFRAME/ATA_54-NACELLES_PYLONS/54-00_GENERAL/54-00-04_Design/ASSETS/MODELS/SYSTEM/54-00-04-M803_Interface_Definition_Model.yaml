results_summary:
  status: "Pending model development"
  key_outputs: []
  validation_status: "Not validated"
  notes: |
    Critical interfaces to define:
    
    1. **Pylon-Wing Interface** (54-00-03-05-001):
       - Upper and lower attachment fittings
       - Load transfer (ultimate loads, fatigue)
       - Electrical bonding and grounding
       - Fuel line pass-through
    
    2. **Nacelle-Pylon Interface** (54-00-03-05-002):
       - Forward and aft mounting points
       - Load transfer paths
       - Bleed air ducting
       - Wiring harness routing
    
    3. **Engine-Nacelle Interface** (54-00-03-05-003):
       - Engine mount fittings (thrust, vertical, side loads)
       - Bleed air offtakes
       - Fuel supply and return
       - Oil and hydraulic lines
       - FADEC and sensor wiring
       - Fire detection and suppression

