notes: |
  Inlet performance is critical for engine operation and thrust.
  Poor inlet quality can cause:
  - Engine surge and stall
  - Reduced thrust and efficiency
  - Increased engine maintenance costs
  - Unacceptable vibration and noise
  
  Design considerations:
  - Inlet lip radius (performance vs. drag trade)
  - Diffuser area ratio (length constraint vs. pressure recovery)
  - AIP location and engine face matching
  - Anti-icing bleed air effects on performance
  
  Coordinate with:
  - Engine OEM for compatibility limits
  - ATA 30 Ice Protection for anti-icing requirements
  - Flight test for inlet instrumentation plan
  
  Certification requirements:
  - Demonstrate no adverse inlet effects per CS-25
  - Validate distortion levels across flight envelope
  - Show adequate stall margin at all conditions

