title: "Inlet Flow Analysis Model"
category: "MODL"
model_type: "Aero"
analysis_domain: "Aerodynamics - Inlet Performance"
ata_chapter: "54"
description: |
  Detailed aerodynamic analysis of the nacelle inlet system:
  - Inlet total pressure recovery
  - Flow distortion at engine face (DC60, DPCPavg)
  - Inlet spillage drag at off-design conditions
  - Separation and flow quality assessment
  - Crosswind and angle of attack effects
  - Compatibility with engine requirements
