analysis_parameters:
  method: "CFD - RANS/URANS for steady and unsteady flow"
  solver: "TBD (STAR-CCM+, Fluent)"
  key_parameters: |
    - Flight envelope: M0 to M0.85, sea level to 41,000 ft
    - Engine mass flow ratio: capture area / throat area
    - Angle of attack: -5° to +15°
    - Crosswind: up to 40 knots
    - Distortion indices: DC60, DPCPavg per ARP1420
  boundary_conditions: "Far-field, engine mass flow boundary at AIP, symmetry/periodic"
  assumptions: |
    - Fully turbulent inlet flow
    - Steady-state for most conditions, URANS for crosswind cases
    - No ice accretion (separate analysis for icing conditions)
    - Anti-icing bleed air effects included

software_tools:
  primary: "TBD (STAR-CCM+ for CFD, in-house distortion post-processing)"
  preprocessing: "TBD - hex-dominant mesh with prism layers"
  postprocessing: "TBD - AIP distortion analysis per SAE ARP1420"
  version: "TBD"

input_requirements:
  geometry: "Inlet lip, diffuser, and AIP (Aerodynamic Interface Plane) from CAD"
  loads: "Engine mass flow schedule from ATA 71 powerplant"
  material_properties: "Surface roughness"
  environmental_conditions: "ISA, crosswind profiles, angle of attack variations"

results_summary:
  status: "Pending analysis"
  key_outputs: []
  validation_status: "Not validated"
  notes: |
    Key performance metrics:
    - Total pressure recovery: > 98% at cruise (per requirements)
    - DC60 distortion: < 0.10 (engine limit TBD from OEM)
    - DPCPavg: < 5% (engine compatibility)
    - No separation at AIP for all operating conditions
    
    Critical conditions to analyze:
    - High angle of attack takeoff
    - Crosswind takeoff and landing
    - Maximum climb power at altitude
    - Windmilling descent (low mass flow)

