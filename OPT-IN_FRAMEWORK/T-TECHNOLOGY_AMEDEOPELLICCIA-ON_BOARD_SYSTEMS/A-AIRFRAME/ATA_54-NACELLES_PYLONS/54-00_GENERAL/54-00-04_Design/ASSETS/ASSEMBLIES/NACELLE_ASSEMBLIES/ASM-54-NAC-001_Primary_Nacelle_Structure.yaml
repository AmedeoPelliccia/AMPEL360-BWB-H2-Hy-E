assembly_sequence:
  step_001: "Position forward structural frames on assembly fixture FAF-54-NAC-001"
  step_002: "Install inlet lip structure and verify alignment to datum"
  step_003: "Attach fan cowl forward section with temporary fasteners"
  step_004: "Install acoustic panel assemblies in designated zones"
  step_005: "Position fan cowl aft section and verify thrust reverser interface"
  step_006: "Install aft structural frames at specified stations"
  step_007: "Mount core cowl structure with thermal protection verification"
  step_008: "Install exhaust nozzle structure"
  step_009: "Replace temporary fasteners with permanent titanium fasteners"
  step_010: "Torque all primary fasteners to 65 Nm ±5%"
  step_011: "Perform dimensional inspection per drawing 54-10-1000"
  step_012: "Conduct pressure seal test on cowl interfaces"
  step_013: "Perform acoustic test verification"

tooling_required:
  - tooling_id: "FAF-54-NAC-001"
    description: "Nacelle Assembly Fixture with datum references"
  - tooling_id: "TW-0-150NM"
    description: "Torque wrench 0–150 Nm, calibrated"
  - tooling_id: "ALIGN-NAC-01"
    description: "Laser alignment system for inlet positioning"
  - tooling_id: "PRESS-TEST-NAC"
    description: "Pressure test rig for seal verification"
  - tooling_id: "ACOUSTIC-CAL"
    description: "Acoustic calibration equipment"

quality_control:
  dimensional:
    tolerance_mm: 0.8
    reference_drawing: "54-10-1000"
    critical_dimensions:
      - "Inlet diameter: ±0.5mm"
      - "Cowl alignment: ±0.8mm"
      - "Frame station locations: ±0.3mm"
  ndt:
    method: "Ultrasonic and visual inspection"
    coverage: "100% of primary load path joints"
    report_ref: "54-00-07-NAC-001_NDT_Report.md"
  fasteners:
    torque_spec_nm: 65
    torque_tolerance_percent: 5
    inspection_coverage: "100% primary fasteners"
  thermal:
    method: "Thermal imaging inspection"
    coverage: "Core cowl and exhaust sections"
  acoustic:
    method: "Noise reduction measurement"
    acceptance_criteria: "≥15 dB reduction vs. baseline"
  acceptance_criteria:
    - "All dimensions within tolerance per drawing 54-10-1000"
    - "Pressure seal test: No leaks at 5 psi differential"
    - "Acoustic performance meets or exceeds target"
    - "All primary fasteners properly torqued and verified"
    - "No defects detected in NDT inspection"
    - "Thermal protection coating uniform and intact"

