quality_control:
  dimensional:
    tolerance_mm: 2.0
    reference_drawing: "54-40-1000"
    critical_dimensions:
      - "Door gap: 3.0mm ±2.0mm"
      - "Hinge alignment: ±0.5mm"
      - "Latch engagement: minimum 8mm"
  composite_inspection:
    method: "Ultrasonic C-scan and tap test"
    coverage: "100% of sandwich panels"
    acceptance: "No delaminations >25mm diameter"
    report_ref: "54-00-07-COW-001_Composite_Inspection_Report.md"
  functional_testing:
    method: "Door operation cycle test"
    cycles: 50
    acceptance: "All cycles completed smoothly, no binding"
    report_ref: "54-00-07-COW-001_Functional_Test_Report.md"
  latch_testing:
    method: "Latch pull test"
    test_load_n: 5000
    acceptance: "No slippage at test load"
  seal_testing:
    method: "Pressure differential test"
    test_pressure_psi: 2.0
    acceptance: "Leak rate <0.1 SCFM"
  electrical_testing:
    method: "Sensor functionality and continuity test"
    acceptance: "All sensors functioning correctly"
  acceptance_criteria:
    - "All dimensions within tolerance per drawing 54-40-1000"
    - "Door gaps uniform and within spec"
    - "No delaminations in composite panels"
    - "50 operation cycles completed without issues"
    - "Latches engage properly with >8mm engagement"
    - "Seals effective at test pressure"
    - "All sensors functioning correctly"
    - "Surface finish and paint quality acceptable"
    - "Gas springs provide smooth opening assistance"

