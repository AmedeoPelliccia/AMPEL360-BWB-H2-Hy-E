assembly_sequence:
  step_001: "Assemble honeycomb core between inner and outer skins (left door)"
  step_002: "Bond and cure sandwich panel in autoclave per specification"
  step_003: "Machine panel edges and install edge closeouts"
  step_004: "Install internal stiffener frames (8 locations per door)"
  step_005: "Repeat steps 001-004 for right door"
  step_006: "Install upper hinge assemblies on both doors"
  step_007: "Install lower latch assemblies (3 per door)"
  step_008: "Mount doors on assembly fixture with hinge pins"
  step_009: "Verify door alignment and gap tolerances"
  step_010: "Install gas spring actuators (2 per door)"
  step_011: "Install perimeter seals on door edges"
  step_012: "Install latch position sensors (3 per door)"
  step_013: "Connect electrical harnesses to sensors"
  step_014: "Perform door opening/closing cycle test (10x)"
  step_015: "Verify latch engagement and sensor operation"
  step_016: "Apply protective coatings and paint"
  step_017: "Final inspection and documentation"

