notes: |
  The forward pylon structure is the primary load-carrying structure connecting
  the engine to the wing. It must transfer thrust, weight, gyroscopic loads, and
  inertial loads between the engine and wing while maintaining precise alignment.
  
  Key design considerations:
  - Primary load path for thrust and vertical loads
  - High stiffness requirements for engine alignment
  - Fatigue life requirements exceed 90,000 flight cycles
  - Wing attachment interface critical for aircraft structural integrity
  - Engine mount interface must accommodate engine thermal growth
  - Systems routing provisions for fuel, hydraulic, electrical
  - Lightning strike protection required
  - Crashworthiness requirements per CS-25.561
  
  Critical inspection points:
  - Engine mount fitting alignment (most critical)
  - Wing attachment hole quality and position
  - Primary structure bond quality
  - Fastener installation quality
  
  Future enhancements:
  - Advanced composite design optimization
  - Weight reduction through topology optimization
  - Integrated health monitoring sensors
  - Enhanced systems integration
