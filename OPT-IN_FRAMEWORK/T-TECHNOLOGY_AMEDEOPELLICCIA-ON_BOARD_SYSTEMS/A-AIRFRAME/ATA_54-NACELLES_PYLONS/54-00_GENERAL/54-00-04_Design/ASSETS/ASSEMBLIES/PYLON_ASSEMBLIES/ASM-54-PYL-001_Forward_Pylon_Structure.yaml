quality_control:
  dimensional:
    tolerance_mm: 0.2
    reference_drawing: "54-20-1000"
    critical_dimensions:
      - "Engine mount fitting centerlines: ±0.2mm"
      - "Wing attachment hole positions: ±0.15mm"
      - "Pylon box alignment: ±0.3mm"
  ndt:
    method: "Ultrasonic, X-ray, and eddy current inspection"
    coverage: "100% of primary load path and critical fittings"
    report_ref: "54-00-07-PYL-001_NDT_Report.md"
  fasteners:
    torque_spec_nm:
      wing_attachment: 280
      engine_mount: 350
      primary_structure: 75
    torque_tolerance_percent: 3
    inspection_coverage: "100% critical fasteners"
  load_testing:
    method: "Static load test to limit load"
    test_report: "54-00-07-PYL-001_Load_Test_Report.md"
  acceptance_criteria:
    - "All dimensions within tolerance per drawing 54-20-1000"
    - "Engine mount fittings aligned within ±0.2mm"
    - "Wing attachment holes within ±0.15mm positional tolerance"
    - "All critical fasteners properly torqued and verified"
    - "No defects detected in NDT inspection of primary load path"
    - "Load test passed without permanent deformation"
    - "Fairing fit-up acceptable with <2mm gaps"

