assembly_sequence:
  step_001: "Position forward pylon box structure on assembly fixture FAF-54-PYL-001"
  step_002: "Verify datum alignment with wing interface fixtures"
  step_003: "Install internal ribs and verify positioning to drawing"
  step_004: "Bond and fasten forward pylon spars"
  step_005: "Install engine mount interface fittings (forward pair)"
  step_006: "Install engine mount interface fittings (aft pair)"
  step_007: "Verify engine mount fitting alignment within 0.2mm"
  step_008: "Install wing attachment upper fittings"
  step_009: "Install wing attachment lower fittings"
  step_010: "Install temporary alignment pins for wing interface verification"
  step_011: "Install systems routing brackets per routing diagram"
  step_012: "Install all primary structure fasteners"
  step_013: "Torque critical wing attachment bolts to 280 Nm ±3%"
  step_014: "Torque engine mount fasteners to 350 Nm ±3%"
  step_015: "Perform dimensional inspection per drawing 54-20-1000"
  step_016: "Conduct load path verification test"
  step_017: "Install pylon fairing panels (non-structural)"
  step_018: "Final visual inspection"

