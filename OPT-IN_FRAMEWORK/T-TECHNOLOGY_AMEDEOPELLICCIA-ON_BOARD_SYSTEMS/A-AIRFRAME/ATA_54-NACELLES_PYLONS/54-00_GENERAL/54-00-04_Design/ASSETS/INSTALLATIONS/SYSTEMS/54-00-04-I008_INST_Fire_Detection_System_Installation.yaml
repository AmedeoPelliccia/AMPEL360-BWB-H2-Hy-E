notes: |
  Fire detection system installation is critical for crew and passenger safety.
  The system must provide rapid and reliable fire detection in all fire zones
  while minimizing false alarms. Installation must comply with CS-25.1203
  and related certification requirements.
  
  Fire zone definition:
  - Forward fire zone: Core cowl area surrounding engine core
  - Aft fire zone: Pylon area with hydraulic and fuel lines
  - Coverage requirement: 100% of designated fire zones
  
  Sensing element technology:
  - Type: Continuous loop pneumatic sensing elements
  - Configuration: Dual redundant loops (Loop A and Loop B)
  - Detection method: Average temperature rise detection
  - Response time: ≤5 seconds at 200°C above ambient
  - False alarm immunity: High resistance to vibration and moisture
  
  Installation best practices:
  - Route sensing elements through hottest areas of fire zone
  - Maintain proper clearance to hot surfaces (25mm typical)
  - Support spacing 50mm to prevent sagging
  - Avoid sharp bends (minimum radius 25mm)
  - Protect sensing elements from mechanical damage
  - Use cushioned clamps to prevent chafing
  - Keep sensing elements away from drain holes (moisture)
  
  Testing requirements:
  - Continuity: <10 Ω for each loop
  - Isolation: ≥10 MΩ at 500VDC between loops
  - Response time: <5 seconds to 200°C heat source
  - Coverage: Thermal mapping confirms 100% zone coverage
  - False alarm: No nuisance alarms during environmental tests
  
  System architecture:
  - Dual independent sensing loops for redundancy
  - Loop A and Loop B monitored independently
  - Either loop activation triggers cockpit warning
  - Control unit performs continuous self-test
  - Built-in test capability for ground verification
  
  Coordination required with:
  - ATA 26: Fire extinguishing system integration
  - ATA 31: Cockpit warning system interface
  - ATA 24: Power supply and circuit protection
  - ATA 45: Fault reporting to maintenance system
  - ATA 71: Engine fire zone boundaries
  
  Maintenance considerations:
  - Inspection intervals per ATA 26 requirements
  - Periodic functional testing (monthly ground test)
  - Sensing element replacement interval: 8000 flight hours
  - Control unit self-test on every flight
  - Documentation of all tests and anomalies
  
  Future enhancements:
  - Optical fire detection for improved response time
  - Multi-spectral detection for enhanced discrimination
  - Wireless sensing elements to reduce wiring
  - Integration with automatic fire suppression system
  - Artificial intelligence for false alarm reduction
