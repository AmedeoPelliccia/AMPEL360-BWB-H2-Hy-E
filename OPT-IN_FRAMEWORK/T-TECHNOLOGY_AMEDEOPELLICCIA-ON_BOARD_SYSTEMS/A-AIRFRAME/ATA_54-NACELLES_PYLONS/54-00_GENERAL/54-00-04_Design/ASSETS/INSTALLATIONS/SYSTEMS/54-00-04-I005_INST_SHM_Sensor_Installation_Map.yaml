id: "54-00-04-I005"
title: "SHM Sensor Installation Map"
category: "INST"
installation_type: "Sensor Placement"
ata_chapter: "54"
description: |
  Structural Health Monitoring (SHM) sensor installation locations and
  procedures for nacelle and pylon structures. Defines sensor placement,
  attachment methods, signal routing, and coverage requirements to support
  continuous structural monitoring per ATA 95 SHM requirements.
status: "Planned"
version: "0.1.0"
owner: "Installation Engineering"
last_updated: "2026-01-02"

traceability:
  assemblies:
    - id: "ASM-54-NAC-001"
      title: "Primary Nacelle Structure"
    - id: "ASM-54-PYL-001"
      title: "Forward Pylon Structure"
    - id: "ASM-54-REV-001"
      title: "Cascade Assembly"
    - id: "ASM-54-COW-001"
      title: "Fan Cowl Door Assembly"
  requirements:
    - id: "54-00-03-07-001"
      title: "Nacelle Structure SHM Compatibility"
  drawings:
    - id: "54-00-04-D010"
      title: "SHM Sensor Locations"

installation_parameters:
  mounting_points: 32
  primary_structure: "All primary load path structures in nacelle and pylon"
  installation_sequence: |
    1. Prepare sensor installation locations (surface preparation)
    2. Install engine mount sensors (8x locations - forward and aft mounts)
    3. Install pylon-wing attachment sensors (6x locations - primary fittings)
    4. Install thrust reverser frame sensors (4x locations - critical frames)
    5. Install nacelle structural frame sensors (8x locations - frames)
    6. Install cowl attachment sensors (4x locations - hinge points)
    7. Install fan blade-out path sensors (2x locations - containment zone)
    8. Route sensor cables through designated pathways
    9. Connect sensors to data acquisition system
    10. Apply protective coatings over sensors
    11. Perform sensor response verification test
    12. Document sensor serial numbers and locations
    13. Upload sensor calibration data to monitoring system
  torque_requirements:
    - location: "Sensor mounting screws (M4)"
      value: "1.5 Nm"
      tolerance: "±0.2 Nm"
    - location: "Cable clamp screws (M5)"
      value: "2.5 Nm"
      tolerance: "±0.3 Nm"

clearances:
  - description: "Sensor to adjacent structure"
    value: "10 mm min"
