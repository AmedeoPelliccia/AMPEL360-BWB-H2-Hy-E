notes: |
  Ground clearance verification ensures safe operation of aircraft during
  takeoff, landing, taxiing, and ground handling. Adequate clearances prevent
  nacelle damage from ground contact and ensure safe servicing operations.
  
  Measurement conditions:
  - Aircraft weight: Empty weight for static, MTOW for dynamic
  - Tire pressure: Normal inflation pressure
  - Landing gear: Fully extended, no compression for static
  - Surface: Level, hard surface (concrete or asphalt)
  - Temperature: Ambient, no thermal effects
  - Fuel load: Empty tanks for static measurements
  
  Critical clearance points:
  - Nacelle inlet forward low point (most critical during rotation)
  - Nacelle exhaust aft low point (critical during tail-down attitude)
  - Pylon lower fairing (critical during rotation)
  - Thrust reverser lower edge (critical during deployment)
  - Fan cowl door lower edge (critical when door open)
  
  Static clearance requirements:
  - Minimum 650 mm at nacelle forward low point
  - Margin for tire deflation: 50 mm
  - Margin for uneven surfaces: 100 mm
  - Total design target: 800 mm static clearance
  
  Dynamic clearance scenarios:
  - Rotation: +8 deg pitch angle at VR (rotation speed)
  - Landing: 2g vertical load with gear compression
  - Rough field: Uneven surface, +/-5 deg roll angle
  - Servicing: Aircraft on jacks at minimum height
  - Tire flat: One main gear tire deflated
  
  Measurement procedure:
  - Establish datum reference (aircraft centerline and waterline)
  - Use laser measurement for primary measurements
  - Verify with mechanical tape measure
  - Take photographs with measurement scales visible
  - Record aircraft configuration (weight, CG, attitude)
  - Document any deviations from requirements
  
  Design considerations:
  - Low-wing configuration requires careful clearance management
  - Engine diameter and nacelle size directly impact clearance
  - Wing dihedral and pylon length affect ground clearance
  - Landing gear geometry critical for clearance
  - Thrust reverser deployment increases nacelle diameter
  
  Certification compliance:
  - CS-25.733: Tires and tire pressure
  - CS-25.231: Ground load conditions
  - Advisory material for ground clearance demonstrations
  
  Operational impact:
  - Adequate clearance allows operation from unpaved runways
  - Clearance affects allowable surface roughness
  - Limits on crosswind landing technique (wing-low approach)
  - Affects ground servicing equipment requirements
  
  Coordination required with:
  - ATA 32: Landing gear geometry and loads
  - ATA 08: Aircraft general dimensions
  - ATA 05: Ground handling procedures
  - ATA 57: Wing and pylon attachment geometry
  
  Documentation requirements:
  - Clearance verification report with measurements
  - Photographic documentation of all points
  - Comparison to design requirements
  - Sign-off by structures engineer
  - Retention in aircraft certification file
  
  Future enhancements:
  - 3D laser scanning for complete clearance map
  - Real-time clearance monitoring system
  - Automated measurement and documentation
  - Integration with digital aircraft model
