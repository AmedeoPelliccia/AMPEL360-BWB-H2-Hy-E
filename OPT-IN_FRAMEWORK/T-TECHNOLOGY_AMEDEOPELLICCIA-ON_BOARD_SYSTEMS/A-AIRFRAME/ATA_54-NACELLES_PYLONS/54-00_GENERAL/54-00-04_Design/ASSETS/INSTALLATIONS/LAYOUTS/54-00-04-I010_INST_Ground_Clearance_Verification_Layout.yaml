      title: "Nacelle Primary Structure - General Arrangement"
    - id: "54-00-04-D003"
      title: "Pylon General Arrangement"

installation_parameters:
  mounting_points: 12
  primary_structure: "Nacelle lower surface and pylon lower fairing"
  installation_sequence: |
    1. Position aircraft on level surface with landing gear extended
    2. Verify aircraft attitude (pitch and roll angles at zero)
    3. Measure ground clearance at nacelle forward low point
    4. Measure ground clearance at nacelle aft low point
    5. Measure ground clearance at pylon lower fairing
    6. Measure ground clearance at thrust reverser lower edge
    7. Verify clearances meet minimum requirements
    8. Simulate rotation attitude (nose gear extended +8 degrees)
    9. Verify clearances during rotation scenario
    10. Simulate landing gear compression (2g landing load)
    11. Verify clearances with gear compressed
    12. Document all measurements with photographs
    13. Prepare ground clearance verification report
  torque_requirements:
    - location: "N/A - Measurement activity only"
      value: "N/A"
      tolerance: "N/A"

