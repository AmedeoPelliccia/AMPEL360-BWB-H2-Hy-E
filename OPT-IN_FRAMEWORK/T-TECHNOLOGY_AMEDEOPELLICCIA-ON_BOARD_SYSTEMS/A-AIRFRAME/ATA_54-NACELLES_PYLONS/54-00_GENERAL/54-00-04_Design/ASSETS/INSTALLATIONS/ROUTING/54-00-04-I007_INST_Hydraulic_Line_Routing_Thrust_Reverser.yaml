notes: |
  Hydraulic line installation for thrust reverser system requires meticulous
  attention to cleanliness, proper fitting torque, and routing clearances
  to ensure leak-free, reliable operation throughout service life.
  
  Hydraulic system specifications:
  - Operating pressure: 3000 psi
  - Proof pressure: 4500 psi (1.5x operating)
  - Burst pressure: 12000 psi (4x operating)
  - Fluid: MIL-PRF-83282 (fire-resistant synthetic)
  - Temperature range: -55°C to +135°C
  
  Line routing strategy:
  - Supply: Pylon to nacelle, protected path along frames
  - Pressure to actuators: Shortest practical route, minimize bends
  - Return: Gravity assist where possible, drain at low points
  - Sensing: Separate from power lines, protected routing
  
  Fitting installation best practices:
  - Clean all fittings with approved solvent before assembly
  - Inspect threads for damage or contamination
  - Apply torque in single smooth motion (no retorquing)
  - Use backup wrench to prevent tube rotation
  - Verify flare seat contact (no gaps)
  - Cap all open fittings immediately
  
  Line support requirements:
  - Cushioned clamps to prevent vibration damage
  - Support spacing per line type and diameter
  - Avoid cantilever loads on fittings
  - Allow thermal expansion movement
  - Prevent chafing against structure
  
  Leak containment:
  - Drain tubes at low points route to overboard drain
  - Fire zone leaks must be contained and drained
  - Leak detection provisions in critical areas
  - Regular inspection intervals per ATA 29
  
  Testing and acceptance:
  - Pressure test witnessed by quality inspector
  - Zero leaks acceptable at test pressure
  - Weeping at fittings requires retorque or replacement
  - Document all test results and any corrective actions
  
  Coordination required with:
  - ATA 29: Hydraulic system integration
  - ATA 78: Thrust reverser actuation timing
  - ATA 26: Fire zone leak containment
  - ATA 45: Leak warning system integration
  
  Future enhancements:
  - Advanced leak detection sensors (continuous monitoring)
  - Lightweight composite hydraulic lines
  - Improved fire-resistant coatings
  - Quick-disconnect fittings for improved maintainability
