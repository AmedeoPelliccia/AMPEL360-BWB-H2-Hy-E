  drawings:
    - id: "54-00-04-D006"
      title: "Thrust Reverser Installation"

installation_parameters:
  mounting_points: 24
  primary_structure: "Pylon and nacelle aft structure"
  installation_sequence: |
    1. Review hydraulic schematic and routing diagram
    2. Install line support clamps at specified locations (24x points)
    3. Install drain grommets at low points for leak drainage
    4. Route primary hydraulic supply line from pylon to reverser manifold
    5. Install pressure line to left actuator
    6. Install pressure line to right actuator
    7. Install return line from manifold to pylon hydraulic system
    8. Install pressure sensing lines to cockpit indication system
    9. Secure all lines with cushioned clamps (spacing per spec)
    10. Install fire-resistant protective sleeving in engine zone
    11. Verify clearances to structure, electrical, and hot areas
    12. Install leak containment drain tubes
    13. Torque all fittings per specification
    14. Perform pressure test (1.5x system pressure for 5 minutes)
    15. Perform leak test (system pressure for 30 minutes)
    16. Apply identification labels per ATA 29 standard
  torque_requirements:
    - location: "AN fittings (-6 size)"
      value: "20 Nm"
      tolerance: "±2 Nm"
    - location: "AN fittings (-8 size)"
      value: "35 Nm"
      tolerance: "±3 Nm"
    - location: "AN fittings (-10 size)"
      value: "50 Nm"
      tolerance: "±4 Nm"
    - location: "Line clamp screws (M6)"
      value: "4.0 Nm"
      tolerance: "±0.4 Nm"

