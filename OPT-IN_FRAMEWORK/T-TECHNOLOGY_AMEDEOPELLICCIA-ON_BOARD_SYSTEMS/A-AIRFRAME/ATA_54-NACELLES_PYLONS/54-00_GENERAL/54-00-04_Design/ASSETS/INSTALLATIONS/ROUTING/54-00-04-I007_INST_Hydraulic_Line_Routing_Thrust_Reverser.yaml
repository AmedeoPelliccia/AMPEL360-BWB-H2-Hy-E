id: "54-00-04-I007"
title: "Hydraulic Line Routing - Thrust Reverser"
category: "INST"
installation_type: "Fluid Routing"
ata_chapter: "54"
description: |
  Hydraulic line routing layout for thrust reverser actuation system including
  supply and return lines, pressure sensing lines, and associated fittings.
  Defines routing paths, support locations, separation requirements, and
  leak containment provisions per ATA 29 hydraulic system requirements.
status: "Planned"
version: "0.1.0"
owner: "Installation Engineering"
last_updated: "2026-01-02"

traceability:
  assemblies:
    - id: "ASM-54-REV-001"
      title: "Cascade Assembly"
