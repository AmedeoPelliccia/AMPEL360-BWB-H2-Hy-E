    - location: "Hinge bolts (M8)"
      value: "18 Nm"
      tolerance: "±2 Nm"
    - location: "Panel retaining screws (M5)"
      value: "2.5 Nm"
      tolerance: "±0.3 Nm"
    - location: "Quick-release fasteners (DZUS)"
      value: "1/4 turn past engagement"
      tolerance: "N/A"

