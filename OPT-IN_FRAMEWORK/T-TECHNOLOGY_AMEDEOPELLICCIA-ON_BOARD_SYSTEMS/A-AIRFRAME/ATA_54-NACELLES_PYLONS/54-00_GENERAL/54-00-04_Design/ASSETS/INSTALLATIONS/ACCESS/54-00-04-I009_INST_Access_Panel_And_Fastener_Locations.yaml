notes: |
  Access panel and fastener installation provides essential maintenance access
  to nacelle systems and components. Proper installation ensures panels remain
  secure during flight while allowing quick removal for maintenance.
  
  Panel types and quantities:
  - Fan cowl doors: 2x (left and right), hinged, ~45 kg each
  - Translating cowl sections: 2x (left and right), ~85 kg each
  - Thrust reverser access panels: 8x, quick-access
  - Core cowl inspection doors: 6x, removable
  - Pylon access panels: 4x, removable
  - Drain access covers: 6x, small inspection panels
  
  Fastener types and applications:
  - DZUS fasteners: Quick-access panels (18-24 per panel)
  - Machine screws (M5): Small inspection doors (4-8 per panel)
  - Machine screws (M8): Structural panel attachments
  - Hinge pins: Fan cowl door hinges (4 per door)
  - Camloc fasteners: Alternative quick-release system
  
  Panel access requirements:
  - Fan cowl doors: Daily inspection access to engine
  - Core cowl panels: Hot section inspection access
  - Thrust reverser panels: Actuator and cascade access
  - Pylon panels: Systems access (hydraulic, electrical)
  - Drain panels: Drainage system inspection and cleaning
  
  Installation best practices:
  - Verify panel orientation and correct installation location
  - Ensure proper fastener engagement (visual and tactile check)
  - Maintain panel gap tolerances for aerodynamic performance
  - Install seals properly to prevent moisture ingress
  - Apply corrosion protection at fastener interfaces
  - Label panels clearly per maintenance manual
  - Document panel serial numbers and locations
  
  Fastener maintenance:
  - Inspect fasteners for wear and damage during each access
  - Replace worn DZUS fasteners per wear limits
  - Lubricate hinges per scheduled maintenance
  - Torque check structural fasteners periodically
  - Maintain adequate spare fastener stock
  
  Access panel categories by frequency:
  - Daily access: Fan cowl doors (engine inspection)
  - Weekly access: Drain panels (moisture removal)
  - Phase check access: Core cowl panels (hot section)
  - Heavy maintenance: Translating cowl (major inspection)
  
  Coordination required with:
  - ATA 05: Maintenance procedures and time limits
  - ATA 51: Standard practices and structures
  - ATA 12: Servicing and ground handling
  - ATA 71: Engine access requirements
  
  Design considerations:
  - Panel weight: Minimize for ease of handling
  - Fastener count: Balance security vs. maintenance time
  - Hinge design: Reliable operation, long service life
  - Seal design: Prevent moisture, maintain aerodynamics
  - Access size: Sufficient for component removal/installation
  
  Future enhancements:
  - Lightweight composite access panels
  - Improved quick-release fastener design
  - Power-assisted opening for large panels
  - Integrated access panel position sensors
  - Enhanced corrosion-resistant fasteners
