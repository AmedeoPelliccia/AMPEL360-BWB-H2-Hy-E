installation_parameters:
  mounting_points: 48
  primary_structure: "Nacelle frames and cowl internal surfaces"
  installation_sequence: |
    1. Plan harness routing per electrical schematic and routing diagram
    2. Install cable support brackets at specified locations (48x points)
    3. Install cable entry/exit grommets at nacelle interfaces
    4. Route primary power harness (28VDC bus) along forward frames
    5. Route SHM sensor harness bundle along centerline
    6. Route lighting harness to position light locations
    7. Route thrust reverser actuation harness to actuators
    8. Route fire detection harness through core cowl region
    9. Route engine instrumentation harness to engine interface
    10. Secure all harnesses with appropriate clamps (spacing per spec)
    11. Install protective sleeving in abrasion-prone areas
    12. Verify clearances to moving parts and hot sections
    13. Apply identification labels per ATA 24 standard
    14. Perform continuity, insulation resistance, and bonding tests
    15. Document harness serial numbers and routing paths
  torque_requirements:
    - location: "Cable clamp screws (M5)"
      value: "2.5 Nm"
      tolerance: "±0.3 Nm"
    - location: "Bracket mounting screws (M6)"
      value: "4.0 Nm"
      tolerance: "±0.4 Nm"
    - location: "Connector backshells"
      value: "Hand tight + 1/4 turn"
      tolerance: "N/A"

