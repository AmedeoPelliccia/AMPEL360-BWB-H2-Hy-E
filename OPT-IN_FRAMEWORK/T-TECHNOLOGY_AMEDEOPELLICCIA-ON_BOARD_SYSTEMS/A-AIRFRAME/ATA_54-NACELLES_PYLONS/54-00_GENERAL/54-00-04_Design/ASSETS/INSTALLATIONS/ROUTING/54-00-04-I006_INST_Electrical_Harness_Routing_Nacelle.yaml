id: "54-00-04-I006"
title: "Electrical Harness Routing - Nacelle"
category: "INST"
installation_type: "Cable Routing"
ata_chapter: "54"
description: |
  Electrical harness routing layout for nacelle installation including power,
  signal, and data cables for lighting, sensors, actuators, and monitoring
  systems. Defines routing paths, support locations, separation requirements,
  and electromagnetic compatibility provisions per ATA 24 requirements.
status: "Planned"
version: "0.1.0"
owner: "Installation Engineering"
last_updated: "2026-01-02"

