notes: |
  Electrical harness routing in nacelle environment requires careful planning
  to ensure reliability in demanding operating conditions including vibration,
  temperature extremes, and electromagnetic interference.
  
  Harness types and routing:
  - Primary power (28VDC): Forward frames route, protected routing
  - SHM sensors: Centerline route, shielded cables
  - Lighting: Cowl internal route to position light locations
  - Thrust reverser: Aft frames route, environmentally sealed
  - Fire detection: Core cowl route, high-temperature capable
  - Engine instrumentation: Pylon route to engine interface
  
  Separation requirements:
  - Power and signal: 50 mm minimum
  - Fire detection from other systems: 50 mm minimum
  - Electromagnetic compatibility per DO-160 requirements
  
  Environmental considerations:
  - Temperature rating: -55°C to +200°C (selected zones)
  - Vibration: Per DO-160 category U (engine vicinity)
  - Moisture: Protected against water ingress (IP67 connectors)
  - Fluid resistance: Fuel, oil, hydraulic fluid compatible
  - Abrasion: Protective sleeving in high-wear areas
  
  Installation best practices:
  - Maintain cable bend radius (10x diameter minimum)
  - Strain relief at all connector interfaces
  - Support spacing per vibration environment
  - Avoid sharp edges and pinch points
  - Label at 600mm intervals and at all connectors
  - Document as-installed routing in maintenance records
  
  Testing requirements:
  - Continuity: <1 Ω per circuit
  - Insulation: ≥10 MΩ at 500VDC
  - Bonding: ≤0.003 Ω structure to connector shells
  - High-potential: 1000VDC for 60 seconds (optional)
  
  Future enhancements:
  - Fiber optic data bus evaluation
  - Wireless sensor technology (reduce harness weight)
  - Advanced electromagnetic shielding materials
  - Modular harness design for improved maintainability
