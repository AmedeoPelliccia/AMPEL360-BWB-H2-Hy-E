<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <title>ICN-AMPEL360AT-26-00-0001 - Fire Protection System Block Diagram</title>
  
  <!-- Background -->
  <rect width="400" height="300" fill="#ffffff"/>
  
  <!-- Title -->
  <text x="200" y="25" font-family="Arial, sans-serif" font-size="14" font-weight="bold" 
        text-anchor="middle" fill="#000">
    Fire Protection System Block Diagram
  </text>
  
  <!-- Detection Block -->
  <rect x="50" y="50" width="100" height="60" fill="#d4edda" stroke="#000" stroke-width="1"/>
  <text x="100" y="75" font-family="Arial, sans-serif" font-size="12" 
        text-anchor="middle" fill="#000">
    Detection
  </text>
  <text x="100" y="90" font-family="Arial, sans-serif" font-size="10" 
        text-anchor="middle" fill="#000">
    Sensors
  </text>
  
  <!-- Control Block -->
  <rect x="150" y="120" width="100" height="60" fill="#d1ecf1" stroke="#000" stroke-width="1"/>
  <text x="200" y="145" font-family="Arial, sans-serif" font-size="12" 
        text-anchor="middle" fill="#000">
    Control Unit
  </text>
  <text x="200" y="160" font-family="Arial, sans-serif" font-size="10" 
        text-anchor="middle" fill="#000">
    FICU
  </text>
  
  <!-- Extinguishing Block -->
  <rect x="250" y="50" width="100" height="60" fill="#f8d7da" stroke="#000" stroke-width="1"/>
  <text x="300" y="75" font-family="Arial, sans-serif" font-size="12" 
        text-anchor="middle" fill="#000">
    Extinguishing
  </text>
  <text x="300" y="90" font-family="Arial, sans-serif" font-size="10" 
        text-anchor="middle" fill="#000">
    Bottles
  </text>
  
  <!-- Flight Deck Block -->
  <rect x="150" y="220" width="100" height="50" fill="#fff3cd" stroke="#000" stroke-width="1"/>
  <text x="200" y="240" font-family="Arial, sans-serif" font-size="12" 
        text-anchor="middle" fill="#000">
    Flight Deck
  </text>
  <text x="200" y="255" font-family="Arial, sans-serif" font-size="10" 
        text-anchor="middle" fill="#000">
    Indications
  </text>
  
  <!-- Connections -->
  <line x1="150" y1="80" x2="150" y2="150" stroke="#000" stroke-width="2"/>
  <line x1="250" y1="80" x2="250" y2="150" stroke="#000" stroke-width="2"/>
  <line x1="200" y1="180" x2="200" y2="220" stroke="#000" stroke-width="2"/>
  
  <!-- Legend -->
  <text x="10" y="290" font-family="Arial, sans-serif" font-size="8" fill="#666">
    ICN-AMPEL360AT-26-00-0001-A_001
  </text>
</svg>
