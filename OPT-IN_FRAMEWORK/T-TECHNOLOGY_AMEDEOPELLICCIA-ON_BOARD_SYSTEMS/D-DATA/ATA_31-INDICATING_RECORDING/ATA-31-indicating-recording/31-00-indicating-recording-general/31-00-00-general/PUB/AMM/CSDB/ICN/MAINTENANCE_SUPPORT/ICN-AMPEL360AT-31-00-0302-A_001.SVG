<!-- ============================================================ -->
<!-- ICN: AMPEL360AT-31-00-0302-A_001                            -->
<!-- ATA: 31-00-00 Indicating & Recording – General              -->
<!-- Title: Connector Identification Schematic (Illustrative)    -->
<!-- Purpose: Typical connector types and labelling conventions  -->
<!-- Referenced by: DM-520x, DM-72x, DM-351A                    -->
<!-- Status: Draft                                               -->
<!-- Date: 2026-02-27                                            -->
<!-- ============================================================ -->
<svg xmlns="http://www.w3.org/2000/svg"
     xmlns:xlink="http://www.w3.org/1999/xlink"
     viewBox="0 0 400 300"
     width="400"
     height="300">

  <title>ICN-AMPEL360AT-31-00-0302 - Connector Identification Schematic</title>

  <defs>
    <style type="text/css">
      .lru-box  { fill: #D4EDDA; stroke: #28A745; stroke-width: 2; }
      .conn     { fill: #D1ECF1; stroke: #17A2B8; stroke-width: 1.5; }
      .cable    { fill: none; stroke: #555; stroke-width: 2; }
      .plug     { fill: #FFF3CD; stroke: #FFC107; stroke-width: 1.5; }
      .label    { font-family: Arial, sans-serif; font-size: 9px; text-anchor: middle; fill: #000; }
      .label-sm { font-family: Arial, sans-serif; font-size: 7.5px; fill: #333; }
      .title    { font-family: Arial, sans-serif; font-size: 12px; font-weight: bold; text-anchor: middle; fill: #000; }
      .subtitle { font-family: Arial, sans-serif; font-size: 8px; text-anchor: middle; fill: #555; }
      .note     { font-family: Arial, sans-serif; font-size: 7px; fill: #888; }
      .id-lbl   { font-family: Arial, sans-serif; font-size: 8px; font-weight: bold; text-anchor: middle; fill: #17A2B8; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="400" height="300" fill="#ffffff"/>

  <!-- Title -->
  <text x="200" y="20" class="title">Connector Identification Schematic (Illustrative)</text>
  <text x="200" y="32" class="subtitle">ATA 31-00-00 | ICN-AMPEL360AT-31-00-0302-A_001 | Illustrative Only</text>

  <!-- LRU box left -->
  <rect x="20" y="100" width="90" height="75" class="lru-box" rx="5"/>
  <text x="65" y="130" class="label" font-weight="bold">LRU / Unit</text>
  <text x="65" y="143" class="label">(e.g. DAU)</text>

  <!-- Connector J1 on LRU -->
  <rect x="110" y="115" width="20" height="20" class="conn" rx="2"/>
  <text x="120" y="128" class="id-lbl">J1</text>

  <!-- Cable from J1 to P1 -->
  <line x1="130" y1="125" x2="200" y2="125" class="cable"/>

  <!-- Plug P1 -->
  <rect x="200" y="115" width="20" height="20" class="plug" rx="2"/>
  <text x="210" y="128" class="id-lbl">P1</text>

  <!-- Cable from P1 to J2 -->
  <line x1="220" y1="125" x2="290" y2="125" class="cable"/>

  <!-- Connector J2 on second unit -->
  <rect x="290" y="115" width="20" height="20" class="conn" rx="2"/>
  <text x="300" y="128" class="id-lbl">J2</text>

  <!-- Second LRU box right -->
  <rect x="310" y="100" width="70" height="75" class="lru-box" rx="5"/>
  <text x="345" y="130" class="label" font-weight="bold">LRU 2</text>
  <text x="345" y="143" class="label">(e.g. Display)</text>

  <!-- Cable ID label -->
  <text x="165" y="115" class="id-lbl">W31-001</text>

  <!-- Labels below connectors -->
  <text x="120" y="150" class="label-sm" text-anchor="middle">Receptacle</text>
  <text x="210" y="150" class="label-sm" text-anchor="middle">Plug</text>
  <text x="300" y="150" class="label-sm" text-anchor="middle">Receptacle</text>

  <!-- Note box -->
  <rect x="20" y="200" width="360" height="60" fill="#FFF3CD" stroke="#FFC107" stroke-width="0.8" rx="3"/>
  <text x="200" y="215" class="label" font-weight="bold">Important</text>
  <text x="30" y="230" class="label-sm">This ICN shows connector labelling concepts only.</text>
  <text x="30" y="243" class="label-sm">It is NOT a substitute for wiring diagrams or pin-out data.</text>
  <text x="30" y="256" class="label-sm">Refer to DM-351A and project wiring diagrams for normative data.</text>

  <!-- Document Control -->
  <text x="5" y="292" class="note">ICN-AMPEL360AT-31-00-0302-A_001 | Issue A | 2026-02-27 | DRAFT – Illustrative Only | S1000D Issue 5.0</text>

</svg>
