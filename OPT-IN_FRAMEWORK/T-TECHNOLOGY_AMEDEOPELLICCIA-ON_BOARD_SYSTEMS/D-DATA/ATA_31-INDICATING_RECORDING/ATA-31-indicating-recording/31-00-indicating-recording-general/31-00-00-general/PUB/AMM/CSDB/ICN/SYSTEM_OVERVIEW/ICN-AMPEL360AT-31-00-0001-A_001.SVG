  <line x1="100" y1="75" x2="153" y2="75" class="arrow"/>

  <!-- Arrows: DAU → Displays -->
  <line x1="245" y1="68" x2="298" y2="68" class="arrow"/>

  <!-- Arrows: DAU → Processing -->
  <line x1="200" y1="95" x2="200" y2="128" class="arrow"/>

  <!-- Arrows: Processing → Recorders -->
