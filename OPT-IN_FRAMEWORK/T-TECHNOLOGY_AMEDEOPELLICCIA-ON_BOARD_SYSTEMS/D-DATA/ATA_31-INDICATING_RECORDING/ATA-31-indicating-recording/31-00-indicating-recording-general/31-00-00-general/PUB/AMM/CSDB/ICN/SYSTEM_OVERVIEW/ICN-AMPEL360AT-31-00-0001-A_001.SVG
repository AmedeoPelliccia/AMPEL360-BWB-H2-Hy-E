  <!-- Arrows: Processing ↔ ATA Interfaces -->
  <line x1="200" y1="170" x2="200" y2="208" class="arrow"/>

  <!-- Document Control -->
  <g id="doc-control">
    <text x="5" y="292" class="note">ICN-AMPEL360AT-31-00-0001-A_001 | Issue A | 2026-02-27 | DRAFT – Illustrative Only | S1000D Issue 5.0</text>
