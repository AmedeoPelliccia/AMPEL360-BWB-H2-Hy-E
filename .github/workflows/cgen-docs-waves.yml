name: CGen Docs Waves

on:
  schedule:
    # Run every 3 days at 02:00 UTC
    - cron: '0 2 */3 * *'
  workflow_dispatch:
    inputs:
      batch_id:
        description: 'Batch to run (e.g., BATCH_ONBOARD_A)'
        required: true
        type: string
        default: 'BATCH_ONBOARD_A'
      dry_run:
        description: 'Dry run mode (no changes / no PR)'
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write

jobs:
  cgen-docs-wave:
    name: Run CGen Docs Wave
    runs-on: ubuntu-latest

    steps:
      # ---------------------------------------------------------
      # Checkout
      # ---------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      # ---------------------------------------------------------
      # Environment
      # ---------------------------------------------------------
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          if [ -f "requirements.txt" ]; then
            pip install -r requirements.txt || true
          fi
          pip install pyyaml
          pip install openai || echo "OpenAI not available - mock mode enabled"

      # ---------------------------------------------------------
      # Determine batch ID
      # ---------------------------------------------------------
      - name: Determine batch ID
        id: batch
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            BATCH_ID="${{ inputs.batch_id }}"
          else
            DAY_OF_YEAR=$(date +%j)
            ROT=$(( DAY_OF_YEAR % 3 ))
            case $ROT in
              0) BATCH_ID="BATCH_ONBOARD_A" ;;
              1) BATCH_ID="BATCH_ONBOARD_B" ;;
              2) BATCH_ID="BATCH_INFRA_A" ;;
            esac
          fi
          echo "batch_id=$BATCH_ID" >> "$GITHUB_OUTPUT"
          echo "Running batch: $BATCH_ID"

      # ---------------------------------------------------------
      # Initialize GenCCC Concatenal Gate Chain
      # Sequential gates with file-based state (no env bloat)
      # Gate Order:
      # - Gate 0: Metadata Coherence Screen (conditional)
      # - Gate 1A: Cross-reference Existence (fast)
      # - Gate 1B: Cross-reference Validation (policy)
      # - Gates 2-6: Context, Versions, Traceability, OPT-IN, ATA
      # - Final Gate: Evolution Proposals + Comprehensive Graph
      # ---------------------------------------------------------
      - name: Initialize GenCCC Chain State
        id: init_chain
        run: |
          echo "=== Initializing GenCCC Chain State ==="
          mkdir -p .genccc/{issues,logs,out}
          
          # Initialize chain state JSON
          TIMESTAMP=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          cat > .genccc/chain_state.json <<EOF
          {
            "version": "1.0",
            "run_id": "${{ github.run_number }}",
            "batch_id": "${{ steps.batch.outputs.batch_id }}",
            "timestamp": "${TIMESTAMP}",
            "artifacts": [],
            "summary": {
              "total": 0,
              "passed": 0,
              "failed": 0,
              "skipped": 0,
              "warnings": 0,
              "errors": 0
            },
            "gates": {
              "gate0": {"total": 0, "passed": 0, "failed": 0, "skipped": 0},
              "gate1a": {"total": 0, "passed": 0, "failed": 0, "skipped": 0},
              "gate1b": {"total": 0, "passed": 0, "failed": 0, "skipped": 0}
            },
            "proposals": [],
            "final_graph": null
          }
          EOF
          
          echo "Chain state initialized at .genccc/chain_state.json"

      # ---------------------------------------------------------
      # Build Artifact Queue (Concatenal Order)
      # ---------------------------------------------------------
      - name: Build Artifact Queue
        id: build_queue
        run: |
          echo "=== Building Artifact Queue ==="
          
          # Target directories for this batch
          TARGET_DIRS=(
            "OPT-IN_FRAMEWORK/I-INFRASTRUCTURES/ATA_03-SUPPORT_INFORMATION_GSE"
            "OPT-IN_FRAMEWORK/I-INFRASTRUCTURES/ATA_10-PARKING_MOORING_STORAGE_RTS"
          )
          
          > .genccc/artifact_queue.txt
          
          for TARGET_DIR in "${TARGET_DIRS[@]}"; do
            if [ -d "$TARGET_DIR" ]; then
              find "$TARGET_DIR" -type f \( -name "*.md" -o -name "*.json" -o -name "*.yaml" -o -name "*.yml" \) \
                | sort >> .genccc/artifact_queue.txt
            fi
          done
          
          QUEUE_SIZE=$(wc -l < .genccc/artifact_queue.txt)
          echo "Artifact queue: $QUEUE_SIZE files"
          echo "queue_size=$QUEUE_SIZE" >> "$GITHUB_OUTPUT"

      # ---------------------------------------------------------
      # Run Concatenal Gates (Sequential, File-Based State)
      # ---------------------------------------------------------
      - name: Run Concatenal Gates (0, 1A, 1B)
        id: run_gates
        run: |
          set -euo pipefail
          echo "=== Running Concatenal Gates ==="
          
          GATE0_TOTAL=0
          GATE0_PASSED=0
          GATE0_FAILED=0
          GATE0_SKIPPED=0
          
          GATE1A_TOTAL=0
          GATE1A_PASSED=0
          GATE1A_FAILED=0
          GATE1A_SKIPPED=0
          
          while IFS= read -r artifact; do
            [ -z "$artifact" ] && continue
            
            # Generate safe ID for file names
            safe_id=$(echo "$artifact" | sed 's/[\/\.]/_/g')
            
            echo ""
            echo "=== Processing: $artifact ==="
            
            # Gate 0: Metadata Coherence Screen
            echo "  Gate 0: Metadata Coherence..."
            GATE0_TOTAL=$((GATE0_TOTAL + 1))
            
            set +e  # Don't exit on error, we need to capture exit code
            python tools/genccc/gate0_metadata_screen.py \
              --artifact "$artifact" \
              --chain .genccc/chain_state.json \
              --issues ".genccc/issues/${safe_id}.gate0.json" \
              --log ".genccc/logs/${safe_id}.gate0.log" 2>&1 | tee -a .genccc/logs/gate0_run.log
            
            EXIT_CODE=$?
            set -e  # Re-enable exit on error
            
            if [ $EXIT_CODE -eq 0 ]; then
              echo "    ✓ Passed"
              GATE0_PASSED=$((GATE0_PASSED + 1))
            elif [ $EXIT_CODE -eq 2 ]; then
              echo "    ○ Skipped (no metadata)"
              GATE0_SKIPPED=$((GATE0_SKIPPED + 1))
            else
              echo "    ✗ Failed"
              GATE0_FAILED=$((GATE0_FAILED + 1))
            fi
            
            # Gate 1A: Cross-Reference Existence
            echo "  Gate 1A: Cross-Reference Existence..."
            GATE1A_TOTAL=$((GATE1A_TOTAL + 1))
            
            set +e  # Don't exit on error
            python tools/genccc/gate1_xref_validator.py \
              --artifact "$artifact" \
              --repo-root "$(pwd)" \
              --chain .genccc/chain_state.json \
              --issues ".genccc/issues/${safe_id}.gate1a.json" \
              --log ".genccc/logs/${safe_id}.gate1a.log" 2>&1 | tee -a .genccc/logs/gate1a_run.log
            
            EXIT_CODE=$?
            set -e  # Re-enable exit on error
            
            if [ $EXIT_CODE -eq 0 ]; then
              echo "    ✓ Passed"
              GATE1A_PASSED=$((GATE1A_PASSED + 1))
            elif [ $EXIT_CODE -eq 2 ]; then
              echo "    ○ Skipped (no references)"
              GATE1A_SKIPPED=$((GATE1A_SKIPPED + 1))
            else
              echo "    ✗ Failed"
              GATE1A_FAILED=$((GATE1A_FAILED + 1))
            fi
            
          done < .genccc/artifact_queue.txt
          
          # Write summary to file (not env)
          cat > .genccc/out/gate_summary.txt <<EOF
          Gate 0 Summary:
            Total: $GATE0_TOTAL
            Passed: $GATE0_PASSED
            Failed: $GATE0_FAILED
            Skipped: $GATE0_SKIPPED
          
          Gate 1A Summary:
            Total: $GATE1A_TOTAL
            Passed: $GATE1A_PASSED
            Failed: $GATE1A_FAILED
            Skipped: $GATE1A_SKIPPED
          EOF
          
          cat .genccc/out/gate_summary.txt
          
          # Store bounded metrics in outputs
          echo "gate0_total=$GATE0_TOTAL" >> "$GITHUB_OUTPUT"
          echo "gate0_failed=$GATE0_FAILED" >> "$GITHUB_OUTPUT"
          echo "gate1a_total=$GATE1A_TOTAL" >> "$GITHUB_OUTPUT"
          echo "gate1a_failed=$GATE1A_FAILED" >> "$GITHUB_OUTPUT"

      # ---------------------------------------------------------
      # Final Gate: Evolution Proposals + Comprehensive Graph
      # ---------------------------------------------------------
      - name: Final Gate — Evolution Proposals & Visualization
        id: final_gate
        run: |
          echo "=== Final Gate: Generating Evolution Proposals & Graph ==="
          
          python tools/genccc/gate_final_visualizer.py \
            --chain .genccc/chain_state.json \
            --output .genccc/out/comprehensive_report.md \
            --graph .genccc/out/chain_visualization.svg \
            --verbose
          
          echo "Final gate completed"
          
          # Store result indicator
          if [ -f .genccc/out/comprehensive_report.md ]; then
            echo "final_report_generated=true" >> "$GITHUB_OUTPUT"
          else
            echo "final_report_generated=false" >> "$GITHUB_OUTPUT"
          fi

      # ---------------------------------------------------------
      # Run batch
      # SAFEGUARDS:
      # - Protected documents (comprehensive, validated) are skipped
      # - AI output is compared to original (30%+ reduction triggers draft mode)
      # - Batch configs use draft_sidecar mode to preserve originals
      # - Gate 0 metadata screen runs before this step
      # ---------------------------------------------------------
      - name: Run CGen Docs batch
        id: run_batch
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          DRY=""
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.dry_run }}" = "true" ]; then
            DRY="--dry-run"
          fi

          python tools/cgen_docs/run_batch.py \
            --batch-id "${{ steps.batch.outputs.batch_id }}" \
            --verbose \
            $DRY

      # ---------------------------------------------------------
      # Fill CGen placeholders
      # NOTE: Only fills actual placeholders ([To be completed], [CGEN:...])
      # Does NOT overwrite comprehensive content
      # ---------------------------------------------------------
      - name: Fill CGen placeholders in documentation
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          echo "=== Filling CGen placeholders in documentation ==="
          if [ -f tools/genccc/fill_placeholders.py ]; then
            # Process ATA_03 (Support Information & GSE) documents
            if [ -d "OPT-IN_FRAMEWORK/I-INFRASTRUCTURES/ATA_03-SUPPORT_INFORMATION_GSE" ]; then
              python tools/genccc/fill_placeholders.py \
                --target OPT-IN_FRAMEWORK/I-INFRASTRUCTURES/ATA_03-SUPPORT_INFORMATION_GSE \
                --verbose || echo "Placeholder filling completed with warnings"
            fi
            
            # Process ATA_10 (Parking, Mooring, Storage) documents
            if [ -d "OPT-IN_FRAMEWORK/I-INFRASTRUCTURES/ATA_10-PARKING_MOORING_STORAGE_RTS" ]; then
              python tools/genccc/fill_placeholders.py \
                --target OPT-IN_FRAMEWORK/I-INFRASTRUCTURES/ATA_10-PARKING_MOORING_STORAGE_RTS \
                --verbose || echo "Placeholder filling completed with warnings"
            fi
          else
            echo "tools/genccc/fill_placeholders.py not found - skipping"
          fi

      # ---------------------------------------------------------
      # Upload Gate Chain Artifacts (All Logs, Issues, Reports)
      # ---------------------------------------------------------
      - name: Upload GenCCC Chain Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: genccc-chain-${{ steps.batch.outputs.batch_id }}
          path: |
            .genccc/chain_state.json
            .genccc/issues/
            .genccc/logs/
            .genccc/out/
          retention-days: 30
          if-no-files-found: ignore

      - name: Add GenCCC Chain Summary to Job
        if: always()
        run: |
          echo "## 🔍 GenCCC Concatenal Gate Chain" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          
          if [ -f .genccc/out/gate_summary.txt ]; then
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            cat .genccc/out/gate_summary.txt >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
          fi
          
          if [ -f .genccc/out/comprehensive_report.md ]; then
            echo "### Evolution Proposals" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            # Include first 30 lines of comprehensive report
            head -30 .genccc/out/comprehensive_report.md >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "📎 Full report and visualization available in workflow artifact: **genccc-chain-${{ steps.batch.outputs.batch_id }}**" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No comprehensive report generated." >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "" >> "$GITHUB_STEP_SUMMARY"

      # ---------------------------------------------------------
      # Check for changes
      # ---------------------------------------------------------
      - name: Check for changes
        id: check_changes
        run: |
          if git diff --quiet && git diff --cached --quiet; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            echo "No changes detected"
          else
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
            echo "Changes detected:"
            git diff --stat
          fi

      # ---------------------------------------------------------
      # Generate Wave Report
      # ---------------------------------------------------------
      - name: Generate wave report
        if: steps.check_changes.outputs.has_changes == 'true'
        run: |
          mkdir -p cd/cgen_docs/logs
          python - << 'EOF'
          from tools.cgen_docs.utils.metadata import generate_wave_report
          import pathlib

          log_dir = pathlib.Path("cd/cgen_docs/logs")
          batch_id = "${{ steps.batch.outputs.batch_id }}"

          if log_dir.exists():
              report = generate_wave_report(log_dir, batch_id)
              report_file = log_dir / f"{batch_id}_report.md"
              report_file.write_text(report, encoding="utf-8")
              print(f"Report generated: {report_file}")
          else:
              print("Log directory does not exist, skipping report.")
          EOF

      # ---------------------------------------------------------
      # Create PR
      # ---------------------------------------------------------
      - name: Create Pull Request
        if: >
          steps.check_changes.outputs.has_changes == 'true' &&
          (github.event_name != 'workflow_dispatch' || inputs.dry_run != 'true')
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: cgen/docs-wave-${{ github.run_number }}-${{ steps.batch.outputs.batch_id }}
          delete-branch: true
          title: "CGen Docs Wave Update — ${{ steps.batch.outputs.batch_id }}"
          body: |
            ## CGen Docs Wave Update

            This PR was automatically generated by the **CGen Docs Waves** engine.

            **Batch:** `${{ steps.batch.outputs.batch_id }}`  
            **Run Number:** `${{ github.run_number }}`  
            **Trigger:** `${{ github.event_name }}`  

            ### Summary
            - GenCCC Concatenal Gate Chain completed
            - Gate 0 (Metadata): ${{ steps.run_gates.outputs.gate0_total }} screened, ${{ steps.run_gates.outputs.gate0_failed }} failed
            - Gate 1A (Cross-refs): ${{ steps.run_gates.outputs.gate1a_total }} validated, ${{ steps.run_gates.outputs.gate1a_failed }} failed
            - Evolution proposals and comprehensive graph generated
            - Documentation deepened and evolved
            - Cross-references enhanced
            - Document Control normalized
            - TBD/TBR processed where possible
            - AI-assisted content tagged with `ai_assist`
            - Wave report stored under `cd/cgen_docs/logs/`

            ### GenCCC Chain Results
            - Chain state, detailed logs, issues, and comprehensive visualization available in workflow artifact
            - Artifact name: `genccc-chain-${{ steps.batch.outputs.batch_id }}`
            - Comprehensive report: `.genccc/out/comprehensive_report.md`
            - Visualization graph: `.genccc/out/chain_visualization.svg`

            ### UTCS / GenCCC
            - Traceability ensured via run logs + sidecar metadata  
            - All changes require human review before merge  

            ---

            *Generated by CGen Docs Waves — human verification required.*

          labels: |
            cgen
            docs-wave
            ai-assisted
            automated
          commit-message: "docs: CGen Docs Wave update (${{ steps.batch.outputs.batch_id }})"

      # ---------------------------------------------------------
      # Summary
      # ---------------------------------------------------------
      - name: Summary
        run: |
          echo "## CGen Docs Wave Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Batch**: ${{ steps.batch.outputs.batch_id }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Artifacts queued**: ${{ steps.build_queue.outputs.queue_size }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Gate 0 screened**: ${{ steps.run_gates.outputs.gate0_total }} (failed: ${{ steps.run_gates.outputs.gate0_failed }})" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Gate 1A validated**: ${{ steps.run_gates.outputs.gate1a_total }} (failed: ${{ steps.run_gates.outputs.gate1a_failed }})" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Final report**: ${{ steps.final_gate.outputs.final_report_generated }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Changes detected**: ${{ steps.check_changes.outputs.has_changes }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Run number**: ${{ github.run_number }}" >> "$GITHUB_STEP_SUMMARY"

