name: CGen Docs Waves

on:
  schedule:
    # Run every 3 days at 02:00 UTC
    - cron: '0 2 */3 * *'
  workflow_dispatch:
    inputs:
      batch_id:
        description: 'Batch to run (e.g., BATCH_ONBOARD_A)'
        required: true
        type: string
        default: 'BATCH_ONBOARD_A'
      dry_run:
        description: 'Dry run mode (no changes / no PR)'
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write

jobs:
  cgen-docs-wave:
    name: Run CGen Docs Wave
    runs-on: ubuntu-latest

    steps:
      # ---------------------------------------------------------
      # Checkout
      # ---------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      # ---------------------------------------------------------
      # Environment
      # ---------------------------------------------------------
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          if [ -f "requirements.txt" ]; then
            pip install -r requirements.txt || true
          fi
          pip install pyyaml
          pip install openai || echo "OpenAI not available - mock mode enabled"

      # ---------------------------------------------------------
      # Determine batch ID
      # ---------------------------------------------------------
      - name: Determine batch ID
        id: batch
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            BATCH_ID="${{ inputs.batch_id }}"
          else
            DAY_OF_YEAR=$(date +%j)
            ROT=$(( DAY_OF_YEAR % 3 ))
            case $ROT in
              0) BATCH_ID="BATCH_ONBOARD_A" ;;
              1) BATCH_ID="BATCH_ONBOARD_B" ;;
              2) BATCH_ID="BATCH_INFRA_A" ;;
            esac
          fi
          echo "batch_id=$BATCH_ID" >> "$GITHUB_OUTPUT"
          echo "Running batch: $BATCH_ID"

      # ---------------------------------------------------------
      # Run batch
      # ---------------------------------------------------------
      - name: Run CGen Docs batch
        id: run_batch
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          DRY=""
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.dry_run }}" = "true" ]; then
            DRY="--dry-run"
          fi

          python tools/cgen_docs/run_batch.py \
            --batch-id "${{ steps.batch.outputs.batch_id }}" \
            --verbose \
            $DRY

      # ---------------------------------------------------------
      # Check for changes
      # ---------------------------------------------------------
      - name: Check for changes
        id: check_changes
        run: |
          if git diff --quiet && git diff --cached --quiet; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            echo "No changes detected"
          else
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
            echo "Changes detected:"
            git diff --stat
          fi

      # ---------------------------------------------------------
      # Generate Wave Report
      # ---------------------------------------------------------
      - name: Generate wave report
        if: steps.check_changes.outputs.has_changes == 'true'
        run: |
          mkdir -p cd/cgen_docs/logs
          python - << 'EOF'
          from tools.cgen_docs.utils.metadata import generate_wave_report
          import pathlib

          log_dir = pathlib.Path("cd/cgen_docs/logs")
          batch_id = "${{ steps.batch.outputs.batch_id }}"

          if log_dir.exists():
              report = generate_wave_report(log_dir, batch_id)
              report_file = log_dir / f"{batch_id}_report.md"
              report_file.write_text(report, encoding="utf-8")
              print(f"Report generated: {report_file}")
          else:
              print("Log directory does not exist, skipping report.")
          EOF

      # ---------------------------------------------------------
      # Create PR
      # ---------------------------------------------------------
      - name: Create Pull Request
        if: >
          steps.check_changes.outputs.has_changes == 'true' &&
          (github.event_name != 'workflow_dispatch' || inputs.dry_run != 'true')
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: cgen/docs-wave-${{ github.run_number }}-${{ steps.batch.outputs.batch_id }}
          delete-branch: true
          title: "CGen Docs Wave Update — ${{ steps.batch.outputs.batch_id }}"
          body: |
            ## CGen Docs Wave Update

            This PR was automatically generated by the **CGen Docs Waves** engine.

            **Batch:** `${{ steps.batch.outputs.batch_id }}`  
            **Run Number:** `${{ github.run_number }}`  
            **Trigger:** `${{ github.event_name }}`  

            ### Summary
            - Documentation deepened and evolved
            - Cross-references enhanced
            - Document Control normalized
            - TBD/TBR processed where possible
            - AI-assisted content tagged with `ai_assist`
            - Wave report stored under `cd/cgen_docs/logs/`

            ### UTCS / GenCCC
            - Traceability ensured via run logs + sidecar metadata  
            - All changes require human review before merge  

            ---

            *Generated by CGen Docs Waves — human verification required.*

          labels: |
            cgen
            docs-wave
            ai-assisted
            automated
          commit-message: "docs: CGen Docs Wave update (${{ steps.batch.outputs.batch_id }})"

      # ---------------------------------------------------------
      # Summary
      # ---------------------------------------------------------
      - name: Summary
        run: |
          echo "## CGen Docs Wave Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Batch**: ${{ steps.batch.outputs.batch_id }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Changes detected**: ${{ steps.check_changes.outputs.has_changes }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Run number**: ${{ github.run_number }}" >> "$GITHUB_STEP_SUMMARY"

