name: CGen Docs Waves

on:
  schedule:
    # Run every 3 days at 02:00 UTC
    - cron: '0 2 */3 * *'
  workflow_dispatch:
    inputs:
      batch_id:
        description: 'Batch to run (e.g., BATCH_ONBOARD_A)'
        required: true
        type: string
        default: 'BATCH_ONBOARD_A'
      dry_run:
        description: 'Dry run mode (no changes / no PR)'
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write

jobs:
  cgen-docs-wave:
    name: Run CGen Docs Wave
    runs-on: ubuntu-latest

    steps:
      # ---------------------------------------------------------
      # Checkout
      # ---------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      # ---------------------------------------------------------
      # Environment
      # ---------------------------------------------------------
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          if [ -f "requirements.txt" ]; then
            pip install -r requirements.txt || true
          fi
          pip install pyyaml
          pip install openai || echo "OpenAI not available - mock mode enabled"

      # ---------------------------------------------------------
      # Determine batch ID
      # ---------------------------------------------------------
      - name: Determine batch ID
        id: batch
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            BATCH_ID="${{ inputs.batch_id }}"
          else
            DAY_OF_YEAR=$(date +%j)
            ROT=$(( DAY_OF_YEAR % 3 ))
            case $ROT in
              0) BATCH_ID="BATCH_ONBOARD_A" ;;
              1) BATCH_ID="BATCH_ONBOARD_B" ;;
              2) BATCH_ID="BATCH_INFRA_A" ;;
            esac
          fi
          echo "batch_id=$BATCH_ID" >> "$GITHUB_OUTPUT"
          echo "Running batch: $BATCH_ID"

      # ---------------------------------------------------------
      # Gate 0 — Metadata Coherence Screen
      # Runs BEFORE any other machine validation
      # Provides early fail-fast for malformed/incoherent metadata
      # Gate Order:
      # - Gate 0: Metadata Coherence (this step)
      # - Gate 1: Cross-references validated
      # - Gate 2: Context documents generated
      # - Gate 3: Version links established
      # - Gate 4: Traceability matrix updated
      # - Gate 5: OPT-IN axis mapping verified
      # - Gate 6: ATA chapter structure compliant
      # ---------------------------------------------------------
      - name: Gate 0 — Metadata Coherence Screen
        id: gate0_metadata
        continue-on-error: true
        run: |
          echo "=== Gate 0 — Metadata Coherence Screen ==="
          
          # Initialize chain state directory
          mkdir -p .genccc/{issues,logs}
          
          # Find all markdown files in target directories that might have metadata
          TARGET_DIRS=(
            "OPT-IN_FRAMEWORK/I-INFRASTRUCTURES/ATA_03-SUPPORT_INFORMATION_GSE"
            "OPT-IN_FRAMEWORK/I-INFRASTRUCTURES/ATA_10-PARKING_MOORING_STORAGE_RTS"
          )
          
          GATE0_FAILED=0
          GATE0_TOTAL=0
          GATE0_SKIPPED=0
          GATE0_WARNINGS=0
          
          for TARGET_DIR in "${TARGET_DIRS[@]}"; do
            if [ ! -d "$TARGET_DIR" ]; then
              echo "Directory not found: $TARGET_DIR (skipping)"
              continue
            fi
            
            echo "Scanning directory: $TARGET_DIR"
            
            # Find markdown, JSON, and YAML files
            while IFS= read -r -d '' file; do
              GATE0_TOTAL=$((GATE0_TOTAL + 1))
              
              echo "  Screening: $file"
              
              # Run Gate 0 screening
              if python tools/genccc/gate0_metadata_screen.py \
                --artifact "$file" \
                --chain .genccc/chain_state.json 2>&1 | tee -a .genccc/gate0_summary.log; then
                
                EXIT_CODE=${PIPESTATUS[0]}
                
                if [ $EXIT_CODE -eq 0 ]; then
                  echo "    ✓ Passed"
                elif [ $EXIT_CODE -eq 2 ]; then
                  echo "    ○ Skipped (no metadata)"
                  GATE0_SKIPPED=$((GATE0_SKIPPED + 1))
                else
                  echo "    ✗ Failed"
                  GATE0_FAILED=$((GATE0_FAILED + 1))
                fi
              else
                EXIT_CODE=$?
                if [ $EXIT_CODE -eq 2 ]; then
                  echo "    ○ Skipped (no metadata)"
                  GATE0_SKIPPED=$((GATE0_SKIPPED + 1))
                else
                  echo "    ✗ Failed"
                  GATE0_FAILED=$((GATE0_FAILED + 1))
                fi
              fi
              
            done < <(find "$TARGET_DIR" -type f \( -name "*.md" -o -name "*.json" -o -name "*.yaml" -o -name "*.yml" \) -print0)
          done
          
          # Generate summary
          echo ""
          echo "=== Gate 0 Summary ==="
          echo "Total artifacts screened: $GATE0_TOTAL"
          echo "Passed: $((GATE0_TOTAL - GATE0_FAILED - GATE0_SKIPPED))"
          echo "Failed: $GATE0_FAILED"
          echo "Skipped (no metadata): $GATE0_SKIPPED"
          echo ""
          
          # Store results for next steps
          echo "gate0_failed=$GATE0_FAILED" >> "$GITHUB_OUTPUT"
          echo "gate0_total=$GATE0_TOTAL" >> "$GITHUB_OUTPUT"
          
          # Fail if errors found (based on policy)
          if [ $GATE0_FAILED -gt 0 ]; then
            echo "::warning title=Gate 0 Failures::Gate 0 found $GATE0_FAILED artifacts with metadata errors"
            # Note: continue-on-error is true, so this won't stop the workflow
            # Change policy here if you want to fail hard on metadata errors
          fi

      # ---------------------------------------------------------
      # Run batch
      # SAFEGUARDS:
      # - Protected documents (comprehensive, validated) are skipped
      # - AI output is compared to original (30%+ reduction triggers draft mode)
      # - Batch configs use draft_sidecar mode to preserve originals
      # - Gate 0 metadata screen runs before this step
      # ---------------------------------------------------------
      - name: Run CGen Docs batch
        id: run_batch
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          DRY=""
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.dry_run }}" = "true" ]; then
            DRY="--dry-run"
          fi

          python tools/cgen_docs/run_batch.py \
            --batch-id "${{ steps.batch.outputs.batch_id }}" \
            --verbose \
            $DRY

      # ---------------------------------------------------------
      # Fill CGen placeholders
      # NOTE: Only fills actual placeholders ([To be completed], [CGEN:...])
      # Does NOT overwrite comprehensive content
      # ---------------------------------------------------------
      - name: Fill CGen placeholders in documentation
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          echo "=== Filling CGen placeholders in documentation ==="
          if [ -f tools/genccc/fill_placeholders.py ]; then
            # Process ATA_03 (Support Information & GSE) documents
            if [ -d "OPT-IN_FRAMEWORK/I-INFRASTRUCTURES/ATA_03-SUPPORT_INFORMATION_GSE" ]; then
              python tools/genccc/fill_placeholders.py \
                --target OPT-IN_FRAMEWORK/I-INFRASTRUCTURES/ATA_03-SUPPORT_INFORMATION_GSE \
                --verbose || echo "Placeholder filling completed with warnings"
            fi
            
            # Process ATA_10 (Parking, Mooring, Storage) documents
            if [ -d "OPT-IN_FRAMEWORK/I-INFRASTRUCTURES/ATA_10-PARKING_MOORING_STORAGE_RTS" ]; then
              python tools/genccc/fill_placeholders.py \
                --target OPT-IN_FRAMEWORK/I-INFRASTRUCTURES/ATA_10-PARKING_MOORING_STORAGE_RTS \
                --verbose || echo "Placeholder filling completed with warnings"
            fi
          else
            echo "tools/genccc/fill_placeholders.py not found - skipping"
          fi

      # ---------------------------------------------------------
      # Upload Gate 0 artifacts and generate summary
      # ---------------------------------------------------------
      - name: Upload Gate 0 Metadata Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gate0-metadata-reports
          path: |
            .genccc/chain_state.json
            .genccc/issues/
            .genccc/logs/
            .genccc/gate0_summary.log
          retention-days: 30
          if-no-files-found: ignore

      - name: Add Gate 0 Summary
        if: always()
        run: |
          echo "## 🔍 Gate 0 — Metadata Coherence Screen" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          
          if [ -f .genccc/chain_state.json ]; then
            GATE0_TOTAL="${{ steps.gate0_metadata.outputs.gate0_total }}"
            GATE0_FAILED="${{ steps.gate0_metadata.outputs.gate0_failed }}"
            
            echo "- **Total artifacts screened**: ${GATE0_TOTAL:-0}" >> "$GITHUB_STEP_SUMMARY"
            echo "- **Failed**: ${GATE0_FAILED:-0}" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            
            if [ "${GATE0_FAILED:-0}" -gt 0 ]; then
              echo "⚠️ **Warning**: ${GATE0_FAILED} artifacts have metadata errors" >> "$GITHUB_STEP_SUMMARY"
              echo "" >> "$GITHUB_STEP_SUMMARY"
              echo "Review the gate0-metadata-reports artifact for details." >> "$GITHUB_STEP_SUMMARY"
            else
              echo "✅ All artifacts passed metadata coherence checks" >> "$GITHUB_STEP_SUMMARY"
            fi
          else
            echo "Gate 0 was not executed or no artifacts were screened." >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "" >> "$GITHUB_STEP_SUMMARY"

      # ---------------------------------------------------------
      # Check for changes
      # ---------------------------------------------------------
      - name: Check for changes
        id: check_changes
        run: |
          if git diff --quiet && git diff --cached --quiet; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            echo "No changes detected"
          else
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
            echo "Changes detected:"
            git diff --stat
          fi

      # ---------------------------------------------------------
      # Generate Wave Report
      # ---------------------------------------------------------
      - name: Generate wave report
        if: steps.check_changes.outputs.has_changes == 'true'
        run: |
          mkdir -p cd/cgen_docs/logs
          python - << 'EOF'
          from tools.cgen_docs.utils.metadata import generate_wave_report
          import pathlib

          log_dir = pathlib.Path("cd/cgen_docs/logs")
          batch_id = "${{ steps.batch.outputs.batch_id }}"

          if log_dir.exists():
              report = generate_wave_report(log_dir, batch_id)
              report_file = log_dir / f"{batch_id}_report.md"
              report_file.write_text(report, encoding="utf-8")
              print(f"Report generated: {report_file}")
          else:
              print("Log directory does not exist, skipping report.")
          EOF

      # ---------------------------------------------------------
      # Create PR
      # ---------------------------------------------------------
      - name: Create Pull Request
        if: >
          steps.check_changes.outputs.has_changes == 'true' &&
          (github.event_name != 'workflow_dispatch' || inputs.dry_run != 'true')
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: cgen/docs-wave-${{ github.run_number }}-${{ steps.batch.outputs.batch_id }}
          delete-branch: true
          title: "CGen Docs Wave Update — ${{ steps.batch.outputs.batch_id }}"
          body: |
            ## CGen Docs Wave Update

            This PR was automatically generated by the **CGen Docs Waves** engine.

            **Batch:** `${{ steps.batch.outputs.batch_id }}`  
            **Run Number:** `${{ github.run_number }}`  
            **Trigger:** `${{ github.event_name }}`  

            ### Summary
            - Gate 0 metadata coherence screening completed
            - Documentation deepened and evolved
            - Cross-references enhanced
            - Document Control normalized
            - TBD/TBR processed where possible
            - AI-assisted content tagged with `ai_assist`
            - Wave report stored under `cd/cgen_docs/logs/`

            ### Gate 0 — Metadata Coherence
            - Total artifacts screened: ${{ steps.gate0_metadata.outputs.gate0_total }}
            - Artifacts with errors: ${{ steps.gate0_metadata.outputs.gate0_failed }}
            - Chain state and detailed logs available in workflow artifacts

            ### UTCS / GenCCC
            - Traceability ensured via run logs + sidecar metadata  
            - All changes require human review before merge  

            ---

            *Generated by CGen Docs Waves — human verification required.*

          labels: |
            cgen
            docs-wave
            ai-assisted
            automated
          commit-message: "docs: CGen Docs Wave update (${{ steps.batch.outputs.batch_id }})"

      # ---------------------------------------------------------
      # Summary
      # ---------------------------------------------------------
      - name: Summary
        run: |
          echo "## CGen Docs Wave Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Batch**: ${{ steps.batch.outputs.batch_id }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Gate 0 screened**: ${{ steps.gate0_metadata.outputs.gate0_total }} artifacts" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Gate 0 failed**: ${{ steps.gate0_metadata.outputs.gate0_failed }} artifacts" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Changes detected**: ${{ steps.check_changes.outputs.has_changes }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Run number**: ${{ github.run_number }}" >> "$GITHUB_STEP_SUMMARY"

