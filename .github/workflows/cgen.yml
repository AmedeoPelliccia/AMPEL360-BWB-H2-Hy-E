# CGen - Continuous Generation (MVP restringido)
#
# MVP: Restringir la acción efectiva de CGen a:
#   OPT-IN_FRAMEWORK/I-INFRASTRUCTURES/ATA_03-SUPPORT_INFORMATION_GSE
# + generación de reports en cd/reports.
#
# Si algún script modifica ficheros fuera de esas rutas, el job FALLA
# y NO se crea PR.
#
# Adicional:
#   Guard anti-borrados masivos: si el diff tiene demasiadas
#   líneas borradas frente a añadidas, el job falla para
#   evitar PRs destructivos.
#   Ajusta MAX_DELETIONS si lo necesitas.

name: CGen - Continuous Generation

on:
  push:
    branches: [ main ]
  schedule:
    - cron: '0 3 * * *'   # Nightly at 3 AM UTC
  workflow_dispatch:
    inputs:
      mode:
        description: 'Generation mode'
        required: false
        default: 'full'
        type: choice
        options:
          - full
          - docs-only
          - indexes-only

permissions:
  contents: write
  pull-requests: write

jobs:
  cgen:
    name: Continuous Generation
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      CGEN_TARGET_ROOT: OPT-IN_FRAMEWORK/I-INFRASTRUCTURES/ATA_03-SUPPORT_INFORMATION_GSE

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi
          pip install openai 2>/dev/null || echo "OpenAI not needed for basic generation"

      - name: Configure Git
        run: |
          git config user.name "ampel360-cgen-bot"
          git config user.email "ampel360-cgen-bot@users.noreply.github.com"

      # ===== Lanes habituales (no tocamos la lógica interna de los scripts) =====

      - name: Generate summary tables
        run: |
          echo "=== Generating Summary Tables ==="
          mkdir -p cd/reports
          if [ -f tools/generate_summary_tables.py ]; then
            python tools/generate_summary_tables.py || echo "Summary table generation completed with warnings"
          else
            echo "generate_summary_tables.py not found - skipping"
          fi

      - name: Run GenCCC baseline report
        run: |
          echo "=== Generating GenCCC Baseline Report ==="
          mkdir -p cd/reports
          if [ -f tools/genccc/report.py ]; then
            python tools/genccc/report.py || echo "GenCCC baseline report completed with warnings"
          else
            echo "tools/genccc/report.py not found - skipping"
          fi

      - name: Generate traceability matrices
        run: |
          echo "=== Generating Traceability Matrices ==="
          if [ -f tools/genccc/traceability.py ]; then
            python tools/genccc/traceability.py || echo "Traceability generation completed with warnings"
          else
            echo "tools/genccc/traceability.py not found - skipping"
          fi

      - name: Update document indexes (CGen Lane 1 – MVP restricted)
        run: |
          echo "=== Updating Document Indexes (CGen Lane 1, MVP restricted) ==="
          # MVP: solo generar índices dentro de ATA_03-SUPPORT_INFORMATION_GSE
          if [ -f tools/ci/auto_index_generator.py ]; then
            python tools/ci/auto_index_generator.py --root "$CGEN_TARGET_ROOT" --write || echo "Index generation completed with warnings"
          else
            echo "tools/ci/auto_index_generator.py not found - skipping"
          fi

      - name: Generate requirement skeletons (if needed)
        run: |
          echo "=== Generating Missing Requirement Skeletons (global) ==="
          if [ -f tools/genccc/generate.py ]; then
            python tools/genccc/generate.py || echo "Skeleton generation completed"
          else
            echo "tools/genccc/generate.py not found - skipping"
          fi

      # ===== Detectar si hay cambios =====

      - name: Check for changes
        id: check_changes
        run: |
          echo "=== Git status after generation ==="
          git status --short || true

          if git diff --quiet && git diff --cached --quiet; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            echo "No changes to commit"
          else
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
            echo "Changes detected"
          fi

      # ===== MVP: limitar cambios a ATA_03 + cd/reports =====
      #
      # Solo se permiten cambios en:
      #  - OPT-IN_FRAMEWORK/I-INFRASTRUCTURES/ATA_03-SUPPORT_INFORMATION_GSE/**
      #  - cd/reports/**
      # Todo lo demás es error → no PR.

      - name: Enforce path restriction (MVP ATA_03 only)
        if: steps.check_changes.outputs.has_changes == 'true'
        run: |
          echo "=== Enforcing path restriction to $CGEN_TARGET_ROOT and cd/reports (MVP) ==="
          ALLOWED_ROOT_1="$CGEN_TARGET_ROOT/"
          ALLOWED_ROOT_2="cd/reports/"

          VIOLATIONS=0

          git diff --name-only > changed_files.txt
          echo "Changed files:"
          cat changed_files.txt || true
          echo "----"

          while read -r f; do
            [ -z "$f" ] && continue

            case "$f" in
              $ALLOWED_ROOT_1* | $ALLOWED_ROOT_2* )
                echo "OK: $f"
                ;;
              *)
                echo "::error::File changed outside MVP-allowed paths: $f"
                VIOLATIONS=$((VIOLATIONS+1))
                ;;
            esac
          done < changed_files.txt

          if [ "$VIOLATIONS" -gt 0 ]; then
            echo "::error::CGen modified files outside $ALLOWED_ROOT_1 and $ALLOWED_ROOT_2. Aborting PR creation (MVP)."
            exit 1
          fi

          echo "All changes are within MVP-allowed paths. Proceeding."

      # ===== Guard anti-borrados masivos =====
      #
      # Evita PRs donde se borran muchísimas líneas y se añaden muy pocas.
      # Ajusta MAX_DELETIONS si necesitas permitir diffs más grandes.

      - name: "Guard: prevent mass deletions"
        if: steps.check_changes.outputs.has_changes == 'true'
        run: |
          echo "=== Guard: checking for mass deletions ==="

          # Umbral máximo de líneas borradas permitido antes de bloquear el PR
          MAX_DELETIONS=10000

          # Sumamos adiciones y borrados solo para ficheros texto (numstat ignora bien binarios)
          read -r ADD DEL <<< "$(git diff --numstat | awk '{adds+=$1; dels+=$2} END {print adds, dels}')"

          # Normalización por si no hay cambios en texto
          [ -z "$ADD" ] && ADD=0
          [ -z "$DEL" ] && DEL=0

          echo "Total additions: $ADD"
          echo "Total deletions: $DEL"

          if [ "$DEL" -gt "$MAX_DELETIONS" ] && [ "$DEL" -gt "$ADD" ]; then
            echo "::error::Too many deletions ($DEL) compared to additions ($ADD). Aborting PR to avoid destructive changes."
            exit 1
          fi

          echo "Diff size within acceptable limits. Proceeding."

      # ===== Crear PR solo si hay cambios y han pasado los filtros =====

      - name: Create Pull Request
        if: steps.check_changes.outputs.has_changes == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: cgen/update-${{ github.run_number }}
          delete-branch: true
          title: "CGen (MVP ATA_03): Automated documentation & reports update"
          commit-message: |
            CGen (MVP ATA_03): automated documentation & reports update

            Generated by Continuous Generation pipeline (restricted to ATA_03-SUPPORT_INFORMATION_GSE + reports):
            - Summary tables updated
            - GenCCC baseline report
            - Traceability matrices
            - Document indexes refreshed under ATA_03

            AI assistance: GitHub Copilot, prompted by Amedeo Pelliccia
            Status: DRAFT - Subject to human review and approval
          body: |
            ## CGen Automated Update (MVP restricted)

            This PR contains automated updates from the Continuous Generation pipeline,
            restricted to:

            - `OPT-IN_FRAMEWORK/I-INFRASTRUCTURES/ATA_03-SUPPORT_INFORMATION_GSE/**`
            - `cd/reports/**`

            ### Changes Include:
            - 📊 Summary tables updated
            - 🔗 GenCCC baseline report
            - 📋 Traceability matrices
            - 📑 Document indexes refreshed (ATA_03 only)
            - 🔄 Cross-reference updates (if any within ATA_03)

            ### Review Instructions:
            1. Review the generated content for accuracy
            2. Verify cross-references are correct
            3. Check that AI-generated content has proper Document Control sections
            4. Approve and merge if all looks good

            ### Document Control
            - Generated with the assistance of AI (GitHub Copilot), prompted by **Amedeo Pelliccia**
            - Status: **DRAFT** – Subject to human review and approval
            - Repository: `AMPEL360-BWB-H2-Hy-E`
            - Last AI update: ${{ github.event.head_commit.timestamp }}

            ---
            **CGen Principle (MVP)**: Propose via bot PRs, restricted to ATA_03 + reports; humans approve.
          labels: |
            cgen
            documentation
            automated
          draft: false

      - name: Upload CGen reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cgen-reports-${{ github.run_number }}
          path: cd/reports/
          retention-days: 30

      - name: CGen Summary
        if: always()
        run: |
          echo "# CGen Pipeline Summary (MVP ATA_03)" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "## Generation Results" >> "$GITHUB_STEP_SUMMARY"

          if [ "${{ steps.check_changes.outputs.has_changes }}" = "true" ]; then
            echo "✅ Changes detected and processed for branch: \`cgen/update-${{ github.run_number }}\`" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "If all guards passed, a pull request has been created (MVP restricted to ATA_03 + reports)." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "ℹ️ No changes needed - all artifacts are up to date" >> "$GITHUB_STEP_SUMMARY"
          fi

          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "## Generated Artifacts" >> "$GITHUB_STEP_SUMMARY"
          echo "- Summary tables" >> "$GITHUB_STEP_SUMMARY"
          echo "- GenCCC baseline report" >> "$GITHUB_STEP_SUMMARY"
          echo "- Traceability matrices" >> "$GITHUB_STEP_SUMMARY"
          echo "- Document indexes (ATA_03 only)" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**CGen MVP Principle**: Solo toca ATA_03-SUPPORT_INFORMATION_GSE + reports; todo lo demás queda protegido, con guard anti-borrados masivos." >> "$GITHUB_STEP_SUMMARY"
