name: License Compliance & Headers

permissions:
  contents: read
  pull-requests: write

on:
  pull_request:
    paths:
      - "**/*.py"
      - "**/*.js"
      - "**/*.ts"
      - "**/*.sh"
      - "**/*.yml"
      - "**/*.yaml"
  push:
    branches: [ main ]

jobs:
  check-licenses:
    name: License Header & Compliance Check
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Collect changed files in the PR and filter by the same extensions
      # as in .licenserc.yaml: py, js, ts, sh, yml, yaml.
      - name: Get changed files (PR only)
        id: changed-files
        if: github.event_name == 'pull_request'
        run: |
          echo "Base ref: ${{ github.base_ref }}"
          echo "Head sha: ${{ github.sha }}"

          git fetch origin ${{ github.base_ref }} --depth=1

          # All changed files between base and head
          git diff --name-only origin/${{ github.base_ref }}...${{ github.sha }} > changed_files.txt || true

          echo "All changed files:"
          cat changed_files.txt || true

          # Filter to the same extensions as .licenserc.yaml
          CHANGED_FILTERED=$(grep -E '\.(py|js|ts|sh|ya?ml)$' changed_files.txt || true)
          printf "%s\n" "$CHANGED_FILTERED" > changed_filtered.txt

          echo "Filtered changed files (license scope):"
          cat changed_filtered.txt || echo "None"

          FILES=$(tr '\n' ' ' < changed_filtered.txt | sed 's/ *$//')
          echo "files=$FILES" >> $GITHUB_OUTPUT

      # License header scan for PRs: restricted to created/modified files
      - name: License header scan (PR scope)
        if: github.event_name == 'pull_request' && steps.changed-files.outputs.files != ''
        run: |
          echo "Running license header check on changed files only:"
          echo "${{ steps.changed-files.outputs.files }}"

          docker run --rm \
            -v "$PWD":/github/workspace \
            -w /github/workspace \
            apache/skywalking-eyes \
            header check \
              -c .licenserc.yaml \
              ${{ steps.changed-files.outputs.files }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # If no relevant files changed, log and skip header scan
      - name: Skip license header scan (no relevant changes)
        if: github.event_name == 'pull_request' && steps.changed-files.outputs.files == ''
        run: |
          echo "No created or modified *.py, *.js, *.ts, *.sh, *.yml, or *.yaml files in this PR."
          echo "Skipping license header scan."

      # License header scan for pushes to main: full baseline (all files per .licenserc.yaml)
      - name: License header scan (full baseline on push)
        if: github.event_name == 'push'
        uses: apache/skywalking-eyes/header@v0.6.0
        with:
          config: .licenserc.yaml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Generate SBOM (full repo on push)
      - name: Generate SBOM (syft) for repo
        if: github.event_name == 'push'
        uses: anchore/sbom-action@v0
        with:
          path: .
          format: spdx-json
          output-file: sbom.spdx.json

      # Optional SBOM on PRs (non-blocking, still full repo)
      - name: Generate SBOM (syft) for PR (non-blocking)
        if: github.event_name == 'pull_request'
        continue-on-error: true
        uses: anchore/sbom-action@v0
        with:
          path: .
          format: spdx-json
          output-file: sbom.spdx.json

      # Upload license artifacts for audit trail
      - name: Upload license artifacts
        uses: actions/upload-artifact@v4
        with:
          name: license-compliance-${{ github.sha }}
          path: |
            sbom.spdx.json
          retention-days: 90

      # Check Python dependencies if requirements files exist
      - name: Check for Python requirements
        id: check-python
        run: |
          if find . -name "requirements*.txt" -o -name "setup.py" -o -name "pyproject.toml" | grep -q .; then
            echo "has_python=true" >> $GITHUB_OUTPUT
          else
            echo "has_python=false" >> $GITHUB_OUTPUT
          fi

      - name: Set up Python
        if: steps.check-python.outputs.has_python == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Check Python dependency licenses
        if: steps.check-python.outputs.has_python == 'true'
        run: |
          pip install pip-licenses || true
          if command -v pip-licenses &> /dev/null; then
            pip-licenses --format=markdown > python-licenses.md
            echo "Generated Python dependency licenses"
            cat python-licenses.md
          else
            echo "pip-licenses not available, skipping"
          fi

      - name: Upload Python license report
        if: steps.check-python.outputs.has_python == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: python-licenses-${{ github.sha }}
          path: python-licenses.md
          retention-days: 90
        continue-on-error: true

      # Post summary comment on PRs
      - name: Post license compliance summary
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            let summary = '📋 **License Compliance Check**\n\n';

            const changedFiles = `{{ steps.changed-files.outputs.files }}`.trim();

            if (changedFiles === '') {
              summary += 'ℹ️ No relevant source files (*.py, *.js, *.ts, *.sh, *.yml, *.yaml) were created or modified in this PR.\n';
              summary += '✅ SPDX header check: Skipped (no applicable files changed)\n';
            } else {
              summary += '✅ SPDX header check: Passed for created or modified files in this PR\n';
            }

            summary += '✅ SBOM generated: `sbom.spdx.json` (see artifacts)\n';

            // Try to read Python licenses if available
            try {
              if (fs.existsSync('python-licenses.md')) {
                const licenses = fs.readFileSync('python-licenses.md', 'utf8');
                const lines = licenses.split('\n').slice(0, 15);
                summary += '\n### Python Dependencies\n```\n';
                summary += lines.join('\n');
                summary += '\n```\n';
              } else {
                summary += '\nNo Python dependencies detected or report not generated.\n';
              }
            } catch (e) {
              summary += '\nNo Python dependencies detected or report not generated.\n';
            }

            summary += '\n📦 Artifacts uploaded: `license-compliance-${{ github.sha }}`';
            summary += '\n\n*Scope: license headers checked only on created or modified files in this pull request, ';
            summary += 'for the configured file types and paths in `.licenserc.yaml`.*';

            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: summary
            });
