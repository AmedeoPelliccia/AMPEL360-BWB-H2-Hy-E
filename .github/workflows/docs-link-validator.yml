# docs-link-validator.yml
#
# Validates Markdown documentation on every PR that touches *.md files.
#
# Three jobs:
#   1. relative-link-check — lychee: broken internal/relative links → FAIL
#                            external links → WARN only (avoid EASA/FAA flakiness)
#   2. autoreferentiality-check — custom Python script: detects files that
#                                  link to themselves (H1 self-links & inline
#                                  self-links). Principle: "sempre annanz, no acopp".
#   3. pr-summary-comment — posts a consolidated findings comment on the PR.
#
# This workflow would have caught BOTH defects from PR #530:
#   - Broken xref: `53-00-03-01-005_Compatibility_with_SHM.md` does not exist
#     → job 1 (lychee) would have flagged it as a broken relative link.
#   - H1 self-link in `53-00-03-01-005_Compatibility_with_SHM_Assumptions.md`
#     → job 2 (autoreferentiality) would have emitted an ::error annotation.

name: Docs — Link & Autoreferentiality Validator

on:
  pull_request:
    paths:
      - "**/*.md"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  # ---------------------------------------------------------------------------
  # Job 1 — Relative link validation using lychee
  # ---------------------------------------------------------------------------
  relative-link-check:
    name: Relative Link Validation (lychee)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore lychee cache
        uses: actions/cache@v4
        with:
          path: .lycheecache
          key: lychee-${{ github.ref_name }}-${{ hashFiles('**/*.md') }}
          restore-keys: |
            lychee-${{ github.ref_name }}-
            lychee-

      - name: Run lychee link checker
        id: lychee
        uses: lycheeverse/lychee-action@v2
        with:
          # Scan all Markdown files; lychee config is in .lychee.toml
          args: >-
            --config .lychee.toml
            --no-progress
            --format markdown
            --output lychee-report.md
            "**/*.md"
          # Fail job on broken *internal/relative* links;
          # external failures are accepted per .lychee.toml
          fail: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

      - name: Upload lychee report
        uses: actions/upload-artifact@v4
        with:
          name: lychee-link-report
          path: lychee-report.md
          retention-days: 30
          if-no-files-found: warn

      - name: Fail job if lychee found broken links
        if: steps.lychee.outcome == 'failure'
        run: |
          echo "::error::lychee detected broken relative links. See artifact 'lychee-link-report' for details."
          exit 1

  # ---------------------------------------------------------------------------
  # Job 2 — Autoreferentiality check (custom Python script)
  # ---------------------------------------------------------------------------
  autoreferentiality-check:
    name: Autoreferentiality Check (sempre annanz, no acopp)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run self-test (built-in doctests)
        run: python scripts/check_autoreferentiality.py --self-test

      - name: Run autoreferentiality scan
        id: autoref
        run: |
          python scripts/check_autoreferentiality.py --root OPT-IN_FRAMEWORK \
            2>&1 | tee autoref-report.txt
          echo "exit_code=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"
        continue-on-error: true

      - name: Upload autoreferentiality report
        uses: actions/upload-artifact@v4
        with:
          name: autoref-report
          path: autoref-report.txt
          retention-days: 30
          if-no-files-found: warn

      - name: Fail job if self-referential links found
        if: steps.autoref.outputs.exit_code != '0'
        run: |
          echo "::error::Self-referential links detected. See artifact 'autoref-report' and annotations above."
          exit 1

  # ---------------------------------------------------------------------------
  # Job 3 — Summary comment on the PR
  # ---------------------------------------------------------------------------
  pr-summary-comment:
    name: Post PR Summary Comment
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [relative-link-check, autoreferentiality-check]
    if: always() && github.event_name == 'pull_request'
    permissions:
      pull-requests: write

    steps:
      - name: Download lychee report (if any)
        uses: actions/download-artifact@v4
        with:
          name: lychee-link-report
          path: artifacts/
        continue-on-error: true

      - name: Download autoref report (if any)
        uses: actions/download-artifact@v4
        with:
          name: autoref-report
          path: artifacts/
        continue-on-error: true

      - name: Build and post summary comment
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const path = require('path');

            const lycheeStatus = '${{ needs.relative-link-check.result }}';
            const autorefStatus = '${{ needs.autoreferentiality-check.result }}';

            const icon = (s) => s === 'success' ? '✅' : s === 'failure' ? '❌' : '⚠️';

            let body = `## 🔗 Docs Link & Autoreferentiality Report\n\n`;
            body += `| Check | Status |\n|---|---|\n`;
            body += `| Relative link validation (lychee) | ${icon(lycheeStatus)} ${lycheeStatus} |\n`;
            body += `| Autoreferentiality (sempre annanz) | ${icon(autorefStatus)} ${autorefStatus} |\n\n`;

            // Append lychee summary (first 60 lines to avoid comment size limits)
            const lycheePath = 'artifacts/lychee-report.md';
            if (fs.existsSync(lycheePath)) {
              const lines = fs.readFileSync(lycheePath, 'utf8').split('\n').slice(0, 60);
              body += `### Lychee Link Report (excerpt)\n\n<details>\n<summary>Click to expand</summary>\n\n`;
              body += lines.join('\n') + '\n\n</details>\n\n';
            }

            // Append autoref findings (first 40 lines)
            const autorefPath = 'artifacts/autoref-report.txt';
            if (fs.existsSync(autorefPath)) {
              const lines = fs.readFileSync(autorefPath, 'utf8').split('\n').slice(0, 40);
              body += `### Autoreferentiality Findings (excerpt)\n\n<details>\n<summary>Click to expand</summary>\n\n\`\`\`\n`;
              body += lines.join('\n') + '\n```\n\n</details>\n\n';
            }

            body += `---\n*Principle: **Sempre annanz, no acopp** — documents move the reader forward; they never link to themselves.*\n`;
            body += `*This guardrail would have caught both defects from PR #530:*\n`;
            body += `*  • Broken xref \`53-00-03-01-005_Compatibility_with_SHM.md\` (non-existent) → lychee job*\n`;
            body += `*  • H1 self-link in \`53-00-03-01-005_Compatibility_with_SHM_Assumptions.md\` → autoreferentiality job*\n`;

            // Find or create the bot comment
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const botComment = comments.find(c =>
              c.user.type === 'Bot' && c.body.includes('Docs Link & Autoreferentiality Report')
            );

            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
