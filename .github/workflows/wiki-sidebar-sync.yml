# Wiki Sidebar Sync
#
# This workflow synchronizes the wiki _Sidebar.md with internal links
# detected across all markdown files in the repository.
#
# Features:
# - Scans all .md files for [[...]] internal wiki links
# - Compares detected links with _Sidebar.md content
# - Creates a PR if the sidebar needs updating

name: Wiki Sidebar Sync

on:
  push:
    branches:
      - main
    paths:
      - "**.md"
      - "tools/wiki/**"
      - ".github/workflows/wiki-sidebar-sync.yml"
  workflow_dispatch:

jobs:
  sidebar-sync:
    runs-on: ubuntu-latest

    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run sidebar sync
        run: |
          python tools/wiki/sidebar_sync.py

      - name: Check for sidebar changes
        id: sidebar-check
        run: |
          if git diff --quiet -- _Sidebar.md; then
            echo "No changes detected in _Sidebar.md"
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "Changes detected in _Sidebar.md:"
            git diff -- _Sidebar.md
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Verify sidebar update
        run: |
          echo "=== Current _Sidebar.md content ==="
          cat _Sidebar.md
          echo ""
          echo "=== Sidebar sync verification complete ==="

      - name: Add job summary
        run: |
          echo "## Wiki Sidebar Sync Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "${{ steps.sidebar-check.outputs.changed }}" == "true" ]; then
            echo "✅ **Sidebar updated** - A PR will be created with the changes." >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### Changes:" >> $GITHUB_STEP_SUMMARY
            echo '```diff' >> $GITHUB_STEP_SUMMARY
            git diff -- _Sidebar.md >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          else
            echo "✅ **Sidebar is up to date** - No changes needed." >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Current Sidebar Content:" >> $GITHUB_STEP_SUMMARY
          echo '```markdown' >> $GITHUB_STEP_SUMMARY
          cat _Sidebar.md >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Create Pull Request for sidebar update
        if: github.repository == 'AmedeoPelliccia/AMPEL360-BWB-H2-Hy-E' && steps.sidebar-check.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          commit-message: "chore(wiki): sync _Sidebar.md with internal links"
          title: "Wiki: sync _Sidebar.md with internal links"
          body: |
            This pull request was automatically generated by the
            **Wiki Sidebar Sync** workflow.

            It updates `_Sidebar.md` to reflect all internal wiki links
            detected in Markdown pages:

            - Adds missing `[[...]]` links to the AUTO-GENERATED block
            - Keeps manual sections (LC channels, OPT-IN, ATA, RBAC, IAM, CSDB) intact
            - Ensures the sidebar acts as a living TOC of actual wiki usage

            Please review and merge if the changes look correct.
          branch: chore/wiki-sidebar-sync
          branch-suffix: short-commit-hash
          labels: |
            wiki
            automation
          add-paths: |
            _Sidebar.md
          base: main
